<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リクルート判定システム</title>
  <meta name="description" content="アルバイト面接を面接台本（スタッフ面接チェックリスト）のとおりに入力し、A4 の面接チェックリスト報告（電子印・最終合否つき）を作るアプリ。応募者の名前と属性 → 面接チェックリスト → 報告書の 3 ステップ。">
  <style>
/* =====================================================================
   リクルート判定システム — スタイル
   デザイントークン → レイアウト → コンポーネント → 画面別 → 印刷
   ===================================================================== */

:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #eef2f6;
  --text: #1a2233;
  --muted: #5b6675;
  --border: #dde3ea;
  --border-strong: #c7d0db;

  --accent: #1f5fbf;
  --accent-hover: #184c99;
  --accent-soft: #e6eefb;
  --on-accent: #ffffff;

  --ok: #0e9f6e;      --ok-soft: #e3f6ee;
  --warn: #d97706;    --warn-soft: #fdf1dc;
  --danger: #dc2626;  --danger-soft: #fde8e8;
  --info: #2563eb;    --info-soft: #e5edff;

  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .10);
  --shadow-lg: 0 8px 24px rgba(16, 24, 40, .12);
  --radius: 10px;
  --radius-sm: 6px;
  --sidebar-w: 248px;
  --summary-w: 312px;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0f141a;
  --surface: #171e27;
  --surface-2: #1d2631;
  --surface-3: #232e3b;
  --text: #e6ebf1;
  --muted: #93a1b1;
  --border: #263140;
  --border-strong: #35435500;
  --border-strong: #354355;
  --accent: #5b9cff;
  --accent-hover: #7cb0ff;
  --accent-soft: #1b2a44;
  --on-accent: #0b1220;
  --ok: #34c38f;      --ok-soft: #12302a;
  --warn: #f5a623;    --warn-soft: #3a2a12;
  --danger: #f06565;  --danger-soft: #3b1a1d;
  --info: #6ea2ff;    --info-soft: #1a2742;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a;
    --surface: #171e27;
    --surface-2: #1d2631;
    --surface-3: #232e3b;
    --text: #e6ebf1;
    --muted: #93a1b1;
    --border: #263140;
    --border-strong: #354355;
    --accent: #5b9cff;
    --accent-hover: #7cb0ff;
    --accent-soft: #1b2a44;
    --on-accent: #0b1220;
    --ok: #34c38f;      --ok-soft: #12302a;
    --warn: #f5a623;    --warn-soft: #3a2a12;
    --danger: #f06565;  --danger-soft: #3b1a1d;
    --info: #6ea2ff;    --info-soft: #1a2742;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

/* ---------- ベース ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 15px; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.35; }
p { margin: 0; }
a { color: var(--accent); }
button { font-family: inherit; }
code { font-family: var(--mono); font-size: .85em; }
.hidden { display: none !important; }
.muted { color: var(--muted); }

.num { font-variant-numeric: tabular-nums; }

input, select, textarea {
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
input[type="time"], input[type="month"], input[type="number"] { width: auto; min-width: 9em; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
input.invalid, select.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }

/* ---------- アプリ骨格 ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 18px 14px;
  overflow-y: auto;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: linear-gradient(135deg, var(--accent), #6f3fd1);
  color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 17px; letter-spacing: .02em;
}
.brand-title { font-weight: 700; font-size: 13.5px; line-height: 1.3; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--muted); line-height: 1.3; }
/* ロゴ（brand.js）があるとき: ロゴを上に置き、アプリ名・劇場名をその下に */
.brand.has-logo { flex-direction: column; align-items: flex-start; gap: 8px; }
.brand-logo { display: block; width: 100%; max-width: 200px; height: auto; }
.brand-logo[hidden], .brand-mark[hidden] { display: none; }
/* ダークモードでは灰色の文字が沈むので、白い台紙に載せる */
:root[data-theme="dark"] .brand-logo { background: #fff; padding: 6px 8px; border-radius: 8px; box-sizing: border-box; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-logo { background: #fff; padding: 6px 8px; border-radius: 8px; box-sizing: border-box; } }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px; border: none; background: none;
  color: var(--text); font-size: 14px; font-weight: 500; text-align: left; cursor: pointer;
}
.nav-item:hover { background: var(--surface-3); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-item .ico { width: 18px; text-align: center; font-size: 15px; opacity: .85; }

.side-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted);
  text-transform: uppercase; padding: 0 8px; margin-bottom: 6px;
}
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step {
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
  padding: 8px 8px; border-radius: 8px; cursor: pointer; position: relative;
}
.step:hover:not(.disabled) { background: var(--surface-3); }
.step.disabled { cursor: not-allowed; opacity: .55; }
.step-num {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; border: 2px solid var(--border-strong); color: var(--muted); background: var(--surface);
}
.step.current .step-num { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step.done .step-num { border-color: var(--ok); background: var(--ok); color: #fff; }
.step-label { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.step.current .step-label { color: var(--accent); }
.step-hint { font-size: 11.5px; color: var(--muted); line-height: 1.3; }

.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.sidebar-foot .version { font-size: 11px; color: var(--muted); line-height: 1.4; }

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 28px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.top-title { font-size: 17px; font-weight: 700; }
.chip-applicant {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  font-size: 12.5px; color: var(--muted);
}
.chip-applicant strong { color: var(--text); }
.chip-applicant .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip-applicant.dirty .dot { background: var(--warn); }
.chip-applicant.saved .dot { background: var(--ok); }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.view { padding: 22px 28px 60px; }
.view-footer { margin-top: 36px; font-size: 11.5px; color: var(--muted); text-align: center; }

.judge-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--summary-w);
  gap: 22px;
  align-items: start;
}
.work { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.summary { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 1180px) {
  .judge-layout { grid-template-columns: 1fr; }
  .summary { position: static; }
}
/* 報告書（③）: 右サマリーの横で A4 の紙が等倍で入らない幅（1280px・1366px など）は、右サマリーを紙の下に回して紙を等倍（本文 9.5px）で見せる（app.js fitReportPaper が付ける） */
.judge-layout.paper-stack { grid-template-columns: minmax(0, 1fr); }
.judge-layout.paper-stack .summary { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }
@media (max-width: 840px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .topbar, .view { padding-left: 16px; padding-right: 16px; }
  .field-row { grid-template-columns: 1fr !important; }
}

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border-strong)); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 7px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions.end { justify-content: flex-end; }
.actions.between { justify-content: space-between; }

/* ---------- カード ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-head h2 { font-size: 16px; font-weight: 700; }
.card-head h3 { font-size: 15px; font-weight: 700; }
.card-head p { font-size: 13px; color: var(--muted); width: 100%; }
.card-head .spacer { flex: 1; }
.card h3.sub {
  font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em;
  margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.card h3.sub:first-child { margin-top: 0; }

/* ---------- フォーム ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 600; color: var(--text); }
.req { color: var(--danger); font-weight: 700; margin-left: 2px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
.field-row { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.field-row.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.suffix { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* ---------- アラート・バッジ ---------- */
.alert {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid; font-size: 13.5px; line-height: 1.5;
}
.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.alert.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.alert .ico { flex: none; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
  background: var(--surface-3); color: var(--muted); border: 1px solid transparent;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--info-soft); color: var(--info); }

.badge.lg { font-size: 14px; padding: 5px 14px; }

.tag { font-size: 11.5px; color: var(--muted); padding: 1px 7px; border: 1px solid var(--border); border-radius: 4px; white-space: nowrap; }

/* ---------- ボタン式の選択（面接チェックリスト・応募した求人） ---------- */
.score-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-btn {
  width: 46px; height: 40px; border: none; border-right: 1px solid var(--border); background: transparent;
  font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer;
}
.seg-btn:last-child { border-right: none; }
.seg-btn:hover { background: var(--surface-3); }
.seg-btn.active { background: var(--accent); color: var(--on-accent); }

/* ---------- リスト ---------- */
.list-plain { margin: 0; padding-left: 1.2em; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.list-x { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.list-x li::before { content: "！ "; color: var(--danger); font-weight: 800; }

/* ---------- 右サマリー ---------- */
.summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
.summary-card h4 { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
.sum-name { font-size: 18px; font-weight: 800; line-height: 1.3; }
.sum-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sum-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
.sum-row:last-child { border-bottom: none; }
.sum-label { color: var(--muted); }
.sum-val { font-weight: 600; text-align: right; }

/* ---------- 設定画面 ---------- */
.settings-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: start; }
.settings-nav { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 2px; }
.settings-nav a { display: block; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; color: var(--text); text-decoration: none; }
.settings-nav a:hover { background: var(--surface-3); }
.settings-body { display: flex; flex-direction: column; gap: 18px; padding-bottom: 80px; }
@media (max-width: 900px) { .settings-layout { grid-template-columns: 1fr; } .settings-nav { position: static; flex-direction: row; flex-wrap: wrap; } }
.save-bar {
  position: sticky; bottom: 0; z-index: 15; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 20px; margin: 0 -28px -60px; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--border);
}
.save-bar .note { font-size: 12.5px; color: var(--muted); margin-right: auto; }
/* 狭い画面では .view の左右余白が 16px になるので、はみ出さないよう合わせる */
@media (max-width: 840px) { .save-bar { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; } }
.check-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.check-row:last-child { border-bottom: none; }
.check-row input { margin-top: 4px; width: 17px; height: 17px; }
.check-row .lbl { font-size: 14px; font-weight: 600; }
.check-row .hint { margin-top: 1px; }

.row-actions { display: flex; gap: 4px; }
.row-actions .btn { padding: 5px 9px; font-size: 12.5px; }

.s-issues ul { margin: 6px 0 0; padding-left: 1.2em; }
.s-issues li { margin: 2px 0; }

.s-details { margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; background: var(--surface-2); }
.s-details > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; padding: 2px 0; }
.s-details[open] > summary { margin-bottom: 10px; }

/* ---------- アラートの間隔 ---------- */
.card > .alert { margin-bottom: 12px; }
.field + .alert, .field-row + .alert { margin-top: -4px; }

/* ---------- 使い方 ---------- */
.help-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.help-step { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
.help-step .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 13px; margin-bottom: 8px; }
.help-step h3 { font-size: 14.5px; margin-bottom: 4px; }
.help-step p { font-size: 13px; color: var(--muted); }

/* ---------- トースト ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 10px;
  font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; max-width: min(90vw, 560px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--danger); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }

/* ---------- 印刷 ---------- */
@media print {
  @page { size: A4; margin: 10mm 11mm; }
  html { font-size: 11px; }
  body { background: #fff; color: #000; line-height: 1.45; }
  .sidebar, .topbar, .summary, .actions, .toast, .no-print, .view-footer { display: none !important; }
  .app { display: block; }
  .view { padding: 0; }
  .judge-layout { display: block; }
  .work { gap: 8px; }
  /* 大きなカードは途中で改ページしてよい（丸ごと次ページへ送ると大きな空白が出る）。小さな行だけ分割を避ける */
  .card { box-shadow: none; break-inside: auto; border-color: #bbb; padding: 10px 14px 12px; border-radius: 8px; }
  .card-head { margin-bottom: 8px; break-after: avoid; }
  .card-head h2 { font-size: 13px; }
  .card h3.sub { margin: 10px 0 6px; break-after: avoid; }
  .stamp-row, .alert { break-inside: avoid; }
  .stamp-area { height: 80px; }
  .hanko { width: 70px; height: 70px; }
}

/* ---------- 応募者の管理（押印） ---------- */
.stamp-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
/* 押印欄が 2 つ（既定: 面接対応者・最終確認）のときは 2 列（docs/SPEC-slim.md D10） */
.stamp-row.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stamp-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 10px 10px; text-align: center; background: var(--surface-2); min-width: 0; }
.stamp-label { font-size: 12.5px; font-weight: 700; color: var(--text); }
.stamp-hint { font-size: 11px; color: var(--muted); line-height: 1.4; min-height: 1.4em; margin-bottom: 6px; }
.stamp-area { height: 100px; display: grid; place-items: center; }
.stamp-empty { width: 84px; height: 84px; border: 2px dashed var(--border-strong); border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: var(--muted); background: var(--surface); }
.stamp-meta { font-size: 12px; color: var(--muted); min-height: 1.3em; line-height: 1.4; }
.stamp-ctl { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.stamp-ctl select { width: auto; max-width: 100%; padding: 6px 8px; font-size: 13px; }
.stamp-ctl .stamp-free { width: 100%; padding: 6px 8px; font-size: 13px; }
.stamp-preview { display: grid; place-items: center; padding: 10px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); }
:root[data-theme="dark"] .hanko { filter: brightness(1.25); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hanko { filter: brightness(1.25); } }
@media (max-width: 760px) { .stamp-row, .stamp-row.cols-2 { grid-template-columns: 1fr; } }

/* ---------- 最終合否（報告書 ③。docs/SPEC-report.md 5-3） ---------- */
.decision-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 20px; align-items: center; }
.decision-stamp { width: 128px; height: 82px; display: grid; place-items: center; }
.verdict-empty { width: 118px; height: 72px; border: 2px dashed var(--border-strong); border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); }
.decision-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.decision-meta { font-weight: 700; }
.decision-card.is-none .decision-meta { color: var(--muted); font-weight: 600; }
.decision-note { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 4px 10px; }
.decision-ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.decision-ctl select { width: auto; max-width: 100%; padding: 6px 8px; font-size: 13px; }
.decision-ctl .stamp-free { width: auto; min-width: 12em; padding: 6px 8px; font-size: 13px; }
.btn.decide-btn { font-weight: 800; color: var(--dec); border: 1.5px solid var(--dec); }
.btn.decide-btn:hover, .btn.decide-btn.on { background: var(--dec); color: #fff; }
.badge.dec-hire { background: transparent; border: 1.5px solid #c8232c; color: #c8232c; }
.badge.dec-reject { background: transparent; border: 1.5px solid #1f4e8c; color: #1f4e8c; }
.verdict-preview { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
:root[data-theme="dark"] #decisionCard .verdict-stamp, :root[data-theme="dark"] .verdict-preview .verdict-stamp { filter: brightness(1.35); }
:root[data-theme="dark"] .badge.dec-hire { color: #ff8f95; border-color: #ff8f95; }
:root[data-theme="dark"] .badge.dec-reject { color: #9dbcf0; border-color: #9dbcf0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #decisionCard .verdict-stamp, :root:not([data-theme="light"]) .verdict-preview .verdict-stamp { filter: brightness(1.35); }
  :root:not([data-theme="light"]) .badge.dec-hire { color: #ff8f95; border-color: #ff8f95; }
  :root:not([data-theme="light"]) .badge.dec-reject { color: #9dbcf0; border-color: #9dbcf0; }
}
@media (max-width: 760px) { .decision-body { grid-template-columns: 1fr; } }
@media print { #decisionCard.is-none { display: none !important; } #decisionCard .verdict-stamp { width: 96px; height: 61px; filter: none; } }

/* ---------- 最終承認のパスワード（docs/SPEC-a4.md 11 章）: ③ のカードのパスワード欄・JSON の読み込み／初期化のダイアログ・設定 ---------- */
.final-lock { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; padding: 8px 10px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); text-align: left; }
.final-lock-msg { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.final-lock-ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.final-lock-ctl .final-lock-pw { width: auto; flex: 1 1 10em; min-width: 8em; padding: 6px 8px; font-size: 13px; }
.final-lock-err, .pw-dialog-err, .lock-err { font-size: 12.5px; font-weight: 700; color: var(--danger); }
.final-lock-err:empty, .pw-dialog-err:empty, .lock-err:empty { display: none; }
.pw-dialog-back { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: rgba(16, 24, 40, .45); }
.pw-dialog { width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); }
.pw-dialog h3 { font-size: 15px; }
.pw-dialog p { font-size: 13px; color: var(--muted); }
.pw-dialog .actions { justify-content: flex-end; }
.lock-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0 8px; }
.lock-form { display: flex; flex-direction: column; gap: 4px; max-width: 26em; margin-bottom: 8px; }
.lock-form .field { margin-bottom: 4px; }
@media print { .pw-dialog-back { display: none !important; } }

/* ---------- ① 応募者・② のヘッダー・③ 報告書（docs/SPEC-script-mode.md） ---------- */
.cl-head-attrs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cl-attr { display: inline-flex; gap: 6px; align-items: baseline; padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; max-width: 100%; overflow-wrap: anywhere; }
.cl-attr small { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cl-attr-name { font-size: 14px; font-weight: 700; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
/* Step② の読み取り専用ヘッダー（1 行。docs/SPEC-script-mode.md 12 章） */
.card.cl-head-line { padding: 8px 12px; }
.cl-head-line .cl-head-attrs { gap: 4px; }
.cl-head-line .cl-attr { padding: 2px 7px; gap: 4px; font-size: 12.5px; }
.cl-head-line .cl-attr small { font-size: 10.5px; }
.cl-head-line .cl-attr-name { font-size: 13.5px; }
/* 「応募者を編集」はリンクの見た目（枠なし）で右端へ */
.cl-head-line .cl-head-edit { margin-left: auto; padding: 2px 4px; border: 0; background: none; color: var(--accent); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.cl-head-line .cl-head-edit:hover { background: var(--accent-soft); }
/* 本文が狭い幅（1400px 以下。1280px で本文 約 640px）: チップを一段詰め、「応募者を編集」はカード上端の枠線上・右へ出してチップの行から外す（チップは 1 行のまま） */
@media screen and (max-width: 1400px) {
  .card.cl-head-line { position: relative; padding: 8px 10px; }
  .cl-head-line .cl-head-attrs { gap: 3px; }
  .cl-head-line .cl-attr { padding: 2px 6px; gap: 3px; font-size: 12px; }
  .cl-head-line .cl-attr small { font-size: 10px; }
  .cl-head-line .cl-attr-name { font-size: 13px; }
  .cl-head-line .cl-head-edit { position: absolute; top: -9px; right: 12px; margin: 0; padding: 0 6px; line-height: 16px; font-size: 11.5px; border-radius: 4px; background: var(--surface); }
  .cl-head-line .cl-head-edit:hover { background: var(--accent-soft); }
}
/* Step① 応募者（1 枚・3 行。docs/SPEC-script-mode.md 12 章） */
#scriptApplicantCard { padding: 16px 20px 4px; }
#scriptApplicantCard .card-head { margin-bottom: 10px; align-items: baseline; }
#scriptApplicantCard .card-head p { width: auto; flex: 1; min-width: 14em; }
#scriptApplicantCard .field { margin-bottom: 12px; }
#scriptApplicantCard textarea { min-height: 0; resize: vertical; }
/* 1 行目は flex（卒業予定年月は学生の区分のときだけ末尾に出る）。狭くて入らないときだけ卒業予定年月が次の行へ回る */
.sa-row1 { display: flex; flex-wrap: wrap; gap: 0 10px; }
.sa-row1 > .field { flex: 1.25 1 0; min-width: 118px; }
.sa-row1 > .field:first-child { flex-grow: 1.3; min-width: 120px; }  /* 氏名 */
.sa-row1 > .field:nth-child(2) { flex-grow: .55; min-width: 64px; }  /* 年齢（2 桁＋「歳」） */
.sa-row1 > .field:nth-child(3) { flex-grow: .8; min-width: 116px; }  /* 性別（最長の「回答しない」が▼と重ならない幅。未選択の文言は「選択」） */
.sa-row1 > .field:nth-child(4) { flex-grow: 1.1; min-width: 110px; } /* 区分 */
.sa-row1 .inline { flex-wrap: nowrap; gap: 6px; }
.sa-row1 input, .sa-row1 select { padding-left: 9px; padding-right: 9px; }
.sa-row1 input[type="number"], .sa-row1 input[type="month"] { min-width: 0; width: 100%; }
.sa-row1 .inline input { flex: 1 1 auto; }
.sa-row1 input[type="number"] { -moz-appearance: textfield; appearance: textfield; }   /* 年齢は 2 桁なので増減ボタンを出さない（幅を取らない） */
.sa-row1 input[type="number"]::-webkit-inner-spin-button, .sa-row1 input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sa-row2 #saPosting .cl-seg { width: 100%; }
.sa-row2 #saPosting .seg-btn { flex: 1 1 0; }
.sa-row3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
@media (max-width: 840px) { .sa-row1 { flex-direction: column; } .sa-row1 > .field { flex: none; min-width: 0; } }
.sum-attrs .badge { margin-left: 2px; vertical-align: 1px; }
.cl-all-btn { margin-left: auto; font-weight: 600; }
.report-paper-wrap { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 2px 14px; }
.report-paper-cap { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; width: 210mm; max-width: 100%; margin: 0 auto 6px; font-size: 12px; color: var(--muted); }
.report-paper-cap b { color: var(--text); }
/* ③ の紙は保存 HTML と同じ A4 縦の用紙（210×297mm・余白・白地・影は共有の .a4。storage.checklistSheetCss）。docs/SPEC-a4.md 5 章 */
#appPaper.a4 { margin: 0 auto; }
.sum-stamps { font-size: 12px; font-weight: 600; text-align: right; }
#sumStamps .sum-label { white-space: nowrap; }

@media print { .report-paper-wrap { display: none !important; } }

/* ---------- 面接チェックリスト（②。docs/SPEC-checklist.md 2 章） ---------- */
.toast.warn { background: var(--warn); color: #fff; }
.badge.muted { background: var(--surface-3); color: var(--muted); border-color: var(--border); }
.seg-btn.wide { width: auto; min-width: 46px; padding: 0 12px; font-size: 13.5px; white-space: nowrap; }
.seg-btn.cl-mark { width: 48px; height: 40px; font-size: 18px; }
.seg-btn.active.match, .seg-btn.active.good, .seg-btn.active.hire { background: var(--ok); color: #fff; }
.seg-btn.active.fair, .seg-btn.active.hold { background: var(--warn); color: #fff; }
.seg-btn.active.mismatch, .seg-btn.active.poor, .seg-btn.active.reject { background: var(--danger); color: #fff; }
.cl-seg.lg .seg-btn { height: 44px; font-size: 15px; padding: 0 18px; }
.cl-seg { flex: none; max-width: 100%; }
.field > .cl-seg { align-self: flex-start; }
.cl-must-row { grid-template-columns: minmax(0, 1fr) auto 4.6em; }
.cl-unknown.is-off { visibility: hidden; }

.cl-nav {
  position: sticky; top: 57px; z-index: 15;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(6px); box-shadow: var(--shadow);
}
.cl-nav .spacer { flex: 1; }
.cl-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
}
.cl-chip:hover { background: var(--surface-3); }
.cl-chip small { color: var(--muted); font-weight: 600; }
.cl-chip.done { border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); background: var(--ok-soft); color: var(--ok); }
.cl-chip.ng { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); background: var(--danger-soft); color: var(--danger); }
.cl-chip-mark:empty { display: none; }
.cl-nav-score { font-size: 13px; font-weight: 700; color: var(--text); }

.cl-page-head { padding: 6px 4px 0; border-bottom: 2px solid var(--accent); font-size: 14px; color: var(--accent); }
.cl-page-head .hint { margin: 2px 0 6px; }
.cl-sec { scroll-margin-top: 120px; }
#clOverall { scroll-margin-top: 120px; }
.cl-no { display: inline-block; margin-right: 6px; color: var(--accent); font-weight: 800; }
.cl-sec-state:empty { display: none; }
.cl-skip-note { display: none; font-size: 12px; font-weight: 700; color: var(--danger); align-self: center; }
.cl-sec.cl-skippable { border-style: dashed; }
.cl-sec.cl-skippable .cl-skip-note { display: inline; }

.cl-block { margin-top: 14px; }
.cl-block:first-of-type { margin-top: 0; }
.cl-block-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13.5px; font-weight: 700; margin-bottom: 8px; }
.cl-block-note { font-size: 12px; font-weight: 600; color: var(--muted); }
.cl-block-note.strong { color: var(--warn); }
.cl-legend { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
.cl-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px 14px; align-items: center;
  padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); margin-bottom: 6px;
}
.cl-row-main { min-width: 0; }
.cl-label { font-size: 14.5px; line-height: 1.45; overflow-wrap: anywhere; }
.cl-label.b { font-weight: 700; }
.cl-rate-row { grid-template-columns: minmax(0, 1fr) auto minmax(10em, 16em); }
.cl-note { min-width: 0; }
.cl-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
.cl-fields .field { margin-bottom: 8px; }
.cl-fields input[type="date"], .cl-fields input[type="month"] { width: auto; min-width: 11em; }
.cl-checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.cl-checks.one-col { grid-template-columns: 1fr; }
.cl-check {
  display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); font-size: 13.5px; line-height: 1.45; cursor: pointer; min-width: 0;
}
.cl-check > span:first-of-type { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cl-check input { margin-top: 3px; flex: none; }
.cl-check.on { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
.cl-check .tag { flex: none; }
.cl-check.dim { opacity: .55; }
.cl-check.emph { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn); }
.cl-questions { margin: 0 0 8px; padding-left: 1.6em; display: flex; flex-direction: column; gap: 6px; }
.cl-questions li { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
.cl-memo { margin-bottom: 4px; }
.cl-memo textarea { min-height: 70px; }
.cl-notify-note { margin: -4px 0 6px; }
.cl-flow { margin: 12px 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600; }

.dim { opacity: .55; }

.cl-overall-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.cl-overall-row .cl-label { flex: 1; min-width: 10em; }
.cl-score { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px; font-size: 14px; font-weight: 600; }
.cl-score #clScoreTotal { font-size: 26px; }
.cl-score-pct { font-size: 16px; font-weight: 800; }
.cl-must-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.cl-must-summary:empty { display: none; }
.cl-ms-label { font-size: 13px; font-weight: 700; }
.cl-notes-field { margin-top: 10px; margin-bottom: 0; }
#overallWarn { margin-top: 6px; }

/* 右サマリー */
#sumMust .sum-val { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

@media (max-width: 840px) {
  .cl-row, .cl-must-row, .cl-rate-row { grid-template-columns: minmax(0, 1fr); }
  .cl-unknown.is-off { display: none; }
  .cl-unknown { justify-self: start; }
  .cl-fields, .cl-checks { grid-template-columns: minmax(0, 1fr); }
  .cl-nav { top: 0; position: static; }
  .cl-legend { margin-left: 0; }
}
@media (max-width: 480px) {
  .seg-btn.wide { padding: 0 8px; font-size: 12.5px; }
  .cl-seg.lg .seg-btn { padding: 0 10px; }
}

/* 設定画面: 面接チェックリストの編集（docs/SPEC-checklist.md 5 章） */
.s-cl-max { font-size: 13.5px; margin-bottom: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.s-cl-sec { background: var(--surface-2); }
.s-cl-sec > summary .hint { font-weight: 600; margin-left: 4px; }
.s-cl-no { color: var(--accent); font-weight: 800; }
.s-cl-sec-row { display: grid; grid-template-columns: minmax(10em, 2fr) auto auto auto; gap: 10px; align-items: end; }
.s-cl-sec-row .field { margin-bottom: 8px; }
.s-cl-sec-row .inline { display: flex; align-items: center; gap: 6px; }
.s-cl-sec-row input[type="number"] { width: 5.5em; min-width: 0; }
.s-cl-block { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: var(--surface); }
.s-cl-block-head { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center; margin-bottom: 6px; }
.s-cl-block[data-block-type="note"] .s-cl-block-head { grid-template-columns: auto minmax(0, 1fr) auto; }
.s-cl-memo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 2px 0 6px; }
.s-cl-memo input[type="text"] { max-width: 18em; }
.s-cl-item { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 5px 0; border-top: 1px dashed var(--border); }
.s-cl-item .idx { color: var(--muted); font-weight: 700; font-size: 13px; text-align: center; padding-top: 8px; }
.s-cl-item-main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.s-cl-item-main textarea { min-height: 52px; }
.s-cl-item-extra { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; min-width: 0; }
.s-cl-item-extra .inline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; max-width: 100%; }
.s-cl-item-extra select { width: auto; max-width: 100%; min-width: 0; text-overflow: ellipsis; }
.s-cl-item-extra input[type="number"] { width: 5em; min-width: 0; }
.s-cl-item-extra .field { margin: 0; width: 100%; }
.s-cl-item-extra .s-cl-short { flex: 1 1 260px; }
.s-cl-item-extra .s-cl-short input { width: 100%; min-width: 0; }
.s-cl-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; min-width: 0; max-width: 100%; }
.s-cl-check input { flex: none; }

.s-cl-item-add { margin-top: 4px; }
.s-cl-add { margin-top: 8px; align-items: center; }
.s-cl-add select { width: auto; }

@media (max-width: 720px) {
  .s-cl-sec-row, .s-cl-block-head, .s-cl-block[data-block-type="note"] .s-cl-block-head { grid-template-columns: minmax(0, 1fr); }
  .s-cl-item { grid-template-columns: 1.6em minmax(0, 1fr); }
  .s-cl-item .row-actions { grid-column: 2; }
}

/* ---------- 面接チェックリスト報告（A4）の印刷ホスト（docs/SPEC-a4.md 2-3）。中身は ③ の紙と同じ用紙（div.a4。見た目は storage.checklistSheetCss）。
   計測のあいだは画面外に置き、印刷では用紙そのものを余白 0 の 1 ページに出す ---------- */
.cl-sheet-host { display: none; }
body.print-checklist .cl-sheet-host { display: block; position: absolute; left: -10000px; top: 0; }
@page a4sheet { size: A4 portrait; margin: 0; }
@media print {
  /* ② の目次（.cl-nav 内の .cl-chip）だけ隠す */
  .cl-nav, .cl-skip-note { display: none !important; }
  body.print-checklist { page: a4sheet; background: #fff; }
  body.print-checklist .app, body.print-checklist .toast { display: none !important; }
  body.print-checklist .cl-sheet-host { position: static; left: auto; }
  body.print-checklist .cl-sheet-host .a4 { margin: 0; box-shadow: none; }
  body:not(.print-checklist) .cl-sheet-host { display: none !important; }
}

</style>

    const add = function (key, label, value) {

        result = to;

        warnings.push(reason);

        warnings.push(reason);

        const reason = '必須条件が一致しないため（' + ml + '）、不採用推奨とします。';

    if (ov) {

      warnings.push('確認点に × が' + counts.poor + '件あります（' + poorLabels.join('、') + '）。総合判断「' + ovl + '」と合わせて確認してください。');

    const scale = model.scale;
    const withNote = function (b) { return b.note ? b.label + '（' + b.note + '）' : b.label; };

    const scIn = U.isObj(texts.script) ? texts.script : {};
    const sc = {};
    Object.keys(DEFAULT_SCRIPT_TEXTS).forEach(function (k) { sc[k] = typeof scIn[k] === 'string' && scIn[k].trim() ? scIn[k] : DEFAULT_SCRIPT_TEXTS[k]; });

    const tpl = mustGate ? sc.mustGate : lowered ? sc.adjusted : !ov ? sc.missing : sc[result];
    const vars = {
      name: a.name ? a.name + 'さん' : '応募者', overallLabel: ovl || '未入力', total: total, max: max, pct: pct, band: bandLabel(iBand),
      marks: '○' + counts.good + ' △' + counts.fair + ' ×' + counts.poor, mustLabels: must.mismatchLabels.join('、'),
      resultTitle: titleOf(result), baseTitle: titleOf(baseResult)

      result: result,
      title: titleOf(result),
      body: U.fill(tpl, vars),
      disclaimer: texts.disclaimer || '',
      total: total, max: max, pct: pct,
      thresholds: {
        recommendPct: recPct, reviewPct: revPct,
        recommendPts: Math.ceil((max * recPct) / 100),
        reviewPts: Math.ceil((max * revPct) / 100)
      },
      breakdown: breakdown,
      strengths: strengths,
      concerns: concerns,
      warnings: warnings,
      unresolved: [],
      adjusted: adjustments.length > 0,
      evaluatedAt: (opts && opts.now ? new Date(opts.now) : new Date()).toISOString(),
      mode: 'script',
      interview: { total: total, max: max, pct: pct, band: iBand, bandLabel: bandLabel(iBand) },
      contribution: null,
      matrix: null,
      highschool: null,
      baseResult: baseResult,
      adjustments: adjustments,
      interviewMode: 'checklist',
      scaleMax: CHECKLIST_SCALE,
      checklist: { version: clStr(def.version), counts: counts, overall: { value: ov, label: ovl, points: ovPoints }, must: must },
      must: must,   // checklist.must と同じ（台本モードの描画用の別名）
      overall: { value: ov, label: ovl, points: ovPoints, tone: ov ? OVERALL_TONE[ov] : 'muted' }
    };
  }

    RESULT_RANK: RESULT_RANK,
    num: num,
    round1: round1,
    bandOf: bandOf,
    categoryGroup: categoryGroup,
    isStudentGroup: isStudentGroup,

    CHECKLIST_FIELD_KINDS: CHECKLIST_FIELD_KINDS,
    CHECKLIST_SCALE: CHECKLIST_SCALE,

    OVERALL_POINTS: OVERALL_POINTS,
    OVERALL_TONE: OVERALL_TONE,
    MUST_VALUES: MUST_VALUES,
    CHECKLIST_OVERALL_ID: CHECKLIST_OVERALL_ID,

  }

  // ---------- 面接チェックリスト（docs/SPEC-checklist.md 6-1） ----------
  const CL_ID_RE = /^[A-Za-z][\w-]{0,40}$/;
  function clRules() { return global.RecruitRules || {}; }
  function strOr(v, def) { return typeof v === 'string' ? v : def; }
  function asStr(v) { return v == null ? '' : String(v); }
  function intIn(v, lo, hi) { return isNum(v) && Number(v) % 1 === 0 && Number(v) >= lo && (hi == null || Number(v) <= hi); }
  function clHasSections(def) {
    return U.isObj(def) && Array.isArray(def.sections) && def.sections.some(function (s) { return U.isObj(s); });
  }

  // 台本の正規化（決定的・冪等。未知のキーは残す）。baseDef は既定の台本。
  //   自動表示（auto / autoParams）は 2026-10-14 に削除した（docs/SPEC-slim.md D8）。旧い設定・記録の台本に残っていれば外す
  //   台本の題名・説明文（title / intro）も同日に削除した（表示していた詳細モードのヘッダーごと無くなったため）。残っていれば外す
  function normalizeChecklistDef(def, baseDef) {
    const R = clRules();
    const base = U.isObj(baseDef) ? baseDef : defaults().checklist;
    if (!clHasSections(def)) return U.deepClone(base);
    const out = U.deepClone(def);
    const types = R.CHECKLIST_BLOCK_TYPES || ['must', 'fields', 'explain', 'question', 'rating', 'notify', 'note'];
    const kinds = R.CHECKLIST_FIELD_KINDS || ['text', 'date', 'month', 'choice'];

    delete out.title;
    delete out.intro;
    ['version', 'overallLabel', 'overallHint'].forEach(function (k) { out[k] = strOr(out[k], base[k]); });
    const bo = base.overallOptions || {};
    if (!U.isObj(out.overallOptions)) out.overallOptions = U.deepClone(bo);
    ['hire', 'hold', 'reject'].forEach(function (k) { out.overallOptions[k] = strOr(out.overallOptions[k], bo[k]); });
    out.pages = Array.isArray(out.pages)
      ? out.pages.filter(function (pg) { return U.isObj(pg); }).map(function (pg, i) {
        pg.no = intIn(pg.no, 1) ? Number(pg.no) : i + 1;
        pg.title = asStr(pg.title);
        pg.lead = asStr(pg.lead);
        return pg;
      })
      : U.deepClone(base.pages);
    out.mustFailResult = ['reject', 'review'].indexOf(out.mustFailResult) >= 0 ? out.mustFailResult : base.mustFailResult;
    out.mustUnknownResult = ['none', 'review'].indexOf(out.mustUnknownResult) >= 0 ? out.mustUnknownResult : base.mustUnknownResult;
    const bc = base.overallCaps || {};
    if (!U.isObj(out.overallCaps)) out.overallCaps = U.deepClone(bc);
    ['hold', 'reject'].forEach(function (k) {
      if (['none', 'review', 'reject'].indexOf(out.overallCaps[k]) < 0) out.overallCaps[k] = bc[k];
    });
    if (!U.isObj(out.print)) out.print = U.deepClone(base.print);
    if (typeof out.print.showQuestions !== 'boolean') out.print.showQuestions = base.print.showQuestions;

    // ヘッダー
    const bh = base.header;
    if (!U.isObj(out.header)) out.header = U.deepClone(bh);
    const h = out.header;
    // 消極属性（negatives・morningOnlyEnd）は 2026-10-13 に削除。旧い設定・記録の台本に残っていれば外す（docs/SPEC-script-mode.md 12 章）
    delete h.negatives;
    delete h.morningOnlyEnd;
    if (!U.isObj(h.posting)) h.posting = U.deepClone(bh.posting);
    h.posting.label = strOr(h.posting.label, bh.posting.label);
    const popts = Array.isArray(h.posting.options)
      ? h.posting.options.filter(function (x) { return U.isObj(x) && typeof x.value === 'string' && x.value !== ''; }) : [];
    h.posting.options = popts.length ? popts.map(function (x) { x.label = asStr(x.label); return x; }) : U.deepClone(bh.posting.options);
    h.interviewerField = strOr(h.interviewerField, bh.interviewerField);

    // セクション → ブロック → 項目
    const seen = {};
    const uniq = function (id) {
      let x = id;
      if (seen[x]) { let k = 2; while (seen[id + '_' + k]) k++; x = id + '_' + k; }
      seen[x] = true;
      return x;
    };
    out.sections = out.sections.filter(function (s) { return U.isObj(s); }).map(function (sec, i) {
      sec.id = uniq(typeof sec.id === 'string' && CL_ID_RE.test(sec.id) ? sec.id : 'sec' + (i + 1));
      sec.title = asStr(sec.title);
      sec.lead = asStr(sec.lead);
      sec.minutes = intIn(sec.minutes, 0, 60) ? Number(sec.minutes) : 0;
      sec.minutesMax = sec.minutesMax === true;
      sec.page = intIn(sec.page, 1) ? Number(sec.page) : 1;
      sec.blocks = (Array.isArray(sec.blocks) ? sec.blocks : []).filter(function (b) {
        return U.isObj(b) && types.indexOf(b.type) >= 0;
      }).map(function (b, j) {
        b.id = uniq(typeof b.id === 'string' && CL_ID_RE.test(b.id) ? b.id : sec.id + '_b' + (j + 1));
        b.title = asStr(b.title);
        b.note = asStr(b.note);
        b.memoLabel = asStr(b.memoLabel);
        if (typeof b.memo !== 'boolean') b.memo = b.type === 'question';
        b.items = (Array.isArray(b.items) ? b.items : []).filter(function (it) { return U.isObj(it); }).map(function (it, k) {
          it.id = uniq(typeof it.id === 'string' && CL_ID_RE.test(it.id) ? it.id : b.id + '_' + (k + 1));
          if (it.label === undefined && it.text !== undefined) { it.label = it.text; delete it.text; }
          it.label = asStr(it.label);
          if (it.hint !== undefined) it.hint = asStr(it.hint);
          if (b.type === 'fields') {
            if (kinds.indexOf(it.kind) < 0) it.kind = 'text';
            if (it.options !== undefined) {
              it.options = (Array.isArray(it.options) ? it.options : []).filter(function (o) {
                return U.isObj(o) && o.value != null && String(o.value) !== '';
              }).map(function (o) { return { value: String(o.value), label: asStr(o.label) }; });
            }
            if (it.kind === 'choice') {
              const vs = (it.options || []).map(function (o) { return o.value; });
              const dup = vs.some(function (v, x) { return vs.indexOf(v) !== x; });
              if (vs.length < 2 || dup) it.kind = 'text';
            }
          }
          if (b.type === 'explain') { if (it.shortOnly !== undefined) it.shortOnly = it.shortOnly === true; }
          else delete it.shortOnly;
          // 1 ページの報告書で使う短い名前（任意）。空・文字列以外は外す（無いときは描画時に文言の先頭 14 文字。docs/SPEC-checklist.md 4-2）
          if (typeof it.short === 'string' && it.short.trim()) it.short = it.short.trim();
          else delete it.short;
          delete it.auto;
          delete it.autoParams;
          return it;
        });
        return b;
      });
      return sec;
    });
    if (typeof out.mustFailJumpTo !== 'string' || !out.sections.some(function (s) { return s.id === out.mustFailJumpTo; })) out.mustFailJumpTo = '';
    return out;
  }

  // 旧プロファイル（checklist なし・壊れた checklist）には既定の台本を補う
  function fillChecklist(raw, base) {
    const rc = raw.checklist;
    if (!U.isObj(rc) || !clHasSections(rc)) return U.deepClone(base.checklist);
    return normalizeChecklistDef(U.deepClone(U.deepMerge(base.checklist, rc)), base.checklist);
  }

  // 保存前チェック（validateProfile から呼ぶ。SPEC-checklist 5-4）
  function validateChecklist(p, errors, warnings) {
    const cl = p.checklist;
    if (!U.isObj(cl)) return;
    const R = clRules();
    const types = R.CHECKLIST_BLOCK_TYPES || [];
    const kinds = R.CHECKLIST_FIELD_KINDS || [];
    const circ = R.circled || function (n) { return '(' + n + ')'; };
    const TYPE_NAMES = { must: '必須条件', fields: '記入欄', explain: '説明', question: '質問', rating: '確認点', notify: '合否連絡', note: '注記' };
    const P0 = '面接チェックリスト';
    const secs = Array.isArray(cl.sections) ? cl.sections.filter(function (s) { return U.isObj(s); }) : [];
    if (!secs.length) errors.push(P0 + 'のセクションがありません。');
    const seen = {};
    const idCheck = function (id, where) {
      if (typeof id !== 'string' || !CL_ID_RE.test(id)) { errors.push(P0 + ' ' + where + 'の id「' + asStr(id) + '」が正しくありません（英字で始まる英数字・_・-）。'); return; }
      if (seen[id]) errors.push(P0 + ' ' + where + 'の id「' + id + '」が重複しています。');
      seen[id] = true;
    };
    let mustN = 0, ratingN = 0;
    secs.forEach(function (sec, i) {
      const sn = circ(i + 1) + ' ' + (asStr(sec.title).trim() || '（名前なし）');
      if (!asStr(sec.title).trim()) errors.push(P0 + 'の' + circ(i + 1) + 'のセクション名が空です。');
      if (!intIn(sec.minutes, 0, 60)) errors.push(P0 + ' ' + sn + 'の目安時間は0〜60分の整数にしてください。');
      if (!intIn(sec.page, 1)) errors.push(P0 + ' ' + sn + 'のページは1以上の整数にしてください。');
      idCheck(sec.id, sn);
      (Array.isArray(sec.blocks) ? sec.blocks : []).forEach(function (b, j) {
        if (!U.isObj(b) || types.indexOf(b.type) < 0) { errors.push(P0 + ' ' + sn + 'の' + (j + 1) + '番目のブロックの種類が正しくありません。'); return; }
        const bn = sn + '【' + (asStr(b.title).trim() || TYPE_NAMES[b.type]) + '】';
        idCheck(b.id, bn);
        (Array.isArray(b.items) ? b.items : []).forEach(function (it, k) {
          if (!U.isObj(it)) { errors.push(P0 + ' ' + bn + 'の' + (k + 1) + '行目が正しくありません。'); return; }
          idCheck(it.id, bn + 'の' + (k + 1) + '行目');
          if (b.type !== 'note' && !asStr(it.label).trim()) errors.push(P0 + ' ' + bn + 'の' + (k + 1) + '行目が空です。');
          if (b.type === 'must') mustN++;
          if (b.type === 'rating') ratingN++;
          if (b.type === 'fields') {
            if (kinds.indexOf(it.kind) < 0) errors.push(P0 + ' ' + bn + 'の' + (k + 1) + '行目の入力の種類が正しくありません。');
            if (it.kind === 'choice') {
              const vs = (Array.isArray(it.options) ? it.options : []).map(function (o) { return U.isObj(o) ? asStr(o.value) : ''; });
              if (vs.filter(function (v) { return v !== ''; }).length < 2) errors.push(P0 + ' ' + bn + 'の「' + asStr(it.label) + '」の選択肢は2件以上にしてください。');
              else if (vs.some(function (v, x) { return vs.indexOf(v) !== x; })) errors.push(P0 + ' ' + bn + 'の「' + asStr(it.label) + '」の選択肢の値が重複しています。');
            }
          }
        });
      });
    });
    if (!asStr(cl.overallLabel).trim()) errors.push(P0 + 'の総合判断の見出しが空です。');
    const oo = U.isObj(cl.overallOptions) ? cl.overallOptions : {};
    ['hire', 'hold', 'reject'].forEach(function (k) {
      if (!asStr(oo[k]).trim()) errors.push(P0 + 'の総合判断の表示名（' + { hire: '採用', hold: '保留', reject: '不採用' }[k] + '）が空です。');
    });
    if (['reject', 'review'].indexOf(cl.mustFailResult) < 0) errors.push(P0 + 'の「必須条件に不一致があるとき」の設定が正しくありません。');
    if (['none', 'review'].indexOf(cl.mustUnknownResult) < 0) errors.push(P0 + 'の「必須条件に未確認が残るとき」の設定が正しくありません。');
    const caps = U.isObj(cl.overallCaps) ? cl.overallCaps : {};
    ['hold', 'reject'].forEach(function (k) {
      if (['none', 'review', 'reject'].indexOf(caps[k]) < 0) errors.push(P0 + 'の総合判断「' + asStr(oo[k] || k) + '」のときの設定が正しくありません。');
    });
    const hd = U.isObj(cl.header) ? cl.header : {};
    if (!ratingN) warnings.push('確認点がありません。面接評価は総合判断だけで決まります。');
    if (!mustN) warnings.push('必須条件がないため、不一致による不採用推奨は働きません。');
    const mfields = (((p.management || {}).fields) || []).map(function (f) { return f && f.id; });
    if (hd.interviewerField && mfields.indexOf(hd.interviewerField) < 0) warnings.push('担当と連動する押印欄が見つかりません。');
  }
  // ---------- プロファイルの正規化（docs/SPEC-slim.md 3-1） ----------
  // 許可したキーだけを組み立てる（トップレベルは schemaVersion, meta, features, management, options, evaluation, checklist, texts の 8 個）。
  // 2026-10-14 に削除した機能の設定（REMOVED_KEYS など）は読み飛ばす。
  // report を渡すと次を入れる: v1Reset（v1 は移行せず既定値）・fullModeRemoved（mode: 'full' の設定だった）・stripped（読み飛ばしたキーがあった）。
  // 冪等: normalizeProfile(normalizeProfile(x)) と normalizeProfile(x) は同じ内容になる。
  const REMOVED_KEYS = ['mode', 'inputStages', 'stageOptions', 'highschoolPolicy', 'params', 'handoffRules', 'contribution', 'matrix'];
  const TEXT_SCRIPT_KEYS = ['recommend', 'review', 'reject', 'missing', 'mustGate', 'adjusted'];
  function normalizeProfile(p, report) {
    const raw = U.isObj(p) ? p : {};
    const base = defaults();
    if (Object.keys(raw).length && (Number(raw.schemaVersion) || 1) < 2) {
      if (report) report.v1Reset = true;
      return base;
    }
    const str = function (v, d) { return typeof v === 'string' ? v : d; };
    const obj = function (v) { return U.isObj(v) ? v : {}; };
    const out = { schemaVersion: 2 };
    // 劇場情報
    const rm = obj(raw.meta);
    out.meta = {};
    ['theaterName', 'appTitle', 'version', 'footer'].forEach(function (k) { out.meta[k] = str(rm[k], base.meta[k]); });
    // 入力項目（卒業予定年月だけ）
    const rf = obj(raw.features);
    out.features = { graduationDate: rf.graduationDate === undefined ? base.features.graduationDate : rf.graduationDate !== false };
    // 応募者の管理（押印）
    out.management = fillManagement(raw.management, base);
    // 区分・性別
    const ro = obj(raw.options);
    const genders = (Array.isArray(ro.genders) ? ro.genders : []).filter(function (g) { return typeof g === 'string' && g.trim(); });
    const cats = (Array.isArray(ro.categories) ? ro.categories : []).filter(function (c) { return U.isObj(c) && typeof c.value === 'string' && c.value.trim(); })
      .map(function (c) { return { value: c.value, group: typeof c.group === 'string' && c.group ? c.group : 'other' }; });
    out.options = { genders: genders.length ? genders : U.deepClone(base.options.genders), categories: cats.length ? cats : U.deepClone(base.options.categories) };
    // 面接評価の帯の境界（範囲の検査は validateProfile）
    const th = obj(obj(raw.evaluation).thresholds), bth = base.evaluation.thresholds;
    out.evaluation = { thresholds: {
      recommendPct: isNum(th.recommendPct) ? Number(th.recommendPct) : bth.recommendPct,
      reviewPct: isNum(th.reviewPct) ? Number(th.reviewPct) : bth.reviewPct
    } };
    // 面接チェックリスト（台本）
    out.checklist = fillChecklist(raw, base);
    // 担当と連動する押印欄が無くなった（旧設定の 'initial' など）ときは面接対応者、無ければ連動しない
    const fids = out.management.fields.map(function (f) { return f.id; });
    const hdr = out.checklist.header;
    if (U.isObj(hdr) && hdr.interviewerField && fids.indexOf(hdr.interviewerField) < 0) hdr.interviewerField = fids.indexOf('interviewer') >= 0 ? 'interviewer' : '';
    // 結果の文言
    const rt = obj(raw.texts), bt = base.texts;
    out.texts = {};
    ['recommend', 'review', 'reject'].forEach(function (k) { out.texts[k] = { title: str(obj(rt[k]).title, bt[k].title) }; });
    out.texts.disclaimer = str(rt.disclaimer, bt.disclaimer);
    const rbl = obj(rt.bandLabels);
    out.texts.bandLabels = {};
    ['high', 'mid', 'low'].forEach(function (k) { out.texts.bandLabels[k] = str(rbl[k], bt.bandLabels[k]); });
    const rs = obj(rt.script);
    out.texts.script = {};
    TEXT_SCRIPT_KEYS.forEach(function (k) { out.texts.script[k] = str(rs[k], bt.script[k]); });
    if (report) {
      if (raw.mode === 'full') report.fullModeRemoved = true;
      // 最終承認のロックが未設定（キーが無い・空）なだけの保存済みの設定は保存し直さない（既定のロック＝ローカル版のロックを localStorage に固定しない。
      //   docs/SPEC-a4.md 11 章 L6b）
      let cmp = out, rawCmp = raw;
      if (U.isObj(raw.management) && lockUnset(raw.management.finalLock)) {
        cmp = U.deepClone(out); delete cmp.management.finalLock;
        rawCmp = U.deepClone(raw); delete rawCmp.management.finalLock;
      }
      if (REMOVED_KEYS.some(function (k) { return raw[k] !== undefined; }) || (Object.keys(raw).length && JSON.stringify(cmp) !== JSON.stringify(rawCmp))) report.stripped = true;
    }
    return out;
  }

  // 保存前チェック（DOM 非依存）。errors があれば保存しない。
  function validateProfile(p) {
    const errors = [], warnings = [];
    p = p || {};
    const inRange = function (v, lo, hi) { return isNum(v) && Number(v) >= lo && Number(v) <= hi; };
    const ev = p.evaluation || {}, th = ev.thresholds || {};
    if (!inRange(th.recommendPct, 0, 100) || !inRange(th.reviewPct, 0, 100) || !(Number(th.recommendPct) > Number(th.reviewPct))) {
      errors.push('面接評価の境界（高 > 中、0〜100%）が正しくありません。');
    }
    validateChecklist(p, errors, warnings);
    // 最終合否（docs/SPEC-report.md 1-5）
    const dc = (p.management || {}).decision;
    if (U.isObj(dc) && dc.enabled !== false) {
      const hl = asStr(dc.hireLabel).trim(), rl = asStr(dc.rejectLabel).trim();
      if (!hl || !rl) errors.push('最終合否の「採用」「不採用」の表示名を入力してください。');
      else if (hl === rl) errors.push('最終合否の「採用」と「不採用」の表示名が同じです。');
      const fids = ((p.management || {}).fields || []).map(function (f) { return f && f.id; });
      if (dc.stampField && fids.indexOf(dc.stampField) < 0) warnings.push('最終合否と連動する押印欄が見つかりません。');
    }
    // 最終承認のパスワード（hash があれば salt〔16 進 32 文字〕と 16 進 64 文字の hash。docs/SPEC-a4.md 11 章）
    const lk = (p.management || {}).finalLock;
    if (U.isObj(lk) && asStr(lk.hash) !== '' && (!/^[0-9a-f]{64}$/.test(asStr(lk.hash)) || !/^[0-9a-f]{32}$/.test(asStr(lk.salt)))) {
      errors.push('最終承認のパスワードの設定が壊れています。パスワードを設定し直してください。');
    } else if (lk !== undefined && !U.isObj(lk)) {
      errors.push('最終承認のパスワードの設定が壊れています。パスワードを設定し直してください。');
    }
    return { errors: errors, warnings: warnings };
  }

  function loadProfile(report) {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (!raw) return defaults();
      return normalizeProfile(JSON.parse(raw), report);
    } catch (e) {
      return defaults();
    }
  }

  function saveProfile(p) {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) { /* 保存不可環境 */ }
  }

  function resetProfile() {
    try { localStorage.removeItem(PROFILE_KEY); } catch (e) { /* noop */ }
    return defaults();
  }

  // 劇場情報（meta）があり、台本・押印・旧形式の設定のどれかがある JSON を受け付ける（このアプリで書き出した JSON と旧い JSON の両方）
  function parseProfileJSON(text, report) {
    const obj = JSON.parse(text);
    if (!U.isObj(obj) || !U.isObj(obj.meta) || !(obj.checklist || obj.management || obj.handoffRules)) {
      throw new Error('劇場プロファイルの形式ではありません。');
    }
    return normalizeProfile(obj, report);
  }

  function loadTheme() {
    try { return localStorage.getItem(THEME_KEY) || ''; } catch (e) { return ''; }
  }

  function saveTheme(t) {
    try { if (t) localStorage.setItem(THEME_KEY, t); else localStorage.removeItem(THEME_KEY); } catch (e) { /* noop */ }
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // script 要素（type="application/json"）に埋め込む JSON。< > & を \u 形式にして、値に「閉じタグ」や
  // 「コメント開始＋script 開始タグ」が含まれても HTML パーサが要素を閉じ損ねない（script data double escaped 状態に
  // 入らない）ようにする。JSON.parse で元の文字に戻る。
  function jsonForScript(x) {
    return JSON.stringify(x).replace(/[<>&\u2028\u2029]/g, function (c) { return '\\u' + ('000' + c.charCodeAt(0).toString(16)).slice(-4); });
  }

  function safeName(s) {
    return String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || '応募者';
  }

  // ---------- 応募者レコード（docs/SPEC-slim.md 3-2・3-3） ----------
  // 応募者データは 6 キー（すべて文字列）。旧レコードの他のキー（勤務条件・通勤・繁忙期など）は読み込み時に捨てる
  const APPLICANT_KEYS = ['name', 'gender', 'age', 'category', 'graduationDate', 'reviewerNotes'];
  function pickApplicant(src) {
    src = U.isObj(src) ? src : {};
    const out = {};
    APPLICANT_KEYS.forEach(function (k) { out[k] = src[k] == null ? '' : String(src[k]); });
    return out;
  }

  function buildRecord(state) {
    const R = global.RecruitRules;
    return {
      kind: RECORD_KIND,
      schemaVersion: 2,
      savedAt: new Date().toISOString(),
      profile: { theaterName: state.profile.meta.theaterName, version: state.profile.meta.version, schemaVersion: 2 },
      step: state.step,
      applicant: pickApplicant(state.applicant),
      // 面接チェックリストの回答（SPEC-checklist 1-4）と保存時点の台本（レポートの文言・並び用。読込では使わない）
      checklist: U.deepClone(U.isObj(state.checklist) ? state.checklist : R.emptyChecklist()),
      checklistDef: state.profile.checklist ? U.deepClone(state.profile.checklist) : null,
      interviewNotes: state.interviewNotes || '',
      // 応募者の管理（押印）: { interviewer: { name, short, title, date, at }, final: { ... } }
      management: U.deepClone(state.management || {}),
      // 最終合否（人の決定）: { result, label, date, at, by: { name, short, title } } または null。判定とは独立
      decision: normalizeDecision(state.decision),
      // 保存時点の判定（evaluateScript の戻り値。読み込み時は現在の設定で判定し直す）
      judgment: state.judgment ? U.deepClone(state.judgment) : null
    };
  }

  function parseRecordFromHTML(html) {
    try {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const node = doc.querySelector('script#recruit-record[type="application/json"]');
      if (!node) return null;
      const rec = JSON.parse(node.textContent);
      if (!rec || rec.kind !== RECORD_KIND) return null;
      // 最終合否は正規化して返す（キーの無い旧レコード・不正値は null）
      rec.decision = normalizeDecision(rec.decision);
      return rec;
    } catch (e) {
      return null;
    }
  }

  //   legacy: v1（schemaVersion 1）／scores（旧評価の点数あり）／full（mode: 'full' の記録）／initial（廃止した押印欄の印あり）
  //   full の判別は mode === 'full'、または mode が 'script' でなく旧キー handoff がある（今の記録はどちらも書かない。D12）
  function normalizeRecord(rec) {
    rec = U.isObj(rec) ? rec : {};
    const R = global.RecruitRules;
    const mg = {};
    if (U.isObj(rec.management)) {
      Object.keys(rec.management).forEach(function (k) {
        const e = rec.management[k];
        if (k !== 'initial' && U.isObj(e) && e.name) mg[k] = U.deepClone(e);
      });
    }
    const ver = Number(rec.schemaVersion) || 1;
    const scores = U.isObj(rec.scores) ? rec.scores : {};
    const checklist = U.deepMerge(R.emptyChecklist(), U.isObj(rec.checklist) ? U.deepClone(rec.checklist) : {});
    ['header', 'values', 'notes'].forEach(function (k) { if (!U.isObj(checklist[k])) checklist[k] = k === 'header' ? R.emptyChecklist().header : {}; });
    // 消極属性（2026-10-13 に削除）は読み飛ばす
    delete checklist.header.negatives;
    const step = Number(rec.step);
    return {
      applicant: pickApplicant(rec.applicant),
      checklist: checklist,
      checklistDef: U.isObj(rec.checklistDef) ? rec.checklistDef : null,
      interviewNotes: typeof rec.interviewNotes === 'string' ? rec.interviewNotes : '',
      management: mg,
      decision: normalizeDecision(rec.decision),
      judgment: U.isObj(rec.judgment) && rec.judgment.result ? rec.judgment : null,
      step: [1, 3, 4].indexOf(step) >= 0 ? step : 1,
      savedAt: rec.savedAt || null,
      theaterName: U.isObj(rec.profile) ? String(rec.profile.theaterName || '') : '',
      legacy: {
        v1: ver < 2,
        scores: ver < 2 || Object.keys(scores).some(function (k) { return isNum(scores[k]); }),
        full: rec.mode === 'full' || (rec.mode !== 'script' && U.isObj(rec.handoff)),
        initial: U.isObj(rec.management) && U.isObj(rec.management.initial) && !!rec.management.initial.name

    };
  }

  //   文言の先頭 14 文字＋「…」（前後の「」は外す）。設定の文言を後から変えても古い short が残らないよう、正規化では補わず描画時に決める
