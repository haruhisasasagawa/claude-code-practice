<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リクルート判定システム</title>
  <meta name="description" content="アルバイト採用の基準統一を支援する判定アプリ。応募情報から面接者への留意点を自動生成し、面接評価から採用可否を判定します。">
  <style>
/* =====================================================================
   リクルート判定システム — スタイル
   デザイントークン → レイアウト → コンポーネント → 画面別 → 印刷
   ===================================================================== */

:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #eef2f6;
  --text: #1a2233;
  --muted: #5b6675;
  --border: #dde3ea;
  --border-strong: #c7d0db;

  --accent: #1f5fbf;
  --accent-hover: #184c99;
  --accent-soft: #e6eefb;
  --on-accent: #ffffff;

  --ok: #0e9f6e;      --ok-soft: #e3f6ee;
  --warn: #d97706;    --warn-soft: #fdf1dc;
  --danger: #dc2626;  --danger-soft: #fde8e8;
  --info: #2563eb;    --info-soft: #e5edff;

  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .10);
  --shadow-lg: 0 8px 24px rgba(16, 24, 40, .12);
  --radius: 10px;
  --radius-sm: 6px;
  --sidebar-w: 248px;
  --summary-w: 312px;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0f141a;
  --surface: #171e27;
  --surface-2: #1d2631;
  --surface-3: #232e3b;
  --text: #e6ebf1;
  --muted: #93a1b1;
  --border: #263140;
  --border-strong: #35435500;
  --border-strong: #354355;
  --accent: #5b9cff;
  --accent-hover: #7cb0ff;
  --accent-soft: #1b2a44;
  --on-accent: #0b1220;
  --ok: #34c38f;      --ok-soft: #12302a;
  --warn: #f5a623;    --warn-soft: #3a2a12;
  --danger: #f06565;  --danger-soft: #3b1a1d;
  --info: #6ea2ff;    --info-soft: #1a2742;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a;
    --surface: #171e27;
    --surface-2: #1d2631;
    --surface-3: #232e3b;
    --text: #e6ebf1;
    --muted: #93a1b1;
    --border: #263140;
    --border-strong: #354355;
    --accent: #5b9cff;
    --accent-hover: #7cb0ff;
    --accent-soft: #1b2a44;
    --on-accent: #0b1220;
    --ok: #34c38f;      --ok-soft: #12302a;
    --warn: #f5a623;    --warn-soft: #3a2a12;
    --danger: #f06565;  --danger-soft: #3b1a1d;
    --info: #6ea2ff;    --info-soft: #1a2742;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

/* ---------- ベース ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 15px; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.35; }
p { margin: 0; }
a { color: var(--accent); }
button { font-family: inherit; }
code, .mono { font-family: var(--mono); font-size: .85em; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.num { font-variant-numeric: tabular-nums; }

input, select, textarea {
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
input[type="time"], input[type="month"], input[type="number"] { width: auto; min-width: 9em; }
input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--accent); }
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
input.invalid, select.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }

/* ---------- アプリ骨格 ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 18px 14px;
  overflow-y: auto;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  background: linear-gradient(135deg, var(--accent), #6f3fd1);
  color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 17px; letter-spacing: .02em;
}
.brand-title { font-weight: 700; font-size: 13.5px; line-height: 1.3; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--muted); line-height: 1.3; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px; border: none; background: none;
  color: var(--text); font-size: 14px; font-weight: 500; text-align: left; cursor: pointer;
}
.nav-item:hover { background: var(--surface-3); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-item .ico { width: 18px; text-align: center; font-size: 15px; opacity: .85; }

.side-section-title {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted);
  text-transform: uppercase; padding: 0 8px; margin-bottom: 6px;
}
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step {
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
  padding: 8px 8px; border-radius: 8px; cursor: pointer; position: relative;
}
.step:hover:not(.disabled) { background: var(--surface-3); }
.step.disabled { cursor: not-allowed; opacity: .55; }
.step-num {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; border: 2px solid var(--border-strong); color: var(--muted); background: var(--surface);
}
.step.current .step-num { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step.done .step-num { border-color: var(--ok); background: var(--ok); color: #fff; }
.step-label { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.step.current .step-label { color: var(--accent); }
.step-hint { font-size: 11.5px; color: var(--muted); line-height: 1.3; }

.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.sidebar-foot .version { font-size: 11px; color: var(--muted); line-height: 1.4; }

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 28px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.top-title { font-size: 17px; font-weight: 700; }
.chip-applicant {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  font-size: 12.5px; color: var(--muted);
}
.chip-applicant strong { color: var(--text); }
.chip-applicant .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip-applicant.dirty .dot { background: var(--warn); }
.chip-applicant.saved .dot { background: var(--ok); }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.view { padding: 22px 28px 60px; }
.view-footer { margin-top: 36px; font-size: 11.5px; color: var(--muted); text-align: center; }

.judge-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--summary-w);
  gap: 22px;
  align-items: start;
}
.work { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.summary { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 1180px) {
  .judge-layout { grid-template-columns: 1fr; }
  .summary { position: static; }
}
@media (max-width: 840px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .topbar, .view { padding-left: 16px; padding-right: 16px; }
  .field-row { grid-template-columns: 1fr !important; }
}

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border-strong)); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 7px; }
.btn.link { border: none; background: none; color: var(--accent); padding: 2px 4px; font-weight: 500; }
.btn.link:hover { text-decoration: underline; background: none; }
.btn.block { width: 100%; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions.end { justify-content: flex-end; }
.actions.between { justify-content: space-between; }

/* ---------- カード ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
}
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-head h2 { font-size: 16px; font-weight: 700; }
.card-head h3 { font-size: 15px; font-weight: 700; }
.card-head p { font-size: 13px; color: var(--muted); width: 100%; }
.card-head .spacer { flex: 1; }
.card h3.sub {
  font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em;
  margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.card h3.sub:first-child { margin-top: 0; }
.card.compact { padding: 14px 16px; }

/* ---------- フォーム ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 600; color: var(--text); }
.req { color: var(--danger); font-weight: 700; margin-left: 2px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
.field-row { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.field-row.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field-row.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.suffix { font-size: 13px; color: var(--muted); white-space: nowrap; }

.chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font-size: 14px; font-weight: 600; cursor: pointer; user-select: none;
  transition: background .15s, border-color .15s, color .15s;
}
.chip:hover { background: var(--surface-3); }
.chip input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; margin: 0; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.chip-any.on { background: #6f3fd1; border-color: #6f3fd1; color: #fff; }
.chip.chip-sm { padding: 5px 10px; font-size: 12.5px; min-width: 0; }
.chip.chip-sm.on { background: var(--danger); border-color: var(--danger); color: #fff; }
.chip:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }

.time-rows { display: flex; flex-direction: column; gap: 8px; }
.time-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.time-label { width: 5.5em; font-weight: 700; font-size: 13.5px; }
.time-row input[type="time"] { min-width: 7.5em; padding: 7px 10px; }
.tilde { color: var(--muted); }
.time-dur { font-size: 12.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.time-dur.late { color: var(--warn); font-weight: 600; }
.time-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); }

.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-opt { position: relative; display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; border-right: 1px solid var(--border); user-select: none; color: var(--muted); }
.seg-opt:last-child { border-right: none; }
.seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; }
.seg-opt:hover { background: var(--surface-3); }
.seg-opt.on { color: var(--on-accent); background: var(--accent); }
.seg-opt.tone-ok.on { background: var(--ok); color: #fff; }
.seg-opt.tone-warn.on { background: var(--warn); color: #fff; }
.seg-opt.tone-danger.on { background: var(--danger); color: #fff; }

/* ---------- アラート・バッジ ---------- */
.alert {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; border-radius: var(--radius-sm); border: 1px solid; font-size: 13.5px; line-height: 1.5;
}
.alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.alert.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.alert.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.alert.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.alert .ico { flex: none; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
  background: var(--surface-3); color: var(--muted); border: 1px solid transparent;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.lg { font-size: 14px; padding: 5px 14px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11.5px; color: var(--muted); padding: 1px 7px; border: 1px solid var(--border); border-radius: 4px; white-space: nowrap; }

/* ---------- 申し送り ---------- */
.handoff-group { margin-bottom: 18px; }
.handoff-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.handoff-group-head h3 { font-size: 14px; font-weight: 700; }
.handoff-group-head .desc { font-size: 12.5px; color: var(--muted); }
.handoff-list { display: flex; flex-direction: column; gap: 8px; }
.handoff-item {
  display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start;
  padding: 11px 14px; border: 1px solid var(--border); border-left-width: 4px;
  border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; transition: background .15s;
}
.handoff-item:hover { background: var(--surface-2); }
.handoff-item input { margin-top: 3px; width: 17px; height: 17px; }
.handoff-item.sev-block { border-left-color: var(--danger); }
.handoff-item.sev-warn { border-left-color: var(--warn); }
.handoff-item.sev-info { border-left-color: var(--info); }
.handoff-item.done { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); }
.handoff-item.done .handoff-text { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
.handoff-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
.handoff-text { font-size: 14px; line-height: 1.55; }

.progress { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.progress-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress-bar > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .25s; }

.strength-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.strength-list li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.strength-list li::before { content: "✓"; color: var(--ok); font-weight: 800; flex: none; }

.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th, .table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.table th { color: var(--muted); font-weight: 600; background: var(--surface-2); }
.table.kv th { width: 9em; }
.table td.num, .table th.num { text-align: right; }

/* ---------- 面接評価 ---------- */
.eval-list { display: flex; flex-direction: column; gap: 8px; }
.eval-item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
}
.eval-item.overall { border-color: var(--accent); background: var(--accent-soft); }
.eval-item.missing { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
.eval-label { font-size: 14px; font-weight: 600; }
.eval-label .n { display: inline-block; width: 1.6em; color: var(--muted); font-weight: 700; }
.eval-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.score-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg-btn {
  width: 46px; height: 40px; border: none; border-right: 1px solid var(--border); background: transparent;
  font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer;
}
.seg-btn:last-child { border-right: none; }
.seg-btn:hover { background: var(--surface-3); }
.seg-btn.active { background: var(--accent); color: var(--on-accent); }
.seg-btn.active.s1, .seg-btn.active.s2 { background: var(--danger); color: #fff; }
.seg-btn.active.s3 { background: var(--warn); color: #fff; }
.seg-btn.active.s4, .seg-btn.active.s5 { background: var(--ok); color: #fff; }
.scale-legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); width: 230px; margin-left: auto; padding: 0 4px; }
.score-total {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border);
}
.score-total strong { font-size: 26px; font-weight: 800; }
.score-total .max { color: var(--muted); font-size: 15px; }
.score-total .pct { margin-left: auto; font-weight: 700; }

/* ---------- 判定結果 ---------- */
.result-card { border: 2px solid; border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); background: var(--surface); }
.result-card.recommend { border-color: var(--ok); background: linear-gradient(180deg, var(--ok-soft), var(--surface) 70%); }
.result-card.review { border-color: var(--warn); background: linear-gradient(180deg, var(--warn-soft), var(--surface) 70%); }
.result-card.reject { border-color: var(--danger); background: linear-gradient(180deg, var(--danger-soft), var(--surface) 70%); }

/* ---- util.js ---- */
/* 共通ユーティリティ（DOM非依存） */
;(function (global) {
  'use strict';

  function deepClone(o) {
    return JSON.parse(JSON.stringify(o));
  }

  function isObj(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  // base をベースに inc を再帰マージ。配列は inc 側で丸ごと置き換える。
  function deepMerge(base, inc) {
    if (!isObj(base) || !isObj(inc)) return inc === undefined ? base : inc;
    const out = Object.assign({}, base);
    Object.keys(inc).forEach(function (k) {
      out[k] = isObj(base[k]) && isObj(inc[k]) ? deepMerge(base[k], inc[k]) : inc[k];
    });
    return out;
  }

  function tokens(path) {
    return String(path).match(/[^.\[\]]+/g) || [];
  }

  function getPath(obj, path) {
    return tokens(path).reduce(function (o, k) {
      return o == null ? undefined : o[k];
    }, obj);
  }

  function setPath(obj, path, val) {
    const t = tokens(path);
    let o = obj;
    for (let i = 0; i < t.length - 1; i++) {
      const k = t[i];
      if (o[k] == null || typeof o[k] !== 'object') {
        o[k] = /^\d+$/.test(t[i + 1]) ? [] : {};
      }
      o = o[k];
    }
    o[t[t.length - 1]] = val;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  // "{name}" 形式のプレースホルダーを置換。未定義は「未入力」にする。
  function fill(text, vars) {
    return String(text || '').replace(/\{(\w+)\}/g, function (m, k) {
      const v = vars ? vars[k] : undefined;
      return v === undefined || v === null || v === '' ? '未入力' : String(v);
    });
  }

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function fmtDate(d) {
    const x = d instanceof Date ? d : new Date(d);
    return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate());
  }

  function fmtDateTime(d) {
    const x = d instanceof Date ? d : new Date(d);
    if (isNaN(x.getTime())) return '';
    return x.getFullYear() + '/' + pad2(x.getMonth() + 1) + '/' + pad2(x.getDate()) +
      ' ' + pad2(x.getHours()) + ':' + pad2(x.getMinutes());
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  global.RecruitUtil = {
    deepClone: deepClone,
    deepMerge: deepMerge,
    isObj: isObj,
    getPath: getPath,
    setPath: setPath,
    esc: esc,
    fill: fill,
    fmtDate: fmtDate,
    fmtDateTime: fmtDateTime,
    uid: uid
  };
})(window);

  <script>
/* ---- rules.js ---- */
/*
 * 判定エンジン（DOM非依存・純関数）
 * ----------------------------------------------------------------------
 * - analyzeShifts    : 希望シフトの解析（オープン/クローズ/深夜/週時間など）
 * - buildHandoff     : 面接者への申し送り（留意点）と強みを生成
 * - evaluateHiring   : 面接評価スコアから採用可否を判定
 * - describeApplicant: 応募情報を表示用のラベル／値ペアに整形
 *
 * 劇場固有の数値・文言はすべて profile（config.default.js）から受け取る。
 */
;(function (global) {
  'use strict';

  const U = global.RecruitUtil;

  const DAYS = [
    { key: 'mon', label: '月', weekday: true },
    { key: 'tue', label: '火', weekday: true },
    { key: 'wed', label: '水', weekday: true },
    { key: 'thu', label: '木', weekday: true },
    { key: 'fri', label: '金', weekday: true },
    { key: 'sat', label: '土', weekday: false },
    { key: 'sun', label: '日', weekday: false }
  ];

  const SEVERITY = {
    block: { key: 'block', label: '要判断', order: 0, desc: '採用担当が面接実施の可否を判断する項目' },
    warn:  { key: 'warn',  label: '要確認', order: 1, desc: '面接時に応募者へ確認する項目' },
    info:  { key: 'info',  label: '共有',   order: 2, desc: '面接者へ共有しておく事項' }
  };

  const CATEGORY_LABELS = {
    general: '全般',
    highschool: '高校生',
    vocational: '専門学校生',
    foreign: '外国籍',
    lateNight: '深夜帯'
  };

  const TRI_LABELS = { ok: '○ 可能', consult: '△ 要相談', ng: '× 不可' };

  // ---------- 時刻ユーティリティ ----------
  function toMinutes(hhmm) {
    if (!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) return null;
    const p = hhmm.split(':').map(Number);
    return p[0] * 60 + p[1];
  }

  // 終了が開始より早い、または翌日フラグがある場合は翌日扱い
  function duration(start, end, nextDay) {
    const s = toMinutes(start);
    const e0 = toMinutes(end);
    if (s == null || e0 == null) return null;
    let e = e0;
    if (nextDay || e < s) e += 1440;
    return e - s;
  }

  function fmtDuration(min) {
    if (min == null) return '';
    const h = Math.floor(min / 60);
    const m = min % 60;
    return m ? h + '時間' + m + '分' : h + '時間';
  }

  function fmtEnd(end, nextDay) {
    return nextDay ? '翌' + end : end;
  }

  function categoryGroup(profile, value) {
    const c = (profile.options.categories || []).find(function (x) { return x.value === value; });
    return c ? c.group : '';
  }

  function isStudentGroup(g) {
    return g === 'highschool' || g === 'university' || g === 'vocational';
  }

  function labelOf(list, value) {
    const hit = (list || []).find(function (o) { return (typeof o === 'string' ? o : o.value) === value; });
    if (!hit) return value || '';
    return typeof hit === 'string' ? hit : hit.label;
  }

  // ---------- シフト解析 ----------
  function analyzeShifts(applicant, profile) {
    const p = profile.params || {};
    const shifts = applicant.shifts || {};
    const days = applicant.workDays || [];
    const useAny = !!applicant.anyDay;
    const entries = [];

    function push(key, label, weekday, s) {
      if (!s || !s.start || !s.end) return;
      const min = duration(s.start, s.end, s.nextDay);
      if (min == null) return;
      const startMin = toMinutes(s.start);
      entries.push({
        key: key, label: label, weekday: weekday,
        start: s.start, end: s.end, nextDay: !!s.nextDay || (toMinutes(s.end) < startMin),
        minutes: min, startAbs: startMin, endAbs: startMin + min
      });
    }

    if (useAny) {
      push('any', '曜日問わず', null, shifts.any);
    } else {
      DAYS.forEach(function (d) {
        if (days.indexOf(d.key) >= 0) push(d.key, d.label + '曜', d.weekday, shifts[d.key]);
      });
    }

    const res = {
      entries: entries,
      hasAnyEntry: entries.length > 0,
      hasShort: false, hasLong: false,
      isOpen: false, isClose: false, isLateNight: false,
      weekdayDaytime: false, weekdayMorningToAfternoon: false,
      weekendBoth: false,
      latestEndAbs: null,
      weeklyMinutes: 0,
      missingTimes: false
    };

    const minShift = Number(p.minShiftMinutes) || 180;
    const openFrom = Number(p.openStartFrom), openTo = Number(p.openStartTo);
    const closeEnd = (Number(p.closeEndHour) || 22) * 60;
    const lateStart = (Number(p.lateNightStartHour) || 22) * 60;
    const daytimeBefore = (Number(p.daytimeStartBefore) || 15) * 60;

    entries.forEach(function (e) {
      if (e.minutes < minShift) res.hasShort = true; else res.hasLong = true;
      const sh = Math.floor(e.startAbs / 60);
      if (!isNaN(openFrom) && !isNaN(openTo) && sh >= openFrom && sh <= openTo) res.isOpen = true;
      if (e.endAbs >= closeEnd) res.isClose = true;
      if (e.endAbs > lateStart) res.isLateNight = true;
      const weekday = useAny ? true : e.weekday;
      if (weekday && e.startAbs >= 7 * 60 && e.startAbs < daytimeBefore) {
        res.weekdayDaytime = true;
        if (e.endAbs >= daytimeBefore) res.weekdayMorningToAfternoon = true;
      }
      if (res.latestEndAbs == null || e.endAbs > res.latestEndAbs) res.latestEndAbs = e.endAbs;
    });

    res.weekendBoth = useAny || (days.indexOf('sat') >= 0 && days.indexOf('sun') >= 0);

    // 週あたりの勤務時間（目安）
    const daysMax = Number(applicant.daysMax) || 0;
    const daysMin = Number(applicant.daysMin) || 0;
    if (useAny) {
      const e = entries[0];
      const n = daysMax || daysMin || 0;
      res.weeklyMinutes = e ? e.minutes * n : 0;
    } else {
      let list = entries.slice().sort(function (a, b) { return b.minutes - a.minutes; });
      if (daysMax && list.length > daysMax) list = list.slice(0, daysMax);
      res.weeklyMinutes = list.reduce(function (a, e) { return a + e.minutes; }, 0);
    }

    const selectedCount = useAny ? 1 : days.length;
    res.missingTimes = selectedCount > 0 && entries.length < selectedCount;
    return res;
  }

  // ---------- 留意点ルールの条件 ----------
  // 各関数は false（該当なし）/ true / 追加変数オブジェクト を返す
  const CONDITIONS = {
    age_limit: function (c) { return !!c.p.maxAge && c.age > 0 && c.age >= Number(c.p.maxAge); },
    short_period: function (c) { return c.a.workPeriod === 'short'; },
    graduation_midterm: function (c) {
      if (!c.a.graduationDate || c.a.workPeriod !== 'mid') return false;
      const ny = new Date().getFullYear() + 1;
      return c.a.graduationDate === ny + '-03';
    },
    weekly_days_one: function (c) { return c.daysMax === 1; },
    weekly_days_low: function (c) { return c.daysMax >= 2 && c.daysMax <= (Number(c.p.lowMaxDays) || 2); },
    weekly_days_unknown: function (c) { return !c.daysMax && !c.daysMin; },
    shift_times_missing: function (c) { return c.shift.missingTimes || (!c.shift.hasAnyEntry && (c.a.workDays || []).length === 0 && !c.a.anyDay); },
    short_shift: function (c) { return c.shift.hasShort; },
    weekday_daytime: function (c) { return c.shift.weekdayMorningToAfternoon; },
    weekend_missing: function (c) { return ((c.a.workDays || []).length > 0 || c.a.anyDay) && !c.shift.weekendBoth; },
    commute_block: function (c) { return c.commute > 0 && c.commute >= (Number(c.p.commuteBlockMinutes) || 90); },
    commute_warn: function (c) {
      return c.commute > (Number(c.p.commuteWarnMinutes) || 60) && c.commute < (Number(c.p.commuteBlockMinutes) || 90);
    },
    commute_car: function (c) { return c.a.commuteMethod === 'マイカー'; },
    side_job_student: function (c) { return c.a.sideJob === 'yes' && c.isStudent; },
    side_job_nonstudent: function (c) { return c.a.sideJob === 'yes' && !c.isStudent; },
    freeter_insurance: function (c) { return c.group === 'freeter'; },
    vacation_ng: function (c) {
      if (!c.features.vacation) return false;
      const ng = c.vacationItems.filter(function (v) { return (c.a.vacation || {})[v.id] === 'ng'; });
      return ng.length ? { vacationLabels: ng.map(function (v) { return v.label; }).join('・') } : false;
    },
    vacation_consult: function (c) {
      if (!c.features.vacation) return false;
      const cs = c.vacationItems.filter(function (v) { return (c.a.vacation || {})[v.id] === 'consult'; });
      return cs.length ? { vacationLabels: cs.map(function (v) { return v.label; }).join('・') } : false;
    },

    highschool_permission: function (c) { return c.isHighschool; },
    highschool_hours: function (c) { return c.isHighschool; },
    highschool_time_violation: function (c) {
      if (!c.isHighschool || c.shift.latestEndAbs == null) return false;
      const limit = toMinutes(c.p.highschoolLatestEnd || '22:00');
      return limit != null && c.shift.latestEndAbs > limit;
    },
    vocational_permission: function (c) { return c.group === 'vocational'; },

    foreign_permit_missing: function (c) {
      return c.isForeign && ['no', 'unknown', ''].indexOf(c.a.foreign.workPermit || '') >= 0;
    },
    foreign_hour_cap: function (c) { return c.isForeign && c.a.foreign.workPermit !== 'na'; },
    foreign_hour_cap_exceeded: function (c) {
      if (!c.isForeign || c.a.foreign.workPermit === 'na') return false;
      const cap = (Number(c.p.foreignWeeklyHourCap) || 28) * 60;
      return c.shift.weeklyMinutes > cap ? { weeklyHours: Math.round(c.shift.weeklyMinutes / 6) / 10 } : false;
    },
    foreign_expiry: function (c) {
      if (!c.isForeign || c.a.foreign.workPermit === 'na') return false;
      const exp = c.a.foreign.residenceExpiry;
      if (!exp) return { residenceExpiry: '未入力' };
      const m = /^(\d{4})-(\d{2})/.exec(exp);
      if (!m) return { residenceExpiry: exp };
      const months = Number(c.p.residenceExpiryWarnMonths) || 6;
      const limit = new Date();
      limit.setMonth(limit.getMonth() + months);
      const expDate = new Date(Number(m[1]), Number(m[2]), 0); // 月末
      return expDate <= limit ? { residenceExpiry: exp } : false;
    },
    foreign_japanese: function (c) {
      if (!c.isForeign) return false;
      const levels = c.profile.options.japaneseLevels || [];
      const lv = c.a.foreign.japaneseLevel;
      return lv && levels.length && lv === levels[levels.length - 1] ? { japaneseLevel: lv } : false;
    },

    late_night_ng: function (c) { return c.features.lateNight && c.a.lateNight.availability === 'ng'; },
    late_night_consult: function (c) { return c.features.lateNight && c.a.lateNight.availability === 'consult'; },
    late_night_shift_conflict: function (c) {
      return c.features.lateNight && c.a.lateNight.availability === 'ng' && c.shift.isLateNight;
    },
    late_night_last_train: function (c) {
      if (!c.features.lateNight) return false;
      const ln = c.a.lateNight;
      const wants = ln.availability === 'ok' || ln.availability === 'consult' || c.shift.isLateNight;
      return wants && ln.returnMethod === 'train' && !ln.lastTrain;
    },
    late_night_taxi_over: function (c) {
      if (!c.features.lateNight || !c.features.taxi) return false;
      return c.a.lateNight.returnMethod === 'taxi' && c.taxiFare > 0 && c.taxiFare > (Number(c.p.taxiLimitYen) || 0);
    },
    late_night_taxi_unknown: function (c) {
      if (!c.features.lateNight || !c.features.taxi) return false;
      return c.a.lateNight.returnMethod === 'taxi' && !(c.taxiFare > 0);
    },
    late_night_taxi_ok: function (c) {
      if (!c.features.lateNight || !c.features.taxi) return false;
      return c.a.lateNight.returnMethod === 'taxi' && c.taxiFare > 0 && c.taxiFare <= (Number(c.p.taxiLimitYen) || 0);
    }
  };

  function buildContext(applicant, profile) {
    const a = applicant;
    const p = profile.params || {};
    const group = categoryGroup(profile, a.category);
    const shift = analyzeShifts(a, profile);
    const features = profile.features || {};
    return {
      a: a, p: p, profile: profile, features: features, shift: shift,
      group: group,
      isStudent: isStudentGroup(group),
      isHighschool: group === 'highschool',
      isForeign: !!features.foreignNational && (a.foreign || {}).isForeign === 'yes',
      age: Number(a.age) || 0,
      commute: Number(a.commuteMinutes) || 0,
      daysMin: Number(a.daysMin) || 0,
      daysMax: Number(a.daysMax) || 0,
      taxiFare: Number((a.lateNight || {}).taxiFare) || 0,
      vacationItems: profile.options.vacationItems || []
    };
  }

  function templateVars(c, extra) {
    const p = c.p;
    const base = {
      name: c.a.name ? c.a.name + 'さん' : '応募者',
      age: c.a.age,
      maxAge: p.maxAge,
      commuteTime: c.a.commuteMinutes,
      nearestStation: c.a.nearestStation,
      minDays: c.a.daysMin,
      maxDays: c.a.daysMax,
      minShiftHours: Math.round(((Number(p.minShiftMinutes) || 180) / 60) * 10) / 10,
      highschoolLatestEnd: p.highschoolLatestEnd,
      foreignWeeklyHourCap: p.foreignWeeklyHourCap,
      foreignVacationWeeklyHourCap: p.foreignVacationWeeklyHourCap,
      weeklyHours: Math.round(c.shift.weeklyMinutes / 6) / 10,
      taxiFare: c.taxiFare ? c.taxiFare.toLocaleString('ja-JP') : '',
      taxiLimitYen: p.taxiLimitYen != null ? Number(p.taxiLimitYen).toLocaleString('ja-JP') : '',
      closeEndHour: p.closeEndHour,
      lateNightStartHour: p.lateNightStartHour,
      residenceExpiry: (c.a.foreign || {}).residenceExpiry,
      japaneseLevel: (c.a.foreign || {}).japaneseLevel
    };
    return Object.assign(base, extra || {});
  }

  // ---------- 申し送り（留意点）生成 ----------
  function buildHandoff(applicant, profile) {
    const c = buildContext(applicant, profile);
    const items = [];

    (profile.handoffRules || []).forEach(function (rule) {
      if (!rule || rule.enabled === false) return;
      const fn = CONDITIONS[rule.id];
      if (!fn) return; // 条件未実装のルールはスキップ（HANDOFF.md 参照）
      let hit;
      try { hit = fn(c); } catch (e) { hit = false; }
      if (!hit) return;
      const extra = typeof hit === 'object' ? hit : {};
      const sev = SEVERITY[rule.severity] ? rule.severity : 'info';
      items.push({
        id: rule.id,
        severity: sev,
        category: rule.category || 'general',
        categoryLabel: CATEGORY_LABELS[rule.category] || rule.category || '全般',
        text: U.fill(rule.text, templateVars(c, extra))
      });
    });

    items.sort(function (x, y) { return SEVERITY[x.severity].order - SEVERITY[y.severity].order; });

    // 強み（面接者への共有用）
    const st = (profile.texts && profile.texts.strengths) || {};
    const strengths = [];
    const v = templateVars(c);
    const sh = c.shift;
    if (sh.isOpen && st.open) strengths.push({ key: 'open', text: U.fill(st.open, v) });
    if (sh.isClose && st.close) strengths.push({ key: 'close', text: U.fill(st.close, v) });
    if (sh.weekendBoth && st.weekend) strengths.push({ key: 'weekend', text: U.fill(st.weekend, v) });
    if (c.a.workPeriod === 'long' && st.longTerm) strengths.push({ key: 'longTerm', text: U.fill(st.longTerm, v) });
    if (c.daysMin >= 3 && st.days3) strengths.push({ key: 'days3', text: U.fill(st.days3, v) });
    if (sh.hasLong && !sh.hasShort && st.longShift) strengths.push({ key: 'longShift', text: U.fill(st.longShift, v) });
    if (c.commute > 0 && c.commute <= 30 && st.commuteNear) strengths.push({ key: 'commuteNear', text: U.fill(st.commuteNear, v) });
    if (c.features.vacation && c.vacationItems.length &&
        c.vacationItems.every(function (it) { return (c.a.vacation || {})[it.id] === 'ok'; }) && st.vacationOk) {
      strengths.push({ key: 'vacationOk', text: U.fill(st.vacationOk, v) });
    }
    if (c.features.lateNight && c.a.lateNight.availability === 'ok' && st.lateNightOk) {
      strengths.push({ key: 'lateNightOk', text: U.fill(st.lateNightOk, v) });
    }

    const counts = { block: 0, warn: 0, info: 0 };
    items.forEach(function (i) { counts[i.severity]++; });

    return {
      items: items,
      strengths: strengths,
      counts: counts,
      shift: sh,
      badges: shiftBadges(c),
      generatedAt: new Date().toISOString()
    };
  }

  // 右パネル等で使う短いバッジ
  function shiftBadges(c) {
    const b = [];
    const sh = c.shift;
    if (sh.isOpen) b.push({ key: 'open', label: 'オープン', tone: 'ok' });
    if (sh.isClose) b.push({ key: 'close', label: 'クローズ', tone: 'ok' });
    if (sh.isLateNight) b.push({ key: 'late', label: '深夜帯', tone: 'info' });
    if (sh.weekendBoth) b.push({ key: 'weekend', label: '土日可', tone: 'ok' });
    else if ((c.a.workDays || []).length) b.push({ key: 'weekend-ng', label: '土日要確認', tone: 'warn' });
    if (c.a.workPeriod === 'long') b.push({ key: 'long', label: '長期', tone: 'ok' });
    if (c.a.workPeriod === 'short') b.push({ key: 'short', label: '短期', tone: 'danger' });
    if (c.daysMin >= 3) b.push({ key: 'days', label: '週' + c.daysMin + '日〜', tone: 'ok' });
    if (sh.hasShort) b.push({ key: 'shortshift', label: '短時間日あり', tone: 'warn' });
    if (c.isForeign) b.push({ key: 'foreign', label: '外国籍', tone: 'info' });
    if (c.isHighschool) b.push({ key: 'hs', label: '高校生', tone: 'info' });
    return b;
  }

  // ---------- 採用可否判定 ----------
  function evaluateHiring(applicant, scores, profile, handoff, checks) {
    const ev = profile.evaluation || {};
    const items = ev.items || [];
    const scale = Number(ev.scaleMax) || 5;
    scores = scores || {};
    checks = checks || {};

    const breakdown = items.map(function (it) {
      const raw = scores[it.id];
      const s = raw === undefined || raw === null || raw === '' ? null : Number(raw);
      return { id: it.id, label: it.label, score: isNaN(s) ? null : s, isOverall: it.id === ev.overallItemId };
    });

    const unscored = breakdown.filter(function (b) { return b.score == null; });
    const total = breakdown.reduce(function (a, b) { return a + (b.score || 0); }, 0);
    const max = items.length * scale;
    const pct = max ? Math.round((total / max) * 1000) / 10 : 0;

    const th = ev.thresholds || {};
    const recPct = Number(th.recommendPct) || 70;
    const revPct = Number(th.reviewPct) || 40;

    let result = pct >= recPct ? 'recommend' : pct >= revPct ? 'review' : 'reject';
    const warnings = [];

    const overall = breakdown.find(function (b) { return b.isOverall; });
    const warnBelow = Number(ev.overallWarnBelow) || 3;
    if (overall && overall.score != null && overall.score < warnBelow) {
      warnings.push('面接者の総合判断が' + overall.score + '点と低評価です。採用可否は慎重に判断してください。');
    }
    if (unscored.length) {
      warnings.push('未入力の評価項目が' + unscored.length + '件あります（0点として集計）。');
    }

    const unresolved = ((handoff && handoff.items) || []).filter(function (i) { return !checks[i.id]; });
    const unresolvedBlock = unresolved.filter(function (i) { return i.severity === 'block'; });
    if (unresolved.length) {
      warnings.push('未確認の留意点が' + unresolved.length + '件あります（うち要判断 ' + unresolvedBlock.length + '件）。');
    }

    let adjusted = false;
    if (ev.holdOnUnresolvedBlock && result === 'recommend' && unresolvedBlock.length) {
      result = 'review';
      adjusted = true;
      warnings.push('「要判断」の留意点が未確認のため、採用推奨ではなく上長最終判断要として扱います。');
    }

    const strengths = breakdown.filter(function (b) { return b.score != null && b.score >= 4 && !b.isOverall; }).map(function (b) { return b.label; });
    const concerns = breakdown.filter(function (b) { return b.score != null && b.score <= 2 && !b.isOverall; }).map(function (b) { return b.label; });

    const t = (profile.texts || {})[result] || { title: result, body: '' };
    const name = applicant.name ? applicant.name + 'さん' : '応募者';

    return {
      result: result,
      title: t.title,
      body: U.fill(t.body, { name: name, total: total, max: max, pct: pct }),
      disclaimer: (profile.texts || {}).disclaimer || '',
      total: total, max: max, pct: pct,
      thresholds: {
        recommendPct: recPct, reviewPct: revPct,
        recommendPts: Math.ceil((max * recPct) / 100),
        reviewPts: Math.ceil((max * revPct) / 100)
      },
      breakdown: breakdown,
      strengths: strengths,
      concerns: concerns,
      warnings: warnings,
      unresolved: unresolved.map(function (i) { return { id: i.id, severity: i.severity, text: i.text }; }),
      adjusted: adjusted,
      evaluatedAt: new Date().toISOString()
    };
  }

  // ---------- 表示用整形 ----------
  function describeShifts(applicant, profile) {
    const sh = analyzeShifts(applicant, profile);
    return sh.entries.map(function (e) {
      return e.label + ' ' + e.start + '〜' + fmtEnd(e.end, e.nextDay) + '（' + fmtDuration(e.minutes) + '）';
    });
  }

  function describeApplicant(a, profile) {
    const o = profile.options || {};
    const f = profile.features || {};
    const rows = [];
    const add = function (label, value) { if (value !== undefined && value !== null && value !== '') rows.push({ label: label, value: value }); };

    add('氏名', a.name);
    add('性別', a.gender);
    add('年齢', a.age ? a.age + '歳' : '');
    add('区分', a.category);
    if (f.graduationDate) add('卒業予定', a.graduationDate);
    add('通勤方法', a.commuteMethod);
    add('通勤時間', a.commuteMinutes ? a.commuteMinutes + '分' : '');
    add('最寄り駅', a.nearestStation);

    const dayLabels = a.anyDay ? '曜日問わず' : DAYS.filter(function (d) { return (a.workDays || []).indexOf(d.key) >= 0; }).map(function (d) { return d.label; }).join('・');
    add('勤務可能曜日', dayLabels);
    const dmin = a.daysMin, dmax = a.daysMax;
    add('週勤務日数', dmin || dmax ? (dmin || '?') + '〜' + (dmax || '?') + '日' : '');
    add('希望シフト', describeShifts(a, profile).join(' / '));
    add('勤務期間', labelOf(o.workPeriods, a.workPeriod));
    add('かけもち', a.sideJob === 'yes' ? 'あり' + (a.sideJobDetail ? '（' + a.sideJobDetail + '）' : '') : a.sideJob === 'no' ? 'なし' : '');

    if (f.vacation) {
      const v = (o.vacationItems || []).map(function (it) {
        const val = (a.vacation || {})[it.id];
        return val ? it.label + ':' + (TRI_LABELS[val] || val).charAt(0) : null;
      }).filter(Boolean).join('　');
      add('長期休暇', v);
    }
    if (f.lateNight) {
      const ln = a.lateNight || {};
      const parts = [];
      if (ln.availability) parts.push(TRI_LABELS[ln.availability] || ln.availability);
      if (ln.returnMethod) parts.push(labelOf(o.returnMethods, ln.returnMethod));
      if (ln.returnMethod === 'train' && ln.lastTrain) parts.push('終電 ' + ln.lastTrain);
      if (f.taxi && ln.returnMethod === 'taxi' && ln.taxiFare) parts.push('料金目安 ' + Number(ln.taxiFare).toLocaleString('ja-JP') + '円');
      add('深夜帯（' + (profile.params.lateNightStartHour || 22) + '時以降）', parts.join(' / '));
    }
    if (f.foreignNational) {
      const fo = a.foreign || {};
      if (fo.isForeign === 'yes') {
        const parts = [];
        if (fo.residenceStatus) parts.push('在留資格: ' + fo.residenceStatus);
        if (fo.workPermit) parts.push('資格外活動許可: ' + labelOf(o.workPermitStates, fo.workPermit));
        if (fo.residenceExpiry) parts.push('在留期限: ' + fo.residenceExpiry);
        if (fo.japaneseLevel) parts.push('日本語: ' + fo.japaneseLevel);
        add('外国籍', parts.join(' / ') || '該当');
      } else if (fo.isForeign === 'no') {
        add('外国籍', '該当なし');
      }
    }
    if (f.department) add('希望部署', a.department);
    if (f.applicationRoute) add('応募経路', a.applicationRoute);
    add('担当者所見', a.reviewerNotes);
    return rows;
  }

  global.RecruitRules = {
    DAYS: DAYS,
    SEVERITY: SEVERITY,
    CATEGORY_LABELS: CATEGORY_LABELS,
    TRI_LABELS: TRI_LABELS,
    CONDITIONS: CONDITIONS,
    toMinutes: toMinutes,
    duration: duration,
    fmtDuration: fmtDuration,
    fmtEnd: fmtEnd,
    categoryGroup: categoryGroup,
    isStudentGroup: isStudentGroup,
    labelOf: labelOf,
    analyzeShifts: analyzeShifts,
    buildHandoff: buildHandoff,
    evaluateHiring: evaluateHiring,
    describeApplicant: describeApplicant,
    describeShifts: describeShifts
  };
})(window);

  <script>
/* ---- storage.js ---- */
/*
 * 保存・読込
 * ----------------------------------------------------------------------
 * - 劇場プロファイル: localStorage に保存。JSON ファイルで書き出し／読み込み。
 * - 応募者レコード  : 人が読めるHTMLレポートとして保存し、同じファイルに
 *                    <script type="application/json" id="recruit-record"> で元データを埋め込む。
 *                    読み込み時はこのJSONを取り出すだけなので、見た目を変えても壊れない。
 */
;(function (global) {

  const U = global.RecruitUtil;
  const PROFILE_KEY = 'recruit.profile.v1';
  const THEME_KEY = 'recruit.theme';
  const RECORD_KIND = 'recruit-applicant-record';

  function defaults() {
    return U.deepClone(global.RECRUIT_DEFAULT_PROFILE);
  }

  // 既定値に不足キーを補う。既定に追加された新ルールも末尾に追加する。
  function normalizeProfile(p) {
    const base = defaults();
    const merged = U.deepMerge(base, p || {});
    merged.handoffRules = Array.isArray(merged.handoffRules) ? merged.handoffRules : [];
    const ids = {};
    merged.handoffRules.forEach(function (r) { if (r && r.id) ids[r.id] = true; });
    base.handoffRules.forEach(function (r) { if (!ids[r.id]) merged.handoffRules.push(U.deepClone(r)); });
    if (!Array.isArray(merged.evaluation.items) || !merged.evaluation.items.length) {
      merged.evaluation.items = U.deepClone(base.evaluation.items);
    }
    return merged;
  }

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (!raw) return defaults();
      return normalizeProfile(JSON.parse(raw));
    } catch (e) {
      return defaults();
    }
  }

  function saveProfile(p) {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) { /* 保存不可環境 */ }
  }

    try { localStorage.removeItem(PROFILE_KEY); } catch (e) { /* noop */ }

  }

  function parseProfileJSON(text) {
    const obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object' || !obj.meta || !obj.handoffRules) {
      throw new Error('劇場プロファイルの形式ではありません。');
    }
    return normalizeProfile(obj);
  }

  function loadTheme() {
    try { return localStorage.getItem(THEME_KEY) || ''; } catch (e) { return ''; }
  }

  function saveTheme(t) {
    try { if (t) localStorage.setItem(THEME_KEY, t); else localStorage.removeItem(THEME_KEY); } catch (e) { /* noop */ }
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function safeName(s) {
    return String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || '応募者';
  }

  // ---------- 応募者レコード ----------
  function buildRecord(state) {
    const h = state.handoff;
    return {
      kind: RECORD_KIND,

      savedAt: new Date().toISOString(),
      profile: { theaterName: state.profile.meta.theaterName, version: state.profile.meta.version },
      step: state.step,

      handoff: {
        items: h ? h.items.map(function (i) { return { id: i.id, severity: i.severity, category: i.category, text: i.text }; }) : [],
        strengths: h ? h.strengths.map(function (s) { return s.text; }) : [],
        checks: U.deepClone(state.handoffChecks || {}),

      },

    };

  function parseRecordFromHTML(html) {

      const node = doc.querySelector('script#recruit-record[type="application/json"]');
      if (!node) return null;

    }).join('');
    const strengths = (record.handoff.strengths || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');

    const ev = profile.evaluation;
    const scoreRows = (ev.items || []).map(function (it) {
      const s = record.scores[it.id];
      return '<tr><td>' + esc(it.label) + '</td><td class="num">' + (s == null || s === '' ? '-' : esc(s) + '点') + '</td></tr>';
    }).join('');
    const hasScores = Object.keys(record.scores || {}).length > 0;

    const j = record.judgment;
    const judgmentHtml = j ? (
      '<div class="result ' + esc(j.result) + '">' +
      '<div class="result-title">' + esc(j.title) + '</div>' +
      '<div class="result-body">' + esc(j.body) + '</div>' +

      (j.warnings && j.warnings.length ? '<ul class="warn-list">' + j.warnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>' : '') +
      '<div class="disclaimer">' + esc(j.disclaimer) + '</div>' +

    ) : '<p class="muted">採用可否判定は未実施です。</p>';

    const json = JSON.stringify(record).replace(/<\//g, '<\\/');
    const SCRIPT_END = '</scr' + 'ipt>';

    return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +

      '<style>\n' +
      'body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;max-width:860px;margin:0 auto;padding:24px;color:#1a2233;background:#fff;line-height:1.6}\n' +

      'h2{font-size:15px;margin:28px 0 10px;padding-left:10px;border-left:4px solid #1f5fbf}\n' +
      'table{width:100%;border-collapse:collapse;font-size:14px}\n' +
      'th,td{border:1px solid #dde3ea;padding:7px 10px;text-align:left;vertical-align:top}\n' +
      'th{width:9em;background:#f3f5f8;font-weight:600;color:#5b6675}\ntd.num{text-align:right;width:6em}\n' +

  <script>

            sLines('options.categories', '区分', { type: 'categories', hint: '「値|グループ」の形式。グループ: ' + GROUP_HINT }) +

          '</div>' +
