      //   いちばん下までスクロールすれば用紙と注記がバーに隠れない（画面だけ。印刷の 1 ページに影響させない）。保存後は［×］で閉じられる
      '.savebar{position:fixed;z-index:40;right:12px;bottom:12px;max-width:calc(100vw - 24px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:#fdf1dc;border:1px solid #f3cf8a;box-shadow:0 4px 14px rgba(16,24,40,.15);font-size:13px}',
      '.savebar-x{font:inherit;font-size:16px;line-height:1;padding:3px 6px;border:0;border-radius:6px;background:transparent;color:#5b6675;cursor:pointer}.savebar-x:hover{background:rgba(0,0,0,.06)}',
      '@media screen{body.a4-sb{padding-bottom:calc(var(--a4-sbh,49px) + 12px)}}',
      '@page{size:A4 portrait;margin:0}',
      '@media print{',
      'html,body{background:#fff}',
      'body>.a4{margin:0;box-shadow:none}',
      '.a4-foot,.pop,.savebar{display:none !important}',

      '.a4 [data-a4-t],.a4 [data-a4-t]:focus,.a4 [data-a4-t]:focus-visible{outline:none !important}',

  }
  // ---------- 面接チェックリスト報告（A4 縦 1 枚の用紙。アプリ ③ の紙・アプリの印刷・保存 HTML で共用。docs/SPEC-a4.md） ----------
  //   DOM 非依存の HTML 文字列を返す。o = { decisionId, decisionSvgId, stampSvgPrefix, refWhere }（台本の全文を出す 'section' は 2026-10-14 に削除。
  //   refWhere は面接メモの案内の「画面で」の言い換え。アプリ ③ の紙だけが '保存した HTML の画面で' を渡す）
  //   1 ページの上限: 用紙の内寸の高さ 281mm（≒ 1062px）から 10px の余裕。押印行を含む .cl-sheet 全体の高さで計る
  const CL_SHEET_LIMIT_PX = 1052;
  // 「面接メモ・所見」の枠の手書き用の罫線（7.5mm 間隔の薄い点線）。内寸の高さ 281mm を超える本数（38 本）を置き、枠の外は切る
  const CL_NM_LINES = new Array(39).join('<i></i>');
  function clFmtDate(v) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(asStr(v)); return m ? m[1] + '/' + m[2] + '/' + m[3] : asStr(v); }
  function clFmtMonth(v) { const m = /^(\d{4})-(\d{2})$/.exec(asStr(v)); return m ? m[1] + '年' + Number(m[2]) + '月' : asStr(v); }

  // 1 ページ用の短い名前（質問・合否連絡・記入欄）。short → 既定の台本の short（文言が既定と同じ項目だけ。short の無い旧い設定・記録の台本）→
  //   文言の先頭 14 文字＋「…」（前後の「」は外す）。設定の文言を後から変えても古い short が残らないよう、正規化では補わず描画時に決める
  function clShortFallback(label) {
    const t = asStr(label).trim().replace(/^「/, '').replace(/」$/, '');
    const ch = Array.from(t);
    return ch.length > 14 ? ch.slice(0, 14).join('') + '…' : t;
  }
  function clDefaultItems() {
    const out = {};
    ((defaults().checklist || {}).sections || []).forEach(function (s) {
      ((s && s.blocks) || []).forEach(function (b) { ((b && b.items) || []).forEach(function (it) { if (it && it.id) out[it.id] = it; }); });
    });
    return out;
  }
  function clShortOf(it, baseItems) {
    const s = asStr(it && it.short).trim();
    if (s) return s;
    const b = baseItems && it ? baseItems[it.id] : null;
    if (b && asStr(b.short).trim() && asStr(b.label) === asStr(it.label)) return asStr(b.short).trim();
    return clShortFallback(it && it.label);
  }

  // 1 ページ保証（docs/SPEC-a4.md 4-2・12 章）。.cl-sheet 全体（押印行を含む）の内容の高さ（.cl-measure を付けて用紙いっぱいに伸ばさない状態）で、
  //   まず .cl-roomy（ゆったり。内容が少ないとき）を試し、limit を超えたら通常、さらに超えたら次の順に詰める。
  //   .cl-compact（本文 9px・余白を詰める。質問の回答は 2 行のまま、面接所見は 10 行まで）→
  //   .cl-compact-q1（質問の回答・メモを 1 行、面接所見は 6 行まで）→ .cl-compact-2（質問の回答を省いて案内 1 行、面接所見は 4 行まで）→
  //   縮小（zoom。縮小後の高さを測り直し、上限に収まるまで下げる）。戻り値は付けた段階（'cl-roomy'・''・'cl-compact'…・'zoom'）。
  //   「…」で切れたメモ（.cl-nm-v・.cl-rt-nt）に .cl-cut を付け（保存 HTML ではクリックで全文）、1 つでもあれば .cl-nm-cut で案内 1 行を出す（案内の高さも含めて計る）。
  //   段階を決めたあと（縮小のときを除く）、「…」で切れた面接メモ（.cl-nm-v）が残っていれば、面接メモ・所見の枠の空き（罫線の部分）を使って
  //   行数の上限を広げる（docs/SPEC-a4.md 12 章 F5。面接所見 → ① のメモ → 質問の回答・ブロックのメモ〔用紙の順〕の順に、要素のインラインの
  //   -webkit-line-clamp で。内容の高さが limit を超えない範囲。罫線の空きは 0 行まで使う〔計測中も .cl-grow で .cl-roomy の罫線 38mm を外す〕）。
  //   全部入りきれば .cl-cut・.cl-nm-cut（「…」の案内）も外れる。最初にインラインの行数を外してから測り直すので、書き出したファイルを開き直しても同じ結果。
  //   広げるのは縦のはみ出し（scrollHeight − clientHeight）があるあいだだけ（.cl-cut は横のはみ出し＝折り返せない幅広の書記素でも付くので条件にしない）。
  //   行数を上げても見えない高さが減らなければ戻してやめ、1 要素 200 回まで（固まらない。12 章 F5）。
  //   アプリ ③ の紙（#appPaper）・アプリの印刷（#clSheet）・保存 HTML の用紙（#a4）に使う。祖先に zoom が掛かった状態で呼ばない（高さ・折り返しが変わる）。
  //   計測のあとは用紙いっぱいに伸びる（押印行は用紙の内寸の下端）。印刷のときに計測し直さない（画面と印刷で同じ）。
  //   保存 HTML にソースをそのまま埋め込むため、外部参照なしの ES5 で書く（関数内にコメントを書かない）
  function clFitSheet(sheet, limit) {
    if (!sheet || !sheet.getBoundingClientRect) return '';

    var hOf = function () {
      cls.add('cl-measure');
      var r = sheet.getBoundingClientRect().height;
      cls.remove('cl-measure');
      return r;
    };
    var cut = function () {
      var vs = sheet.querySelectorAll('.cl-nm-v,.cl-rt-nt'), c = false, k, v, on;
      for (k = 0; k < vs.length; k++) {
        v = vs[k];
        on = !!(v.getClientRects().length && (v.scrollHeight > v.clientHeight + 1 || v.scrollWidth > v.clientWidth + 1));
        if (on) c = true;
        if (v.classList) { if (on) v.classList.add('cl-cut'); else v.classList.remove('cl-cut'); }
      }
      if (c) cls.add('cl-nm-cut'); else cls.remove('cl-nm-cut');
    };
    var clampTo = function (v, n) {
      if (n) v.style.setProperty('-webkit-line-clamp', String(n));
      else {
        v.style.removeProperty('-webkit-line-clamp');
        if (v.getAttribute && v.removeAttribute && !v.getAttribute('style')) v.removeAttribute('style');
      }
    };
    var hidOf = function (v) { return v.scrollHeight - v.clientHeight; };
    var grow = function () {
      var qs = ['.cl-nm-iv .cl-nm-v', '.cl-nm-memo .cl-nm-v', '.cl-nm-q .cl-nm-v,.cl-nm-b .cl-nm-v'], list = [], k, j, a, v, cs, n0, m, lh, add, h2, hid, t;
      if (typeof getComputedStyle !== 'function') return;
      for (k = 0; k < qs.length; k++) { a = sheet.querySelectorAll(qs[k]); for (j = 0; j < a.length; j++) list.push(a[j]); }
      cls.add('cl-grow');
      for (k = 0; k < list.length; k++) {
        v = list[k];
        if (!v.style || !v.classList || !v.classList.contains('cl-cut')) continue;
        cs = getComputedStyle(v);

        if (!(m > 0) || !(lh > 0)) continue;
        for (t = 0; t < 200; t++) {
          hid = hidOf(v);
          if (!(hid > 1)) break;
          add = Math.max(1, Math.min(Math.ceil(hid / lh), Math.floor((limit - h) / (lh * z))));
          clampTo(v, m + add); cut(); h2 = hOf();
          if (h2 > limit && add > 1) { add = 1; clampTo(v, m + 1); cut(); h2 = hOf(); }
          if (h2 > limit || !(hidOf(v) < hid)) { clampTo(v, m === n0 ? 0 : m); cut(); break; }
          m += add; h = h2;
        }
      }
      cls.remove('cl-grow');
    };
    vs = sheet.querySelectorAll('.cl-nm-v');
    for (i = 0; i < vs.length; i++) { if (vs[i] && vs[i].style && vs[i].style.removeProperty) clampTo(vs[i], 0); }
    for (i = 0; i < lv.length; i++) cls.remove(lv[i]);
    sheet.style.zoom = '';
    cls.add('cl-roomy');
    cut();
    h = hOf();
    if (h && h <= limit) mode = 'cl-roomy';
    else {
      cls.remove('cl-roomy');
      cut();
      h = hOf();
      if (!h || h <= limit) mode = '';
      for (i = 0; i < lv.length && mode === 'zoom'; i++) {
        cls.add(lv[i]);
        cut();
        h = hOf();
        if (h <= limit) mode = lv[i];
      }
    }
    if (mode !== 'zoom') {
      if (h) grow();
      return mode;
    }
    for (n = 0; n < 12 && h > limit && z > 0.3; n++) {
      z = Math.max(0.3, Math.floor(z * limit / h * 1000) / 1000 - (n ? 0.005 : 0));
      sheet.style.zoom = String(z);
      h = hOf();
    }
    if (h && h <= limit) grow();
    return 'zoom';
  }
  function fitChecklistSheet(sheet, limit) {
    return clFitSheet(sheet, typeof limit === 'number' && limit > 0 ? limit : CL_SHEET_LIMIT_PX);
  }

  // ロゴ（brand.js。公開版は空）。base64 の data URL の画像だけを受け付ける（javascript:・http(s)・data:text/html・引用符入りは使わない）。
  //   alt は logoAlt → 劇場名。呼び出し側でエスケープする。用紙の見出し（checklistSheetHtml）とアプリのサイドバー（app.renderBrand）で使う
  const LOGO_RE = /^data:image\/(png|jpeg|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/;
  function brandLogo(theaterName) {
    const b = global.RecruitBrand || {};
    if (typeof b.logo !== 'string' || !LOGO_RE.test(b.logo)) return null;
    return { src: b.logo, alt: asStr(b.logoAlt).trim() || asStr(theaterName) };
  }

  // 用紙の見出し（白地＋濃紺の下線。左にロゴ・題、右に 台本の版／劇場名／日付）。報告書（面接チェックリスト報告）と面接記入シートで共用。
  //   label = 題（例: 面接チェックリスト報告）、dateText = 右端の日付（例: 作成 2026/10/10・印刷 2026/10/10）
  function clTitleHtml(meta, def, label, dateText) {
    const esc = U.esc;
    meta = meta || {};
    const logo = brandLogo(meta.theaterName);
    const right = [def && def.version ? '台本 ' + def.version + ' 版' : '', asStr(meta.theaterName).trim(), asStr(dateText)].filter(Boolean).join(' ／ ');
    return '<div class="cl-title">' + (logo ? '<img class="cl-title-logo" src="' + logo.src + '" alt="' + esc(logo.alt) + '">' : '') +
      '<span class="cl-title-t">' + esc(label) + '</span><span class="cl-title-r">' + esc(right) + '</span></div>';
  }

  function checklistSheetHtml(record, profile, o) {
    const R = global.RecruitRules;
    o = o || {};
    record = record || {};
    profile = profile || defaults();
    const a = record.applicant || {};
    const cl = U.isObj(record.checklist) ? record.checklist : R.emptyChecklist();
    const def = normalizeChecklistDef(record.checklistDef || profile.checklist, defaults().checklist);
    const prof = Object.assign({}, profile, { checklist: def });
    const sum = R.checklistSummary(a, cl, prof, { management: record.management });
    return clOnePageHtml(record, profile, o, def, sum);
  }

  // ---- A4「面接チェックリスト報告」（1 ページの要約。docs/SPEC-checklist.md 4-2・docs/SPEC-a4.md 1-2） ----
  //   上から: 見出し（白地＋濃紺の下線。左にロゴ・題、右に版／劇場／作成日）→ 応募者（2 行）→ 結果ストリップ（結果・総合判断・必須条件・確認点・人物像・最終合否、調整 1 行）→
  //   必須条件｜勤務条件の確認 → 確認点（6 行）｜人物像（7 行。docs/SPEC-persona.md 4 章）→ 面接メモ・所見の枠（残りの高さいっぱい。記入の下は手書き用の罫線。確認点のメモもここ）→
  //   説明・連絡（1 行）→ 押印行（record.management。用紙の内寸の下端）。人物像を使わない記録・OFF は従来の 4 タイル・確認点の表だけ
  //   色は結果・○△×（必須条件の一致／不一致を含む）・最終合否・ハンコだけ。他はグレースケール
  function clOnePageHtml(record, profile, o, def, sum) {
    const esc = U.esc;
    const a = record.applicant || {};
    const meta = profile.meta || {};
    const texts = profile.texts || {};
    const titleOf = function (r) { return ((texts[r] || {}).title) || r; };
    const baseItems = clDefaultItems();
    const shortOf = function (it) { return clShortOf(it, baseItems); };
    const dash = '<span class="cl-blank">—</span>';
    const val = function (v) { const s = asStr(v).trim(); return s ? esc(s) : dash; };
    const hd = sum.header;
    const m = sum.must;
    const sc = sum.score;
    const cnt = sc.counts || { good: 0, fair: 0, poor: 0, blank: 0 };
    const posting = asStr(hd.posting);

    // ---- 1. 見出し（ロゴは brand.js にあるときだけ） ----
    const created = U.fmtDate(record.savedAt ? new Date(record.savedAt) : new Date());
    const titleHtml = clTitleHtml(meta, def, '面接チェックリスト報告', '作成 ' + clFmtDate(created));

    // ---- 2. 応募者（1 行目: 氏名・区分・年齢・性別・卒業予定／2 行目: 面接日・担当・求人・タクシー。空の値は項目ごと省く） ----
    const kv = [];
    const kvPush = function (k, v) { const s = asStr(v).trim(); if (s) kv.push('<div><dt>' + esc(k) + '</dt><dd>' + esc(s) + '</dd></div>'); };
    kvPush('面接日', hd.date ? clFmtDate(hd.date) : '');
    kvPush('担当', hd.interviewer);
    kvPush(((def.header || {}).posting || {}).label || '応募した求人', hd.postingLabel);
    kvPush('タクシー可否・料金', hd.taxi && hd.taxi.text);
    //   面接時間（docs/SPEC-flow.md 5-2・F19）: 評価の画面で入れた分か、タイマーの合計。記録が無い・0 秒なら出さない
    const tmg = sum.timing;
    if (tmg && tmg.text) kvPush('面接時間', tmg.text + (tmg.goalMin ? '（目安 ' + tmg.goalMin + '分）' : ''));
    const who = [a.category, a.age ? a.age + '歳' : '', a.gender].filter(Boolean).join('・');
    const grad = asStr(a.graduationDate).trim() ? clFmtMonth(asStr(a.graduationDate).trim()) : '';
    const headHtml = '<div class="cl-sheet-head">' + titleHtml +
      '<div class="cl-who"><div class="cl-who-1"><span class="cl-sh-name">' + esc(a.name || '応募者') + '<small>さん</small></span>' +
        (who ? '<span class="cl-sh-who">' + esc(who) + '</span>' : '') +
        (grad ? '<span class="cl-sh-grad"><b>卒業予定</b>' + esc(grad) + '</span>' : '') + '</div>' +
        (kv.length ? '<dl class="cl-sh-kv">' + kv.join('') + '</dl>' : '') + '</div></div>';

    // ---- 3. 結果ストリップ（判定を勝手に走らせない。未実施ならその旨） ----
    const j = record.judgment;
    const hasJ = !!(j && j.result);
    const resTone = { recommend: 't-ok', review: 't-warn', reject: 't-danger' };
    const resTile = '<div class="cl-tile cl-tile-res ' + (hasJ ? (resTone[j.result] || '') : 't-none') + '"><span class="cl-tile-k">結果</span>' +
      '<span class="cl-tile-v">' + (hasJ ? esc(j.title || titleOf(j.result)) : '未実施') + '</span>' +
      '<span class="cl-tile-s">' + (hasJ ? esc(j.evaluatedAt ? '判定 ' + U.fmtDateTime(j.evaluatedAt) : '') : '判定前') + '</span></div>';
    const ov = sum.overall;
    const ovTile = '<div class="cl-tile cl-tile-ov"><span class="cl-tile-k">総合判断</span><span class="cl-tile-v">' + (ov.value ? esc(ov.label) : '未入力') + '</span></div>';
    const mustTile = '<div class="cl-tile cl-tile-must' + (m.mismatch ? ' is-ng' : '') + '"><span class="cl-tile-k">必須条件</span><span class="cl-tile-v">' +
      (!m.total ? '—' : m.mismatch ? '不一致 ' + m.mismatch : m.unknown ? '未確認 ' + m.unknown : 'すべて一致') + '</span>' +
      (m.total && m.mismatch && m.unknown ? '<span class="cl-tile-s">未確認 ' + m.unknown + '</span>' : '') + '</div>';
    const scoreTile = '<div class="cl-tile cl-tile-score"><span class="cl-tile-k">確認点</span><span class="cl-tile-v">' + esc(sc.total) + '<small>/' + esc(sc.max) + '点</small></span>' +
      '<span class="cl-tile-s">' + esc('○' + cnt.good + ' △' + cnt.fair + ' ×' + cnt.poor + (cnt.blank ? ' 未入力' + cnt.blank : '')) + '</span></div>';
    // 人物像（docs/SPEC-persona.md 4-1。人物像を使わない記録・OFF は出さない＝従来の 4 タイル）。名前は見出しの末尾の「（…）」を外したもの。1 点の項目があれば値が赤（is-ng）
    const ps = sum.persona;
    const psName = ps ? (asStr(ps.title).replace(/\s*[（(][^（）()]*[）)]\s*$/, '').trim() || '人物像') : '';
    const psOnes = ps && ps.ones.length ? '・1点あり' : '';
    const psTile = ps ? '<div class="cl-tile cl-tile-ps' + (psOnes ? ' is-ng' : '') + '"><span class="cl-tile-k">' + esc(psName) + '</span><span class="cl-tile-v">' +
      (ps.scored ? esc(ps.total) + '<small>/' + esc(ps.max) + '点</small>' : '未入力') + '</span>' +
      (ps.scored ? '<span class="cl-tile-s">' + esc((ps.complete ? ps.pct + '%' : '未入力 ' + ps.unscored) + psOnes) + '</span>' : '') + '</div>' : '';
    // 最終合否（有効時のみ）。ストリップの右端（docs/SPEC-report.md 4-7）
    let decHtml = '';
    if (global.RecruitStamp) {
      const dcfg = decisionConfig(profile);
      if (dcfg.enabled) decHtml = global.RecruitStamp.decisionSheet(normalizeDecision(record.decision), decOpts(dcfg, o.decisionId || 'clDecision', o.decisionSvgId || 'vdSheet'));
    }
    // 調整（ストリップの下に 1 件 1 行）。必須条件の不一致は「必須条件の不一致により「…」に固定」と書く（docs/SPEC-script-mode.md 11-4 F6）
    const adjHtml = hasJ && (j.adjustments || []).length ? '<ul class="cl-adj">' + j.adjustments.map(function (x) {
      const head = x.code === 'must_conditions' ? '必須条件の不一致により「' + esc(titleOf(x.to)) + '」に固定'
        : x.from === x.to ? esc(titleOf(x.to)) + '（固定）' : esc(titleOf(x.from)) + ' → ' + esc(titleOf(x.to));
      return '<li><b>' + head + '</b>：' + esc(x.reason) + '</li>';
    }).join('') + '</ul>' : '';
    // ストリップの地色は結果に合わせる（data-result。class は従来どおり "cl-judge"）
    const judgeHtml = '<div class="cl-judge' + (hasJ ? '"' + ' data-result="' + esc(j.result) + '"' : ' cl-judge-none"') + '><div class="cl-judge-row"><div class="cl-judge-main">' +
      '<div class="cl-tiles' + (ps ? ' has-ps' : '') + '">' + resTile + ovTile + mustTile + scoreTile + psTile + '</div></div>' + decHtml + '</div>' + adjHtml + '</div>';

    // ---- 4. 必須条件（＋必須条件の直後の記入欄）｜勤務条件の確認（ほかの記入欄） ----
    const mustBlocks = [], leftFields = [], rightFields = [];
    sum.sections.forEach(function (s) {
      let afterMust = false;
      s.blocks.forEach(function (b) {
        if (b.type === 'must') { mustBlocks.push(b); afterMust = true; return; }
        if (b.type === 'fields') { (afterMust ? leftFields : rightFields).push(b); }
        afterMust = false;
      });
    });
    const fieldVal = function (it) {
      let v = it.effectiveLabel != null ? it.effectiveLabel : asStr(it.effective);
      if (it.kind === 'date') v = clFmtDate(v);
      else if (it.kind === 'month') v = clFmtMonth(v);
      return val(v);
    };
    const kvRows = function (blocks) {
      const rows = [];
      blocks.forEach(function (b) { b.items.forEach(function (it) { rows.push('<div data-cl-item="' + esc(it.id) + '"><dt>' + esc(shortOf(it)) + '</dt><dd>' + fieldVal(it) + '</dd></div>'); }); });
      return rows.length ? '<dl class="cl-kv">' + rows.join('') + '</dl>' : '';
    };
    const MUST_CLS = { match: 'm-match', mismatch: 'm-mismatch' };
    const mustRows = [];
    mustBlocks.forEach(function (b) {
      b.items.forEach(function (it) {
        mustRows.push('<tr class="' + (MUST_CLS[it.value] || 'm-unknown') + '" data-cl-item="' + esc(it.id) + '"><td class="cl-mm-c"><span class="cl-mm">' + esc(it.mark + it.valueLabel) + '</span></td>' +
          '<td class="cl-mm-l">' + esc(it.label) + '</td></tr>');
      });
    });
    const leftHtml = mustRows.length || leftFields.length
      ? '<section class="cl-blk cl-blk-must' + (m.mismatch ? ' cl-must-ng' : '') + '"><h3 class="cl-h">必須条件</h3>' +
        (mustRows.length ? '<table class="cl-mtab"><tbody>' + mustRows.join('') + '</tbody></table>' : '') + kvRows(leftFields) + '</section>'
      : '';
    const rightHtml = rightFields.length ? '<section class="cl-blk cl-blk-terms"><h3 class="cl-h">勤務条件の確認</h3>' + kvRows(rightFields) + '</section>' : '';
    const colsHtml = leftHtml && rightHtml ? '<div class="cl-cols">' + leftHtml + rightHtml + '</div>' : leftHtml + rightHtml;

    // ---- 5. 確認点（全項目。未入力の行も出す＝何を見なかったか分かる）｜人物像（1〜5 点。docs/SPEC-persona.md 4-2） ----
    //   確認点のメモは表に載せず、面接メモ・所見の枠の 1 行「確認点のメモ」に（6 の memoRows）。人物像があれば 2 カラム（50:50）、無ければ確認点の表だけ（全幅）
    const MARK_CLS = { good: 'm-good', fair: 'm-fair', poor: 'm-poor' };
    const rateOnly = sum.ratings.length
      ? '<section class="cl-blk cl-blk-rate"><h3 class="cl-h">確認点<small>○ できている　△ やや不安　× できていない</small></h3>' +
        '<table class="cl-rt"><colgroup><col class="c-no"><col class="c-lbl"><col class="c-mk"></colgroup><tbody>' +
        sum.ratings.map(function (it) {
          return '<tr data-cl-item="' + esc(it.id) + '"><td class="cl-rt-no">' + esc(it.noMark) + '</td><td class="cl-rt-lbl">' + esc(it.label) + '</td>' +
            '<td class="cl-rt-mk"><span class="cl-mark ' + (MARK_CLS[it.value] || 'm-none') + '">' + (it.value ? esc(it.mark) : '—') + '</span></td></tr>';
        }).join('') + '</tbody></table></section>'
      : '';
    //   人物像: 項目名（1 行。はみ出しは「…」）・5 段の目盛り（点まで塗る）・点。未入力の行は目盛りが空で「—」。見出しに 1・3・5 の目安と合計
    const psLbl = ps ? ps.scaleLabels : [];
    const psSum = !ps ? '' : !ps.scored ? '未入力' : ps.total + '/' + ps.max + '点・' + (ps.complete ? ps.pct + '%' : '未入力 ' + ps.unscored);
    const personaHtml = ps
      ? '<section class="cl-blk cl-blk-persona"><h3 class="cl-h">' + esc(ps.title) + '<small>' + esc('1 ' + psLbl[0] + '　3 ' + psLbl[2] + '　5 ' + psLbl[4]) + '</small><span class="cl-ps-sum">' + esc(psSum) + '</span></h3>' +
        '<table class="cl-ps"><colgroup><col class="c-no"><col class="c-lbl"><col class="c-sc"><col class="c-v"></colgroup><tbody>' +
        ps.items.map(function (it, i) {
          const n = it.score || 0;
          let bar = '';
          for (let k = 1; k <= ps.scaleMax; k++) bar += k <= n ? '<i class="on"></i>' : '<i></i>';
          return '<tr data-ps-item="' + esc(it.id) + '" class="s-' + n + '"><td class="cl-ps-no">' + (i + 1) + '</td><td class="cl-ps-lbl">' + esc(it.label) + '</td>' +
            '<td class="cl-ps-sc"><span class="cl-ps-bar" aria-hidden="true">' + bar + '</span></td><td class="cl-ps-v">' + (n ? n : dash) + '</td></tr>';
        }).join('') + '</tbody></table></section>'
      : '';
    const rateHtml = rateOnly && personaHtml ? '<div class="cl-cols cl-cols-eval">' + rateOnly + personaHtml + '</div>' : rateOnly + personaHtml;

    // ---- 6. 面接メモ・所見の枠（記入があるものを上から。質問の回答は「短い名前：回答」2 行まで・面接所見・準備のメモ。記入が無くても空の枠と罫線） ----
    //   質問の回答は質問ごとの行（docs/SPEC-flow.md 5-2・F18。キーは「①＋短い名前」・data-cl-note は質問の id）。
    //   ブロックのメモ（2026-10-16 より前の記録の質問ブロックのメモ・質問以外のブロックのメモ）は今のまま 1 行（名前は 1 問目の短い名前＋「ほか n 問」。data-cl-block）
    const memoRows = [];
    let qRows = 0;
    sum.sections.forEach(function (s) {
      s.blocks.forEach(function (b) {
        if (b.type === 'question') {
          b.items.forEach(function (it) {
            const qt = asStr(it.note).trim();
            if (!qt) return;
            qRows++;
            memoRows.push('<div class="cl-nm-row cl-nm-q" data-cl-note="' + esc(it.id) + '"><div class="cl-nm-k"><span class="cl-nm-no">' + esc(s.noMark) + '</span>' + esc(shortOf(it)) + '</div>' +
              '<div class="cl-nm-v">' + esc(qt) + '</div></div>');
          });
        }
        const t = asStr(b.memoText).trim();
        if (!b.memo || !t) return;
        const isQ = b.type === 'question' && b.items.length;
        const k = isQ ? shortOf(b.items[0]) + (b.items.length > 1 ? ' ほか' + (b.items.length - 1) + '問' : '') : (b.memoLabel || b.title || 'メモ');
        if (isQ) qRows++;
        memoRows.push('<div class="cl-nm-row ' + (isQ ? 'cl-nm-q' : 'cl-nm-b') + '" data-cl-block="' + esc(b.id) + '"><div class="cl-nm-k"><span class="cl-nm-no">' + esc(s.noMark) + '</span>' + esc(k) + '</div>' +
          '<div class="cl-nm-v">' + esc(t) + '</div></div>');
      });
    });
    // 確認点のメモ（docs/SPEC-persona.md 4-3）: 1 行に「①具体性：…／④チーム行動：…」。行数は .cl-nm-b（ブロックのメモ）と同じ（切れたら .cl-cut・広げる順も同じ）
    const rtNotes = sum.ratings.filter(function (it) { return asStr(it.note).trim(); });
    if (rtNotes.length) {
      memoRows.push('<div class="cl-nm-row cl-nm-b cl-nm-rt"><div class="cl-nm-k">確認点のメモ</div><div class="cl-nm-v">' + rtNotes.map(function (it) {
        return '<span class="cl-nm-rt-i" data-cl-item="' + esc(it.id) + '"><b>' + esc(it.noMark + shortOf(it)) + '</b>：' + esc(asStr(it.note).trim()) + '</span>';
      }).join('<span class="cl-nm-rt-sep">／</span>') + '</div></div>');
    }
    const ivNotes = asStr(record.interviewNotes).trim();
    if (ivNotes) memoRows.push('<div class="cl-nm-row cl-nm-iv"><div class="cl-nm-k">面接所見</div><div class="cl-nm-v">' + esc(ivNotes) + '</div></div>');
    // ① 応募者のメモ（入力欄「メモ（任意）」）
    const rvNotes = asStr(a.reviewerNotes).trim();
    if (rvNotes) memoRows.push('<div class="cl-nm-row cl-nm-memo"><div class="cl-nm-k">メモ</div><div class="cl-nm-v">' + esc(rvNotes) + '</div></div>');
    // 案内 1 行: 「…」で切れたメモがあるとき（.cl-nm-cut）／質問の回答を省いたとき（.cl-compact-2）だけ表示（clFitSheet が付ける）。
    //   保存 HTML の画面では、切れたメモ・この行をクリックすると全文の窓が出る（docs/SPEC-a4.md 3-7）。印刷物（保存 HTML・アプリの印刷）は「画面で」。
    //   アプリ ③ の紙はクリックしても窓を出さないので、o.refWhere（'保存した HTML の画面で'）で言い換える
    const refWhere = asStr(o.refWhere) || '画面で';
    //   「面接メモ・所見」の枠（docs/SPEC-a4.md 12 章）: 常に出し、用紙の残りの高さいっぱいに広げる（押印行は用紙の下端）。
    //   記入があれば上から並べ、その下（記入が無ければ枠全体）は手書き用の薄い点線の罫線（.cl-nm-lines。7.5mm 間隔。高さの計測には入らない）
    const notesHtml = '<section class="cl-blk cl-blk-notes"><h3 class="cl-h">面接メモ・所見</h3><div class="cl-nm-box' + (memoRows.length ? '' : ' is-empty') + '">' +
      (memoRows.length
        ? '<div class="cl-nm">' + memoRows.join('') + '</div>' +
          '<p class="cl-nm-ref' + (qRows ? ' has-q' : '') + '"><span class="cl-nm-ref-c">「…」で切れたメモは、' + esc(refWhere) + 'クリックすると全文を表示します</span>' +
          (qRows ? '<span class="cl-nm-ref-q">質問の回答は省略（' + esc(refWhere) + 'この行をクリックすると、回答と「…」で切れたメモの全文を表示します）</span>' : '') + '</p>'
        : '') +
      '<div class="cl-nm-lines" aria-hidden="true">' + CL_NM_LINES + '</div></div></section>';

    // ---- 7. 説明・連絡（説明のチェック数。※短期求人のみ の項目は求人が短期のときだけ数える） ----
    const exParts = [], ntParts = [];
    sum.sections.forEach(function (s) {
      let n = 0, d = 0;
      s.blocks.forEach(function (b) {
        if (b.type === 'explain') {
          b.items.forEach(function (it) { if (it.shortOnly && posting !== 'short') return; d++; if (it.value) n++; });
        } else if (b.type === 'notify') {
          b.items.forEach(function (it) { ntParts.push('<span class="cl-ex-i' + (it.value ? '' : ' is-off') + '">' + esc(shortOf(it)) + ' ' + (it.value ? '☑' : '☐') + '</span>'); });
        }
      });
      if (d) exParts.push('<span class="cl-ex-i' + (n < d ? ' is-off' : '') + '">' + esc(s.noMark) + ' ' + n + '/' + d + '</span>');
    });
    const exHtml = exParts.length || ntParts.length
      ? '<div class="cl-exline">' +
        (exParts.length ? '<span class="cl-ex-k">説明済み</span>' + exParts.join('<span class="cl-ex-sep">・</span>') : '') +
        (exParts.length && ntParts.length ? '<span class="cl-ex-bar">｜</span>' : '') +
        (ntParts.length ? '<span class="cl-ex-k">合否連絡</span>' + ntParts.join('<span class="cl-ex-sep">／</span>') : '') + '</div>'
      : '';

    // ---- 8. 押印行（用紙の最下段。record.management と押印欄の設定から描く。2 件なら 2 列。ハンコの SVG の id は o.stampSvgPrefix＋番号） ----
    const mgFields = (U.isObj(profile.management) && Array.isArray(profile.management.fields) ? profile.management.fields : []).filter(function (f) { return U.isObj(f) && f.id; });
    const mgmt = U.isObj(record.management) ? record.management : {};
    const Stamp = global.RecruitStamp;
    const prefix = o.stampSvgPrefix || 'cl';
    const stampsHtml = mgFields.length
      ? '<div class="cl-stamps"><div class="stamp-row cl-stamps-row' + (mgFields.length === 2 ? ' cols-2' : '') + '">' + mgFields.map(function (fld, idx) {
        const e = U.isObj(mgmt[fld.id]) && mgmt[fld.id].name ? mgmt[fld.id] : null;
        return '<div class="stamp-box" data-field-id="' + esc(fld.id) + '"><div class="stamp-label">' + esc(fld.label) + '</div>' +
          '<div class="stamp-area">' + (e && Stamp ? Stamp.render(e, { size: 46, id: prefix + idx }) : '<div class="stamp-empty">未押印</div>') + '</div>' +
          '<div class="stamp-meta">' + (e ? esc(e.name + (e.title ? '（' + e.title + '）' : '') + '　' + (e.date || '')) : '') + '</div></div>';
      }).join('') + '</div></div>'
      : '';
    return '<div class="cl-sheet cl-mode-sheet">' + headHtml + judgeHtml + colsHtml + rateHtml + notesHtml + exHtml + stampsHtml + '</div>';
  }

      '.cl-sheet .stamp-box{display:flex;align-items:center;gap:6px;text-align:left;padding:2px 8px;border:1px solid #c9d2dd;border-radius:4px;background:#fff;min-width:0}',
      '.cl-sheet .stamp-label{font-size:9.5px;font-weight:700;min-width:5em;color:#1a2233}.cl-sheet .stamp-area{height:auto;display:grid;place-items:center}',
      '.cl-sheet .hanko{width:46px;height:46px}.cl-sheet .stamp-empty{width:44px;height:44px;font-size:8.5px;border:2px dashed #c7d0db;border-radius:50%;display:grid;place-items:center;color:#5b6675;background:#fff}',
      '.cl-sheet .stamp-meta{font-size:8.5px;min-height:0;line-height:1.3;color:#3a4556}',
      // 押せる欄の案内（保存 HTML の ::after。position:absolute）の土台は常時付けておく（ホバーで付け外しすると寸法が変わる）。
      //   アプリのダークテーマのハンコの明るさ補正（:root[data-theme="dark"] .hanko）を用紙では効かせない
      '.cl-sheet .stamp-box,.cl-mode-sheet .cl-decision{position:relative}',
      '.cl-sheet .hanko,.cl-sheet .verdict-stamp{filter:none !important}',
      // 1 ページ保証（clFitSheet）: 高さが A4 を超えたら .cl-compact（本文 9px・余白を詰める。質問の回答は 2 行のまま・面接所見 10 行・メモ 3 行まで）→
      //   .cl-compact-q1（質問の回答 1 行・面接所見 6 行・メモ 2 行）→ .cl-compact-2（質問の回答を省いて 1 行の案内・面接所見 4 行・メモ 1 行）。
      //   段階ごとの行数の上限はここで決め、段階を決めたあとで「…」で切れたメモが残り、面接メモ・所見の枠に空き（罫線の部分）があれば、clFitSheet が
      //   要素のインラインの -webkit-line-clamp で 1 行ずつ広げる（面接所見 → メモ → 質問の回答。docs/SPEC-a4.md 12 章 F5）
      '.cl-mode-sheet.cl-compact{font-size:9px;line-height:1.35}',
      '.cl-mode-sheet.cl-compact .cl-blk,.cl-mode-sheet.cl-compact .cl-cols,.cl-mode-sheet.cl-compact .cl-exline,.cl-mode-sheet.cl-compact .cl-stamps{margin-top:7px}',
      '.cl-mode-sheet.cl-compact .cl-mtab td,.cl-mode-sheet.cl-compact .cl-rt td,.cl-mode-sheet.cl-compact dl.cl-kv>div,.cl-mode-sheet.cl-compact .cl-nm-row{padding-top:2px;padding-bottom:2px}',
      '.cl-mode-sheet.cl-compact dl.cl-kv dd{-webkit-line-clamp:1}',
      '.cl-mode-sheet.cl-compact .cl-nm-k{-webkit-line-clamp:1}',
      '.cl-mode-sheet.cl-compact .cl-nm-iv .cl-nm-v,.cl-mode-sheet.cl-compact .cl-nm-memo .cl-nm-v{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:10;overflow:hidden}',
      '.cl-mode-sheet.cl-compact .cl-nm-memo .cl-nm-v{-webkit-line-clamp:3}',
      '.cl-mode-sheet.cl-compact-q1 .cl-nm-q .cl-nm-v,.cl-mode-sheet.cl-compact-q1 .cl-nm-b .cl-nm-v{-webkit-line-clamp:1}',
      '.cl-mode-sheet.cl-compact-q1 .cl-nm-iv .cl-nm-v{-webkit-line-clamp:6}.cl-mode-sheet.cl-compact-q1 .cl-nm-memo .cl-nm-v{-webkit-line-clamp:2}',
      '.cl-mode-sheet.cl-compact-2 .cl-nm-q{display:none}',
      '.cl-mode-sheet.cl-compact-2 .cl-nm-iv .cl-nm-v{-webkit-line-clamp:4}.cl-mode-sheet.cl-compact-2 .cl-nm-memo .cl-nm-v{-webkit-line-clamp:1}.cl-mode-sheet.cl-compact-2 .cl-adj li+li{display:none}',
      // ゆったり（clFitSheet が最初に試す。内容が少ないとき）: 本文 10.5px・行の高さ・確認点の行高・ブロックの間隔を広げる。
      //   面接メモ・所見の枠に罫線 38mm 分を残せるときだけ付く（計測中＝.cl-measure のときだけ .cl-nm-lines の最低の高さを 38mm にして計る。
      //   表示中は最低の高さを付けない＝狭い画面の --a4-zoom で行の高さが丸められて内容が数 % 伸びても、罫線の部分が縮んで吸収し、押印行は用紙の下端のまま）
      '.cl-mode-sheet.cl-roomy{font-size:10.5px;line-height:1.5}',
      '.cl-mode-sheet.cl-roomy .cl-judge{margin-top:10px}',
      '.cl-mode-sheet.cl-roomy .cl-blk,.cl-mode-sheet.cl-roomy .cl-cols,.cl-mode-sheet.cl-roomy .cl-exline,.cl-mode-sheet.cl-roomy .cl-stamps{margin-top:13px}',
      '.cl-mode-sheet.cl-roomy .cl-h{font-size:11.5px;margin-bottom:5px}.cl-mode-sheet.cl-roomy .cl-h small{font-size:9px}',
      '.cl-mode-sheet.cl-roomy .cl-mtab td,.cl-mode-sheet.cl-roomy dl.cl-kv>div,.cl-mode-sheet.cl-roomy .cl-nm-row{padding-top:4px;padding-bottom:4px}',
      '.cl-mode-sheet.cl-roomy .cl-rt td{padding-top:6px;padding-bottom:6px}',
      '.cl-mode-sheet.cl-roomy dl.cl-kv dt,.cl-mode-sheet.cl-roomy .cl-nm-k,.cl-mode-sheet.cl-roomy .cl-rt-no,.cl-mode-sheet.cl-roomy .cl-ex-k{font-size:9.5px}',
      '.cl-mode-sheet.cl-roomy .cl-mark{width:19px;height:19px;font-size:11px}',
      '.cl-mode-sheet.cl-roomy .cl-exline{padding:5px 10px}',
      '.cl-mode-sheet.cl-roomy .cl-ps td{padding-top:6px;padding-bottom:6px}.cl-mode-sheet.cl-roomy .cl-ps-bar i{height:11px}.cl-mode-sheet.cl-roomy .cl-ps-no{font-size:9.5px}',
      '.cl-mode-sheet.cl-compact .cl-ps td{padding-top:2px;padding-bottom:2px}',
      //   切れたメモを広げる計測（.cl-grow）では 38mm を外す（罫線の空きは 0 行まで使う。F5）
      '.cl-mode-sheet.cl-roomy.cl-measure:not(.cl-grow) .cl-nm-box .cl-nm-lines{min-height:38mm}',
      '.cl-sheet .cl-title-logo,.cl-sheet .cl-tile,.cl-sheet .hanko,.cl-sheet .stamp-empty,.cl-sheet .cl-judge,.cl-sheet .cl-mark,.cl-sheet .cl-mm,.cl-sheet .cl-exline,.cl-sheet .cl-decision,.cl-sheet .verdict-stamp,.cl-sheet .cl-dec-empty{-webkit-print-color-adjust:exact;print-color-adjust:exact}',
      '.cl-sheet .cl-ps-bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    ].join('\n');
  }

  // ---------- 面接記入シート（手書き用。A4 縦 1 枚。docs/SPEC-persona.md 5 章・docs/SPEC-flow.md 5-3） ----------
  //   紙に書いて面接し、面接のあとでアプリに転記する人のための白紙の記入用紙。並びはアプリの面接 → 評価の画面と同じ。用紙の部品（.a4・見出し .cl-title）は報告書と同じ。
  //   保存しない（印刷だけ）。印字するのは準備の応募者（氏名・区分/年齢/性別・面接日・担当・求人・タクシー）だけで、面接・評価の回答は印字しない。
  //   人物像の行は台本（def.persona）で決める（記録の persona === null は見ない）。DOM 非依存の HTML 文字列。o = { now }（印刷日。既定は今日）
  //   上から: 見出し → 応募者（1 行）→「面接」（2 段: 台本の 1 枚目〔page 1〕｜2 枚目以降。段階ごとに 確かめる〔必須条件・記入欄〕→ 話す〔□〕→ 聞く〔質問ごとに短い名前＋答えの線〕）→
  //   「評価」（確認点 ○△× 2 列・人物像 1〜5 の 2 列・総合判断〔＋面接時間〕・面接所見の罫線〔残りの高さいっぱい〕）
  const PP_NOTE_LINES = new Array(41).join('<i></i>');   // 面接所見の罫線（7mm 間隔。残りの高さいっぱいに置き、はみ出しは切る）
  function paperSheetHtml(record, profile, o) {
    const R = global.RecruitRules;
    const esc = U.esc;
    o = o || {};
    record = record || {};
    profile = profile || defaults();
    const a = U.isObj(record.applicant) ? record.applicant : {};
    const cl = U.isObj(record.checklist) ? record.checklist : R.emptyChecklist();
    const def = normalizeChecklistDef(record.checklistDef || profile.checklist, defaults().checklist);
    const prof = Object.assign({}, profile, { checklist: def });
    const sum = R.checklistSummary(a, cl, prof, { management: record.management });
    const meta = profile.meta || {};
    const baseItems = clDefaultItems();
    const shortOf = function (it) { return clShortOf(it, baseItems); };
    const line = '<span class="pp-line"></span>';
    const box = function (label) { return '<span class="pp-box"></span>' + esc(label); };
    const val = function (v) { const t = asStr(v).trim(); return t ? esc(t) : line; };
    // 見出し（報告書と同じ部品。右は 台本の版／劇場名／印刷日）
    const titleHtml = clTitleHtml(meta, def, '面接記入シート', '印刷 ' + clFmtDate(U.fmtDate(o.now ? new Date(o.now) : new Date())));
    // 応募者（準備に入力があれば印字、無ければ空欄の線。求人は未選択なら □通常求人 □短期求人）
    const hd = sum.header;
    const posting = U.isObj(def.header) && U.isObj(def.header.posting) ? def.header.posting : {};
    const pOpts = Array.isArray(posting.options) ? posting.options : [];
    const who = [asStr(a.category).trim(), asStr(a.age).trim() ? asStr(a.age).trim() + '歳' : '', asStr(a.gender).trim()].filter(Boolean).join('・');
    const name = asStr(a.name).trim();
    const whoHtml = '<dl class="pp-who">' +
      '<div class="pp-f pp-f-name"><dt>氏名</dt><dd>' + (name ? esc(name) : line) + '<small>さん</small>' + (who ? '<span class="pp-who-s">' + esc(who) + '</span>' : '') + '</dd></div>' +
      '<div class="pp-f"><dt>面接日</dt><dd>' + val(hd.date ? clFmtDate(hd.date) : '') + '</dd></div>' +
      '<div class="pp-f"><dt>担当</dt><dd>' + val(hd.interviewer) + '</dd></div>' +
      '<div class="pp-f"><dt>' + esc(asStr(posting.label) || '応募した求人') + '</dt><dd>' +
        (hd.postingLabel ? esc(hd.postingLabel) : pOpts.map(function (x) { return box(asStr(x.label) || asStr(x.value)); }).join('')) + '</dd></div>' +
      '<div class="pp-f"><dt>タクシー可否・料金</dt><dd>' + val(hd.taxi && hd.taxi.text) + '</dd></div></dl>';
    // 面接の段階（台本の順・ブロックの順）。必須条件は全文、記入欄・説明・質問・合否連絡は短い名前。注記・質問文・説明の全文は載せない。確認点は評価の部分へ
    const secHtml = function (s) {
      let h = '<section class="pp-sec" data-sec="' + esc(s.id) + '"><h3 class="pp-h"><span>' + esc(s.noMark + ' ' + s.title) + '</span>' +
        (s.minutesText ? '<small>' + esc((s.minutesMax ? '' : '目安 ') + s.minutesText) + '</small>' : '') + '</h3>';
      s.blocks.forEach(function (b) {
        if (!b.items.length) return;
        if (b.type === 'must') {
          h += '<table class="pp-t pp-must"><tbody>' + b.items.map(function (it) {
            return '<tr data-pp-item="' + esc(it.id) + '"><td class="pp-lbl">' + esc(it.label) + '</td><td class="pp-ch">' + box(R.MUST_VALUES.match.label) + box(R.MUST_VALUES.mismatch.label) + '</td></tr>';
          }).join('') + '</tbody></table>';
        } else if (b.type === 'fields') {
          h += '<dl class="pp-fields">' + b.items.map(function (it) {
            const opts = it.kind === 'choice' && Array.isArray(it.options) ? it.options : [];
            return '<div data-pp-item="' + esc(it.id) + '"><dt>' + esc(shortOf(it)) + '</dt><dd>' + (opts.length ? opts.map(function (x) { return box(asStr(x.label) || asStr(x.value)); }).join('') : line) + '</dd></div>';
          }).join('') + '</dl>';
        } else if (b.type === 'explain' || b.type === 'notify') {
          const so = b.type === 'explain' && b.items.some(function (it) { return it.shortOnly === true; });
          h += '<div class="pp-ex" data-pp-block="' + esc(b.id) + '"><span class="pp-k">' + (b.type === 'notify' ? '合否連絡' : '話す') + '</span>' +
            b.items.map(function (it) { return '<span class="pp-ck">' + box(shortOf(it) + (b.type === 'explain' && it.shortOnly === true ? '※' : '')) + '</span>'; }).join('') +
            (so ? '<span class="pp-note">※短期求人のみ</span>' : '') + '</div>';
        } else if (b.type === 'question') {
          //   質問ごとに 短い名前＋答えの線（同じ行）＋次の行の線 2 本（1 ページに収まらなければ fitPaperSheet が 3 → 2 → 1 本にする）。メモを取らない質問ブロック（memo: false）は名前だけ
          h += '<div class="pp-qs" data-pp-block="' + esc(b.id) + '">' + b.items.map(function (it, qn) {
            return '<div class="pp-qa" data-pp-q="' + esc(it.id) + '"><span class="pp-k pp-qk">' + (qn ? '' : '聞く') + '</span><span class="pp-qi">' + esc(shortOf(it)) + '</span>' +
              (b.memo ? '<span class="pp-ql"></span>' : '') + '</div>' + (b.memo ? '<div class="pp-qx" aria-hidden="true"><i></i><i></i></div>' : '');
          }).join('') + '</div>';
        }
      });
      return h + '</section>';
    };
    // 2 段: 台本の 1 枚目（page 1）を左、2 枚目以降を右（どちらかが空になる台本は前半 ceil(n/2) を左・残りを右）
    const secs = sum.sections;
    let left = secs.filter(function (s) { return s.page === 1; }), right = secs.filter(function (s) { return s.page >= 2; });
    if (!left.length || !right.length) { const half = Math.ceil(secs.length / 2); left = secs.slice(0, half); right = secs.slice(half); }
    const ivHtml = '<div class="pp-part" data-part="iv">面接<small>台本の順に：確かめる → 話す（□）→ 聞く（答えを線に）</small></div>' +
      '<div class="pp-cols"><div class="pp-col">' + left.map(secHtml).join('') + '</div><div class="pp-col">' + right.map(secHtml).join('') + '</div></div>';
    // 評価: 確認点（○△× に丸。2 列）・人物像（1〜5 に丸。2 列）・総合判断（採用／保留／不採用に丸）と面接時間・面接所見の罫線
    const halves = function (arr) { const n = Math.ceil(arr.length / 2); return [arr.slice(0, n), arr.slice(n)]; };
    const rates = R.checklistItems(def, 'rating');
    const rateTable = function (arr) {
      return '<table class="pp-t pp-rate"><tbody>' + arr.map(function (x) {
        return '<tr data-pp-item="' + esc(x.item.id) + '"><td class="pp-no">' + esc(x.noMark) + '</td><td class="pp-lbl">' + esc(x.item.label) + '</td><td class="pp-mk"><span>○</span><span>△</span><span>×</span></td></tr>';
      }).join('') + '</tbody></table>';
    };
    const rateHtml = rates.length
      ? '<div class="pp-k pp-rate-h">確認点（○ できている　△ やや不安　× できていない）</div><div class="pp-ev-cols">' + halves(rates).filter(function (x) { return x.length; }).map(rateTable).join('') + '</div>'
      : '';
    const pm = R.personaModel(def, { persona: {} });
    const psTable = function (arr, from) {
      return '<table class="pp-ps-t"><tbody>' + arr.map(function (it, i) {
        let sc = '';
        for (let k = 1; k <= pm.scaleMax; k++) sc += '<span>' + k + '</span>';
        return '<tr data-pp-ps="' + esc(it.id) + '"><td class="pp-no">' + (from + i + 1) + '</td><td class="pp-lbl">' + esc(it.label) + (it.hint ? '<small>' + esc(it.hint) + '</small>' : '') + '</td><td class="pp-sc">' + sc + '</td></tr>';
      }).join('') + '</tbody></table>';
    };
    const psHalves = pm ? halves(pm.items) : [];
    const psHtml = pm
      ? '<div class="pp-ps"><div class="pp-ps-head"><b>' + esc(pm.title) + '</b><span class="pp-legend">' + esc(pm.scaleLabels.map(function (l, i) { return (i + 1) + ' ' + l; }).join('　')) + '</span>' +
        '<span class="pp-ps-sum">合計 ' + line + ' / ' + pm.max + ' 点</span></div>' +
        '<div class="pp-ev-cols">' + psTable(psHalves[0], 0) + (psHalves[1].length ? psTable(psHalves[1], psHalves[0].length) : '') + '</div></div>'
      : '';
    const oo = U.isObj(def.overallOptions) ? def.overallOptions : {};
    const OVL = { hire: '採用', hold: '保留', reject: '不採用' };
    const ovHtml = '<div class="pp-ov"><span class="pp-k">' + esc(asStr(def.overallLabel).trim() || '面接者の総合判断') + '</span>' +
      ['hire', 'hold', 'reject'].map(function (k) { return '<span class="pp-ov-o">' + esc(asStr(oo[k]).trim() || OVL[k]) + '</span>'; }).join('') + '<small>（○で囲む）</small>' +
      '<span class="pp-ov-time"><span class="pp-k">面接時間</span>' + line + '分</span></div>';
    const notesHtml = '<div class="pp-notes"><span class="pp-k">面接所見</span><div class="pp-lines" aria-hidden="true">' + PP_NOTE_LINES + '</div></div>';
    const sumHtml = '<section class="pp-sum"><div class="pp-part" data-part="ev">評価<small>面接のあとに付ける</small></div>' + rateHtml + psHtml + ovHtml + notesHtml + '</section>';
    return '<div class="pp-sheet">' + titleHtml + whoHtml + ivHtml + sumHtml + '</div>';
  }

  // 面接記入シートのスタイル（アプリは起動時に 1 回 <style id="paperSheetCss"> に入れる。用紙の箱 .a4 は checklistSheetCss）。
  //   本文 11px・見出しは報告書と同じ寸法・罫線は点線・□ 12px の枠・面接は 2 段・評価の確認点と人物像は 2 列。シートは縦の flex で用紙の内寸いっぱい（面接所見の罫線が残りの高さ）。
  //   計測中（.pp-measure）は内容の高さ（面接所見の罫線は最低 PP_NOTES_MIN）。画面幅で変わる規則（@media）を置かない（画面と印刷で同じ）
  const PP_NOTES_MIN = '20mm';   // 実測（Chromium・既定の白紙）: 20mm で pp-a2 が 1039px（上限 1052px）・24mm だと 1055px で pp-a1 に落ちる（docs/SPEC-flow.md 13 章）
  function paperSheetCss() {
    return [
      '.pp-sheet{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,"Noto Sans JP",system-ui,sans-serif;font-size:11px;line-height:1.4;color:#111;background:#fff;display:flex;flex-direction:column;min-height:100%;max-height:100%}',
      '.pp-sheet.pp-measure{min-height:0 !important;max-height:none !important}',
      '.pp-sheet *{box-sizing:border-box}',
      '.pp-sheet .cl-title{display:flex;align-items:center;gap:8px;min-height:7mm;padding:0 1px 3px;border-bottom:2px solid #24324a}',
      '.pp-sheet .cl-title-logo{flex:none;display:block;height:7mm;width:auto;max-width:50mm;object-fit:contain}',
      '.pp-sheet .cl-title-t{flex:none;font-size:15px;font-weight:800;letter-spacing:.04em;line-height:1.3;color:#1a2233}',
      '.pp-sheet .cl-title-r{margin-left:auto;min-width:0;font-size:9.5px;color:#3a4556;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
      '.pp-who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin:0;padding:6px 2px 5px;border-bottom:1px solid #d5dbe3}',
      '.pp-who>div{display:flex;align-items:baseline;gap:5px;min-width:0;max-width:100%}',
      '.pp-who dt{flex:none;font-size:10px;font-weight:700;color:#5b6675}',
      '.pp-who dd{margin:0;min-width:0;font-weight:700;overflow-wrap:anywhere}',
      '.pp-f-name dd{font-size:16px;font-weight:800}.pp-f-name small{font-size:10px;font-weight:600;margin-left:2px}.pp-f-name .pp-who-s{font-size:10px;font-weight:600;color:#3a4556;margin-left:6px}',
      '.pp-line{display:inline-block;width:26mm;height:1.1em;border-bottom:1px solid #5b6675;vertical-align:-3px}',
      '.pp-f-name .pp-line{width:46mm}',
      '.pp-box{display:inline-block;width:12px;height:12px;border:1px solid #3a4556;margin:0 3px 0 8px;vertical-align:-2px}',
      '.pp-box:first-child{margin-left:0}',
      //   「面接」「評価」の帯（濃紺の地に白い文字。紙の上でもどこからが面接のあとに付ける部分か分かる）
      '.pp-part{display:flex;align-items:baseline;gap:8px;margin:7px 0 4px;padding:2px 6px;border-radius:3px;background:#24324a;color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.06em}',
      '.pp-part small{font-size:9.5px;font-weight:600;letter-spacing:0;color:#d5dbe3}',
      '.pp-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}',
      '.pp-col{min-width:0}',
      '.pp-sec{margin-top:7px}.pp-col>.pp-sec:first-child{margin-top:0}',

  // 面接記入シートを 1 ページに収める（docs/SPEC-flow.md 5-3。clFitSheet と同じ形）。.pp-measure を付けた内容の高さが limit 以下になる最初の段階で止める:
  //   pp-a3（質問ごとに答えの線 3 本）→ pp-a2（2 本）→ pp-a1（1 本）→ pp-a1 pp-compact（詰める）→ 縮小（zoom。最大 12 回・0.3 まで）。

  function fitPaperSheet(sheet, limit) {

    var cls = sheet.classList, lv = [['pp-a3'], ['pp-a2'], ['pp-a1'], ['pp-a1', 'pp-compact']], all = ['pp-a3', 'pp-a2', 'pp-a1', 'pp-compact'];

  // ---------- 保存 HTML（A4 縦の用紙 1 枚。docs/SPEC-a4.md 1 章・3 章） ----------

      'var LIMIT=' + CL_SHEET_LIMIT_PX + ',PAPER_W=793.7;\n(' + a4PageScript.toString() + ')(LIMIT,PAPER_W);\n})();';

      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      '<title>面接チェックリスト報告 - ' + esc(name) + ' | ' + esc(meta.theaterName) + '</title>\n' +

  // 保存 HTML の用紙の操作（docs/SPEC-a4.md 3 章・11 章）。generateReportHTML がソースをそのまま埋め込み、clFitSheet と stamp.js の関数
  //   （stampSvg・shortName・verdictSvg・decisionSheetHtml・decisionFilename）・lock.js の関数（sha256Hex・hashPassword・isLocked・verify）と同じ IIFE の中で呼ぶ。アプリでは呼ばない。

  //   狭い画面の縮小（--a4-zoom。transform:scale なのでレイアウトは変わらない。12 章 F7）は従来どおり計測の前に外し、計測のあとで付け直す

        '<a href="#s-meta">劇場情報</a><a href="#s-applicant">応募者の属性</a><a href="#s-checklist">面接チェックリスト</a>' +
        '<a href="#s-mgmt">応募者の管理（押印）</a><a href="#s-io">書き出し／読み込み</a>' +
      '</nav>' +
      '<div class="settings-body">' +
        issuesHtml() +
        metaHtml() + applicantHtml() + checklistHtml() + mgmtHtml() + ioHtml() +
      '</div>' +
    '</div>' +
    '<div class="save-bar"><span class="note">変更は「設定を保存」で反映されます。</span>' +
      '<button type="button" class="btn ghost" data-action="discard">変更を破棄</button>' +
      '<button type="button" class="btn primary" data-action="save">設定を保存</button></div>';
  }

  function issuesHtml() {
    if (!issues || !issues.errors.length) return '';
    return '<div class="alert danger s-issues" id="settingsIssues"><div><b>保存できません。次の項目を直してください。</b><ul>' +
      issues.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div></div>';
  }

  function metaHtml() {
    return section('s-meta', '劇場情報', '画面上部・保存ファイルに表示されます。',
      '<div class="field-row">' + sInput('meta.theaterName', '劇場名') + sInput('meta.appTitle', 'アプリ名') + '</div>' +
      '<div class="field-row">' + sInput('meta.version', 'バージョン表記') + '</div>' +
      sTextarea('meta.footer', 'フッター（著作権表記など）', { rows: 2 }));
  }

  // ---------- 面接チェックリスト（面接台本。docs/SPEC-checklist.md 5 章） ----------
  const CL_TYPE_NAMES = { must: '必須条件', fields: '記入欄', explain: '説明', question: '質問', rating: '確認点（○△×）', notify: '合否連絡', note: '注記' };
  const CL_NEW_TITLE = { must: '必須条件', fields: '', explain: '説明', question: '質問', rating: '確認点', notify: '合否連絡', note: '' };
  const CL_KINDS = [{ value: 'text', label: '文字' }, { value: 'date', label: '日付' }, { value: 'month', label: '年月' }, { value: 'choice', label: '選択式' }];
  let clOpen = {};   // 台本のセクション（<details>）の開閉。再描画で閉じないように覚える

  function clR() { return R(); }
  function clCirc(n) { const f = clR().circled; return f ? f(n) : '(' + n + ')'; }
  function clDraft() {
    if (!U.isObj(draft.checklist) || !Array.isArray(draft.checklist.sections)) {
      draft.checklist = U.deepClone(global.RECRUIT_DEFAULT_PROFILE.checklist);
    }
    return draft.checklist;
  }
  // 満点（確認点 n＋総合判断）= 2(n+1)。面接評価の帯の境界の表示にも使う
  function clMax() {
    const Rr = clR();
    return Rr.interviewModel && Rr.emptyChecklist ? Rr.interviewModel(draft, Rr.emptyChecklist()).max : 0;
  }
  function clRatingCount() {
    const Rr = clR();
    return Rr.checklistItems ? Rr.checklistItems(clDraft(), 'rating').length : 0;
  }
  function rowBtns(prefix, attrs, idx, len, opts) {
    opts = opts || {};
    return '<div class="row-actions">' +
      '<button type="button" class="btn ghost" data-action="' + prefix + '-up" ' + attrs + ' title="上へ"' + (idx === 0 ? ' disabled' : '') + '>↑</button>' +
      '<button type="button" class="btn ghost" data-action="' + prefix + '-down" ' + attrs + ' title="下へ"' + (idx === len - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button type="button" class="btn ghost danger" data-action="' + prefix + '-del" ' + attrs + ' title="削除"' + (opts.noDelete ? ' disabled' : '') + '>削除</button>' +
    '</div>';
  }
  function checkTag(path, label, opts) {
    opts = opts || {};
    return '<label class="s-cl-check"><input type="checkbox" data-bind="' + esc(path) + '"' + (val(path) ? ' checked' : '') + (opts.repaint ? ' data-repaint' : '') + '><span>' + esc(label) + '</span></label>';
  }

  function clItemHtml(b, ip, i, j, k, len) {
    const it = b.items[k];
    const attrs = 'data-sec="' + i + '" data-block="' + j + '" data-index="' + k + '"';
    const label = b.type === 'question'
      ? '<textarea data-bind="' + esc(ip + '.label') + '" rows="2" aria-label="質問文">' + esc(it.label || '') + '</textarea>'
      : inputTag(ip + '.label', { aria: b.type === 'fields' ? '欄の名前' : '文言' });
    let extra = '';
    // A4「面接チェックリスト報告」（1 枚）と面接記入シートで使う短い名前（質問・合否連絡・記入欄・説明・確認点。空なら文言の先頭 14 文字。docs/SPEC-persona.md D16）
    const shortTag = b.type === 'question' || b.type === 'notify' || b.type === 'fields' || b.type === 'explain' || b.type === 'rating'
      ? '<div class="inline s-cl-short">' + inputTag(ip + '.short', { aria: '報告書での短い名前', placeholder: '報告書（A4 1 枚）での短い名前（任意。空なら文言の先頭 14 文字）' }) + '</div>' : '';
    if (b.type === 'rating') {
      extra = inputTag(ip + '.hint', { aria: '補足', placeholder: '補足（任意。例: 「大丈夫です」のみ連呼は要注意）' });
    } else if (b.type === 'explain') {
      extra = checkTag(ip + '.shortOnly', '※短期求人のみ（応募した求人が短期求人のとき強調）');
    } else if (b.type === 'fields') {
      const kind = CL_KINDS.some(function (o) { return o.value === it.kind; }) ? it.kind : 'text';
      extra = '<div class="inline">' + selectTag(ip + '.kind', CL_KINDS, { repaint: true, aria: '入力の種類' }) + '</div>';
      if (kind === 'choice') {
        const text = (Array.isArray(it.options) ? it.options : []).map(function (o) { return o.value + '|' + (o.label || ''); }).join('\n');
        extra += '<div class="field s-cl-options"><label>選択肢（1行に「値|表示名」）</label><textarea data-bind="' + esc(ip + '.options') + '" data-type="options" rows="2">' + esc(text) + '</textarea></div>';
      }
    }
    return '<div class="s-cl-item" data-item-id="' + esc(it.id) + '"><span class="idx">' + (k + 1) + '</span>' +
      '<div class="s-cl-item-main">' + label + (extra || shortTag ? '<div class="s-cl-item-extra">' + extra + shortTag + '</div>' : '') + '</div>' +
      rowBtns('cl-item', attrs, k, len) + '</div>';
  }

  function clBlockHtml(b, bp, i, j, len) {
    const attrs = 'data-sec="' + i + '" data-block="' + j + '"';
    const items = Array.isArray(b.items) ? b.items : (b.items = []);
    const memoable = b.type === 'question' || b.type === 'explain';
    return '<div class="s-cl-block" data-block-type="' + esc(b.type) + '">' +
      '<div class="s-cl-block-head"><span class="badge info">' + esc(CL_TYPE_NAMES[b.type] || b.type) + '</span>' +
        (b.type === 'note' ? '' : inputTag(bp + '.title', { aria: '見出し', placeholder: '見出し（【】は自動で付きます）' })) +
        inputTag(bp + '.note', { aria: b.type === 'note' ? '注記の本文' : '注記', placeholder: b.type === 'note' ? '注記の本文（例: 条件一致：2へ）' : '注記（任意）' }) +
        rowBtns('cl-block', attrs, j, len) +
      '</div>' +
      (memoable ? '<div class="s-cl-memo">' + checkTag(bp + '.memo', 'メモ欄を出す', { repaint: true }) +
        (b.memo ? inputTag(bp + '.memoLabel', { aria: 'メモ欄の名前', placeholder: 'メモ' }) : '') + '</div>' : '') +
      (b.type === 'note' ? '' : items.map(function (it, k) { return clItemHtml(b, bp + '.items[' + k + ']', i, j, k, items.length); }).join('') +
        '<div class="actions s-cl-item-add"><button type="button" class="btn sm ghost" data-action="cl-item-add" ' + attrs + '>＋ 項目を追加</button></div>') +
    '</div>';
  }

  function clSectionHtml(sec, i, len, pageOpts) {
    const sp = 'checklist.sections[' + i + ']';
    const blocks = Array.isArray(sec.blocks) ? sec.blocks : (sec.blocks = []);
    const counts = {};
    blocks.forEach(function (b) { counts[b.type] = (counts[b.type] || 0) + (Array.isArray(b.items) ? b.items.length : 0); });
    const sumText = ['must', 'rating'].filter(function (t) { return counts[t]; }).map(function (t) { return (t === 'must' ? '必須条件 ' : '確認点 ') + counts[t]; }).join('・');
    const open = Object.prototype.hasOwnProperty.call(clOpen, sec.id) ? clOpen[sec.id] : i === 0;
    return '<details class="s-details s-cl-sec" data-sec-id="' + esc(sec.id) + '"' + (open ? ' open' : '') + '>' +
      '<summary><span class="s-cl-no">' + clCirc(i + 1) + '</span> ' + esc(sec.title || '（名前なし）') +
        (sec.minutes ? ' <span class="hint">' + (sec.minutesMax ? '最大' : '') + sec.minutes + '分</span>' : '') +
        (sumText ? ' <span class="hint">' + esc(sumText) + '</span>' : '') + '</summary>' +
      '<div class="s-cl-sec-row">' +
        '<div class="field"><label>セクション名</label>' + inputTag(sp + '.title', { aria: 'セクション名' }) + '</div>' +
        '<div class="field"><label>目安時間</label><div class="inline">' + inputTag(sp + '.minutes', { type: 'number', min: 0, max: 60, step: 1, aria: '目安時間' }) + '<span class="suffix">分</span>' +
          checkTag(sp + '.minutesMax', '最大') + '</div></div>' +
        '<div class="field"><label>ページ（印刷）</label>' + selectTag(sp + '.page', pageOpts, { repaint: true, aria: 'ページ' }) + '</div>' +
        '<div class="field"><label>並び・削除</label>' + rowBtns('cl-sec', 'data-sec="' + i + '"', i, len, { noDelete: len <= 1 }) + '</div>' +
      '</div>' +
      sTextarea(sp + '.lead', 'セクションの説明（任意）', { rows: 1 }) +
      blocks.map(function (b, j) { return clBlockHtml(b, sp + '.blocks[' + j + ']', i, j, blocks.length); }).join('') +
      '<div class="actions s-cl-add"><select data-cl-newtype aria-label="追加するブロックの種類">' +
        Object.keys(CL_TYPE_NAMES).map(function (t) { return '<option value="' + t + '"' + (t === 'rating' ? ' selected' : '') + '>' + esc(CL_TYPE_NAMES[t]) + '</option>'; }).join('') +
        '</select><button type="button" class="btn sm" data-action="cl-block-add" data-sec="' + i + '">＋ ブロックを追加</button></div>' +
    '</details>';
  }

  function checklistHtml() {
    const cl = clDraft();
    const secs = cl.sections;
    const pages = Array.isArray(cl.pages) ? cl.pages : (cl.pages = []);
    const oo = U.isObj(cl.overallOptions) ? cl.overallOptions : (cl.overallOptions = {});
    const hd = U.isObj(cl.header) ? cl.header : (cl.header = {});
    const posting = U.isObj(hd.posting) ? hd.posting : (hd.posting = { label: '', options: [] });
    const nRating = clRatingCount();
    const capOpts = [{ value: 'none', label: '調整しない' }, { value: 'review', label: resultTitle('review') + 'まで' }, { value: 'reject', label: resultTitle('reject') }];
    const maxPage = Math.max(pages.length, secs.reduce(function (m, s) { return Math.max(m, n(s.page, 1)); }, 1), 1);
    const pageOpts = [];
    for (let k = 1; k <= maxPage; k++) {
      const pg = pages.find(function (x) { return U.isObj(x) && Number(x.no) === k; });
      pageOpts.push({ value: k, label: k + '枚目' + (pg && pg.title ? '（' + pg.title + '）' : '') });
    }
    const mfields = ((draft.management || {}).fields || []).filter(function (f) { return f && f.id; });
    const pOpts = Array.isArray(posting.options) ? posting.options : [];
    // 人物像（1〜5 点。docs/SPEC-persona.md 6-2）
    const pd = U.isObj(cl.persona) ? cl.persona : (cl.persona = U.deepClone(global.RECRUIT_DEFAULT_PROFILE.checklist.persona));
    const psItems = Array.isArray(pd.items) ? pd.items.filter(function (it) { return U.isObj(it); }) : [];
    const psMax = psItems.length * 5;
    const psLabels = Array.isArray(pd.scaleLabels) ? pd.scaleLabels : [];
    const psText = psItems.map(function (it) {
      const parts = [it.label || '', it.short || '', it.hint || ''];
      while (parts.length > 1 && !parts[parts.length - 1]) parts.pop();
      return parts.join('|');
    }).join('\n');
    const personaHtml = '<h3 class="sub" id="s-persona">人物像（1〜5 点）</h3>' +
      '<div class="hint">' + stepRef(3) + 'の総評で項目ごとに 1〜5 点（' + esc([0, 1, 2, 3, 4].map(function (i) { return (i + 1) + ' ' + (psLabels[i] || ''); }).join('・')) + '）を付けます。結果（推奨）は下げる方向にだけ使います（上げることはありません）。</div>' +
      sCheck('checklist.persona.enabled', '人物像を使う', 'OFF にすると' + stepRef(3) + 'に出さず、判定にも使いません。保存済みの報告書（HTML）は保存したときのままです。') +
      '<div class="s-cl-max" id="clPsMaxNote">人物像 <b>' + psItems.length + '</b> 項目 × 5 点 ＝ 満点 <b>' + psMax + '</b> 点</div>' +
      '<div class="field-row">' + sInput('checklist.persona.title', '見出し（' + stepRef(3) + 'と報告書）') + '</div>' +
      '<div class="field"><label>項目（1 行に「項目名|短い名前|説明」）</label><textarea data-bind="checklist.persona.items" data-type="persona" data-repaint rows="8">' + esc(psText) + '</textarea>' +
        '<div class="hint">短い名前（判定の理由・記入シート）と説明（' + stepRef(3) + 'に小さく表示）は省略できます。上から表示の順です。項目名を変えなければ、並べ替えても入力済みの点は引き継ぎます。</div></div>' +
      '<div class="field-row">' +
        sInput('checklist.persona.keepPct', 'そのまま（得点率）', { type: 'number', min: 0, max: 100, repaint: true, suffix: '% 以上（満点 ' + psMax + ' 点では ' + Math.ceil(psMax * n(pd.keepPct, 70) / 100) + ' 点以上）' }) +
        sInput('checklist.persona.rejectBelowPct', '不採用推奨（得点率）', { type: 'number', min: 0, max: 100, repaint: true, suffix: '% 未満（' + Math.ceil(psMax * n(pd.rejectBelowPct, 40) / 100) + ' 点未満。その間は' + resultTitle('review') + 'まで）' }) +
      '</div>' +
      '<div class="field-row">' +
        sSelect('checklist.persona.onePointResult', '1 点の項目があるとき', capOpts) +
        sSelect('checklist.persona.unscoredResult', '未入力の項目があるとき', capOpts) +
      '</div>';
    // 面接評価の帯（高・中・低）の境界 evaluation.thresholds
    const th = (draft.evaluation || {}).thresholds || {};
    const bMax = clMax();
    const bandHtml = '<div class="field-row" id="clBandInputs">' +
          sInput('evaluation.thresholds.recommendPct', '面接評価の帯: 高', { type: 'number', min: 0, max: 100, repaint: true, suffix: '% 以上（現在の満点 ' + bMax + '点では ' + Math.ceil(bMax * n(th.recommendPct, 70) / 100) + '点以上）' }) +
          sInput('evaluation.thresholds.reviewPct', '面接評価の帯: 中', { type: 'number', min: 0, max: 100, repaint: true, suffix: '% 以上（' + Math.ceil(bMax * n(th.reviewPct, 40) / 100) + '点以上。未満は 低）' }) +
        '</div>' +
        '<div class="hint" style="margin:-6px 0 8px">報告書の「面接評価（確認点）」に出す 高・中・低 の境界です。結果（推奨）は総合判断で決まり、この境界では変わりません。</div>';

    return section('s-checklist', '面接チェックリスト',
      '面接台本のチェックリストです。必須条件（一致／不一致）と確認点（○△×）・総合判断で面接評価を計算します。文言・項目の増減・確認点の有無を編集できます。面接評価の帯（高・中・低）の境界と、人物像（1〜5 点）の項目・結果を下げる境界もこの節で設定します。',
      '<div class="s-cl-max" id="clMaxNote">確認点 <b>' + nRating + '</b> 項目＋総合判断 ＝ 満点 <b>' + clMax() + '</b> 点<span class="hint">（○2・△1・×0、総合判断 採用2・保留1・不採用0）</span></div>' +

      '<h3 class="sub">判定</h3>' +
      '<div class="field-row">' +
        sSelect('checklist.mustFailResult', '必須条件に不一致があるとき', [{ value: 'reject', label: resultTitle('reject') }, { value: 'review', label: resultTitle('review') }],
          '台本どおりなら「' + resultTitle('reject') + '」。' + stepRef(2) + 'では「不一致のとき案内するセクション」へ進んで面接を終えるよう案内します。「' + resultTitle('review') + '」にすると、ほかのセクションの確認点も評価するよう案内します（どちらも未入力のまま報告書へ進めます）。') +
        sSelect('checklist.mustUnknownResult', '必須条件に未確認が残るとき', [{ value: 'none', label: '警告のみ（判定は変えない）' }, { value: 'review', label: '採用推奨に留めない（' + resultTitle('review') + 'まで）' }]) +
      '</div>' +
      '<div class="field-row">' +
        sSelect('checklist.overallCaps.hold', '総合判断「' + (oo.hold || '保留') + '」のとき', capOpts) +
        sSelect('checklist.overallCaps.reject', '総合判断「' + (oo.reject || '不採用') + '」のとき', capOpts) +
      '</div>' +
      '<div class="hint" id="clCapsScriptHint" style="margin:-6px 0 8px">総合判断がそのまま結果になります（採用→採用推奨・保留→上長最終判断要・不採用→不採用推奨）。ここで厳しくした場合だけ結果が下がります。</div>' +
      '<div class="field-row">' +
        sSelect('checklist.mustFailJumpTo', '不一致のとき案内するセクション', [{ value: '', label: '案内しない' }].concat(secs.map(function (s, i) { return { value: s.id, label: clCirc(i + 1) + ' ' + (s.title || '') }; }))) +
      '</div>' +
      bandHtml +

      '<h3 class="sub">総合判断</h3>' +
      '<div class="field-row">' + sInput('checklist.overallLabel', '見出し') + sInput('checklist.overallHint', '説明（' + stepRef(3) + 'に表示）') + '</div>' +
      '<div class="field-row cols-3">' +
        sInput('checklist.overallOptions.hire', '「採用」の表示名') + sInput('checklist.overallOptions.hold', '「保留」の表示名') + sInput('checklist.overallOptions.reject', '「不採用」の表示名') +
      '</div>' +
      '<div class="hint" style="margin:-6px 0 8px">点は 採用 2・保留 1・不採用 0 で固定です。</div>' +

      personaHtml +

      // 消極属性（negatives・morningOnlyEnd）の行は 2026-10-13 に削除（docs/SPEC-script-mode.md 12 章）
      '<h3 class="sub">ヘッダー</h3>' +
      '<div class="field-row">' +
        sSelect('checklist.header.interviewerField', '担当と連動する押印欄', [{ value: '', label: '連動しない' }].concat(mfields.map(function (f) { return { value: f.id, label: f.label || f.id }; })),
          '担当が空欄のときは、この押印欄の氏名を報告書の担当に使います（自動で押印はしません）。') +
      '</div>' +
      '<div class="field-row">' + sInput('checklist.header.posting.label', '「応募した求人」の見出し') +
        '<div class="field"><label>選択肢の表示名</label><div class="inline">' + pOpts.map(function (o, m) {
          return inputTag('checklist.header.posting.options[' + m + '].label', { aria: '表示名（値: ' + o.value + '）' });
        }).join('') + '</div><div class="hint">値 short（短期求人）のとき「※短期求人のみ」の説明を強調します。</div></div>' +
      '</div>' +

      // 「印刷」の行（checklist.print.showQuestions＝保存 HTML の「詳細」に質問文を載せる）は 2026-10-14 に削除（「詳細」表示ごと削除。docs/SPEC-a4.md）。
      //   報告書は常に A4 1 枚の要約（質問文・説明文は載せない）。キーは旧い設定・記録の互換のため正規化で残す

      '<h3 class="sub">台本</h3>' +
      '<div class="field-row">' + sInput('checklist.version', '版（例: 2026-10-08）', { hint: '報告書（A4）の「台本 … 版」に表示します。' }) + '</div>' +
      '<div class="field-row">' + pages.map(function (pg, k) {
        return '<div>' + sInput('checklist.pages[' + k + '].title', (pg.no || k + 1) + '枚目の見出し') + sTextarea('checklist.pages[' + k + '].lead', (pg.no || k + 1) + '枚目の説明', { rows: 2 }) + '</div>';
      }).join('') + '</div>' +
      '<div class="s-cl-secs">' + secs.map(function (sec, i) { return clSectionHtml(sec, i, secs.length, pageOpts); }).join('') + '</div>' +
      '<div class="actions" style="margin-top:10px">' +
        '<button type="button" class="btn sm" data-action="cl-sec-add">＋ セクションを追加</button>' +
        '<button type="button" class="btn sm ghost" data-action="cl-default">既定の台本（2026-10-08 版）に戻す</button>' +
      '</div>');
  }

  function clNewItem(type) {
    if (type === 'fields') return { id: U.uid('cl'), label: '新しい欄', kind: 'text' };
    return { id: U.uid('cl'), label: type === 'rating' ? '新しい確認点' : '新しい項目' };
  }
  function clNewBlock(type) {
    return {
      id: U.uid('blk'), type: type, title: CL_NEW_TITLE[type] || '', note: type === 'note' ? '新しい注記' : '',
      memo: type === 'question', memoLabel: type === 'question' ? 'メモ' : '',
      items: type === 'note' ? [] : [clNewItem(type)]
    };
  }
  function clDelConfirm(what) {
    return window.confirm('この' + what + 'を削除します。保存済みの応募者データのこの回答は表示・判定に使われなくなります（データは残ります）。よろしいですか？');
  }

  // 台本の構造の変更（追加・削除・並べ替え）。処理したら true
  function clOnClick(act, b, y) {
    if (act.indexOf('cl-') !== 0) return false;
    const cl = clDraft();
    const secs = cl.sections;
    const si = Number(b.dataset.sec), bi = Number(b.dataset.block), ki = Number(b.dataset.index);
    const sec = secs[si];
    const blocks = sec && Array.isArray(sec.blocks) ? sec.blocks : null;
    const blk = blocks ? blocks[bi] : null;
    const items = blk && Array.isArray(blk.items) ? blk.items : null;
    switch (act) {
      case 'cl-sec-add': {
        const lastPage = secs.reduce(function (m, s) { return Math.max(m, n(s.page, 1)); }, 1);
        const id = U.uid('sec');
        secs.push({ id: id, title: '新しいセクション', minutes: 0, minutesMax: false, page: lastPage, lead: '', blocks: [clNewBlock('rating')] });
        clOpen[id] = true;
        break;
      }
      case 'cl-sec-del':
        if (!sec || secs.length <= 1 || !clDelConfirm('セクション')) return true;
        if (cl.mustFailJumpTo === sec.id) cl.mustFailJumpTo = '';
        secs.splice(si, 1);
        break;
      case 'cl-sec-up': if (!swap(secs, si - 1, si)) return true; break;
      case 'cl-sec-down': if (!swap(secs, si, si + 1)) return true; break;
      case 'cl-block-add': {
        if (!sec) return true;
        const box = b.closest('.s-cl-add');
        const sel = box && box.querySelector('select[data-cl-newtype]');
        const type = sel && CL_TYPE_NAMES[sel.value] ? sel.value : 'rating';
        if (!Array.isArray(sec.blocks)) sec.blocks = [];
        sec.blocks.push(clNewBlock(type));
        clOpen[sec.id] = true;
        break;
      }
      case 'cl-block-del':
        if (!blk || !clDelConfirm('ブロック')) return true;
        blocks.splice(bi, 1);
        break;
      case 'cl-block-up': if (!blocks || !swap(blocks, bi - 1, bi)) return true; break;
      case 'cl-block-down': if (!blocks || !swap(blocks, bi, bi + 1)) return true; break;
      case 'cl-item-add':
        if (!blk) return true;
        if (!Array.isArray(blk.items)) blk.items = [];
        blk.items.push(clNewItem(blk.type));
        break;
      case 'cl-item-del':
        if (!items || !items[ki] || !clDelConfirm('項目')) return true;
        items.splice(ki, 1);
        break;
      case 'cl-item-up': if (!items || !swap(items, ki - 1, ki)) return true; break;
      case 'cl-item-down': if (!items || !swap(items, ki, ki + 1)) return true; break;
      case 'cl-default':
        if (!window.confirm('面接チェックリストを既定の台本（2026-10-08 版）に戻します（人物像の項目・境界も既定に戻ります）。編集した文言・項目は失われます。保存済みの応募者ファイルのレポートは保存時点の台本で表示されます。よろしいですか？')) return true;
        draft.checklist = U.deepClone(global.RECRUIT_DEFAULT_PROFILE.checklist);
        clOpen = {};
        break;
      default:
        return false;
    }
    paint(y);
    return true;
  }

  // 記入欄の入力の種類を選択式にしたら選択肢の見本を入れる
  function clOnBindChange(path, value) {
    const m = /^checklist\.sections\[(\d+)\]\.blocks\[(\d+)\]\.items\[(\d+)\]\.kind$/.exec(path);
    if (!m) return;
    const sec = clDraft().sections[Number(m[1])];
    const blk = sec && sec.blocks && sec.blocks[Number(m[2])];
    const it = blk && blk.items && blk.items[Number(m[3])];
    if (!it) return;
    if (value === 'choice' && !(Array.isArray(it.options) && it.options.length >= 2)) it.options = [{ value: 'a', label: '選択肢1' }, { value: 'b', label: '選択肢2' }];
  }

  function mgmtHtml() {

    const fields = Array.isArray(mg.fields) ? mg.fields : [];

    return section('s-mgmt', '応募者の管理（押印）', '報告書（A4 の用紙）の最下段に押印欄を出します。名簿から担当者を選ぶと日付入りのハンコが押され、保存した HTML でも用紙の欄をクリックして押印・保存できます。',
      '<div class="field-row">' +
        '<div>' + fields.map(function (fl, i) {
          return sInput('management.fields[' + i + '].label', '押印欄 ' + (i + 1) + '（' + esc(fl.id) + '）') +
            sInput('management.fields[' + i + '].hint', '　説明（任意）', { placeholder: '例：面接を行った担当者' });
        }).join('') + '</div>' +
        '<div><div class="field"><label>ハンコのプレビュー</label><div class="stamp-preview">' + preview + '</div><div class="hint">印字名・日付・役職の 3 段。印字名は 2〜4 文字が目安です。</div></div></div>' +
      '</div>' +
      sLines('management.managers', '担当者名簿（氏名|印字名|役職|等級）', { type: 'managers', hint: '例: 笹川 晴央|笹川|副支配人|S3 。印字名を省略すると姓（スペースの前）を使います。等級は任意（押印には使いません）。', rows: 17 }) +
      sCheck('management.allowFreeName', '名簿にない担当者を手入力で押せるようにする', 'OFF にすると名簿の担当者だけ選べます。') +
      decisionSettingsHtml(fields) + finalLockHtml());
  }

  // ---------- 最終承認のパスワード（docs/SPEC-a4.md 11 章） ----------
  //   下書きの management.finalLock（{ salt, hash }。平文は持たない）を変える。変更は下書きに入り、「設定を保存」で確定する。
  //   入力欄は data-bind を持たない（下書きに平文を入れない）。変更・外すには現在のパスワードが要る（設定済みのとき）
  function lockOf(p) { return ((p || {}).management || {}).finalLock; }
  function lockIsOn(l) { const L = global.RecruitLock; return !!(L && L.isLocked(l)); }
  function pwField(id, label) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><input type="password" id="' + id + '" class="lock-pw" autocomplete="off"></div>';
  }
  function finalLockHtml() {
    const lk = lockOf(draft), on = lockIsOn(lk);
    const saved = handlers && handlers.current ? lockOf(handlers.current()) : null;
    const key = function (l) { return lockIsOn(l) ? l.salt + ':' + l.hash : ''; };
    const pending = key(lk) !== key(saved);
    let body = '';
    if (lockForm === 'change') {
      body = '<div class="lock-form" id="finalLockForm" data-lock-form="change">' +
        (on ? pwField('lockCur', '現在のパスワード') : '') + pwField('lockNew', '新しいパスワード') + pwField('lockNew2', '新しいパスワード（確認）') +
        '<div class="lock-err" id="finalLockErr" role="alert"></div>' +
        '<div class="actions"><button type="button" class="btn sm primary" data-action="lock-apply" id="finalLockApply">' + (on ? '変更する' : '設定する') + '</button>' +
        '<button type="button" class="btn sm ghost" data-action="lock-cancel">キャンセル</button></div></div>';
    } else if (lockForm === 'remove') {
      body = '<div class="lock-form" id="finalLockForm" data-lock-form="remove">' + pwField('lockCur', '現在のパスワード') +
        '<div class="lock-err" id="finalLockErr" role="alert"></div>' +
        '<div class="actions"><button type="button" class="btn sm danger" data-action="lock-remove-apply" id="finalLockRemoveApply">パスワードを外す</button>' +
        '<button type="button" class="btn sm ghost" data-action="lock-cancel">キャンセル</button></div></div>';
    } else {
      body = '<div class="actions"><button type="button" class="btn sm" data-action="lock-change" id="finalLockChange">' + (on ? '変更' : '設定する') + '</button>' +
        (on ? '<button type="button" class="btn sm ghost danger" data-action="lock-remove" id="finalLockRemove">パスワードを外す</button>' : '') + '</div>';
    }
    return '<h3 class="sub" id="s-finalLock">最終承認のパスワード</h3>' +
      '<div class="hint">最終確認の押印・取消と最終合否（採用／不採用）の決定・取消の前に求めます（' + stepRef(4) + 'の画面と保存した HTML の両方。面接対応者の押印には要りません）。' +
        '誤操作を防ぐための鍵で、HTML をテキストで開いて書き換える人までは防げません。パスワードそのものは保存せず、照合用の値（ハッシュ）だけを設定に持ちます。' +
        '保存した HTML は保存した時点のパスワードで照合します。パスワードがあるとき、「押印欄と連動」・最終合否のスタンプの ON/OFF・押印欄の構成・押印欄の表示名を変えて保存するには現在のパスワードが要ります（押印欄の説明・名簿だけなら不要）。</div>' +
      '<div class="lock-status" id="finalLockStatus"><span class="badge ' + (on ? 'ok' : 'muted') + '">' + (on ? '設定済み' : '未設定') + '</span>' +
        (pending ? '<span class="hint">未保存の変更です。「設定を保存」で確定します。</span>' : '') + '</div>' + body;
  }
  function lockFocus() {
    const el = root && root.querySelector('#finalLockForm .lock-pw');
    if (el) el.focus();
  }
  // 「変更する」「設定する」「パスワードを外す」（フォームの確定。Enter も同じ）
  function lockApply(kind, y) {
    const L = global.RecruitLock;
    if (!L || !draft) return;
    const lk = lockOf(draft), on = lockIsOn(lk);
    const v = function (id) { const el = root.querySelector('#' + id); return el ? el.value : ''; };
    const err = function (msg, id) {
      const e = root.querySelector('#finalLockErr');
      if (e) e.textContent = msg;
      const el = root.querySelector('#' + id);
      if (el) { el.focus(); if (el.select) el.select(); }
    };
    if (on && !v('lockCur')) { err('現在のパスワードを入力してください', 'lockCur'); return; }
    if (on && !L.verify(lk, v('lockCur'))) { err('現在のパスワードが違います', 'lockCur'); return; }
    if (!U.isObj(draft.management)) draft.management = {};
    if (kind === 'remove') {
      // 「外した」印（off）。空のロック（{ salt: '', hash: '' }）は未設定＝既定のロック（ローカル版の初期パスワード）に戻る扱い（docs/SPEC-a4.md 11 章 L6c）
      draft.management.finalLock = { salt: '', hash: '', off: true };
    } else {
      if (!v('lockNew')) { err('新しいパスワードを入力してください', 'lockNew'); return; }
      if (v('lockNew') !== v('lockNew2')) { err('新しいパスワード（確認）が一致しません', 'lockNew2'); return; }
      draft.management.finalLock = L.makeLock(v('lockNew'));
    }
    lockForm = '';
    paint(y);
    if (handlers.onToast) handlers.onToast(kind === 'remove' ? '最終承認のパスワードを外しました。「設定を保存」で確定します' : '最終承認のパスワードを' + (on ? '変更' : '設定') + 'しました。「設定を保存」で確定します');
  }
  function onKey(e) {
    const t = e.target;
    if (e.key !== 'Enter' || !t || !t.classList || !t.classList.contains('lock-pw')) return;
    e.preventDefault();
    const f = t.closest('[data-lock-form]');
    if (f) lockApply(f.getAttribute('data-lock-form') === 'remove' ? 'remove' : 'change', window.scrollY);
  }

  // 最終合否（採用／不採用のスタンプ。docs/SPEC-report.md 7 章）
  function decisionSettingsHtml(fields) {
    const St = global.RecruitStamp;
    const dc = global.RecruitStorage && global.RecruitStorage.decisionConfig ? global.RecruitStorage.decisionConfig(draft) : null;
    const today = St ? St.stampDate(new Date()) : '';
    const preview = St && dc
      ? St.verdict({ label: dc.hireLabel, date: today, color: dc.hireColor, size: 96, id: 'stVdHire', sub: dc.sub }) +
        St.verdict({ label: dc.rejectLabel, date: today, color: dc.rejectColor, size: 96, id: 'stVdReject', sub: dc.sub })
      : '';
    return '<h3 class="sub">最終合否（採用／不採用のスタンプ）</h3>' +
      sCheck('management.decision.enabled', '最終合否のスタンプを使う', '保存ファイル（HTML）と' + stepRef(4) + 'に「採用」「不採用」のボタンを出します。アプリの判定（推奨）とは別の、最終確認者の決定として記録します。') +
      '<div class="field-row">' +
        '<div>' + sInput('management.decision.label', '表示名') +
          sInput('management.decision.hireLabel', '「採用」の表示名', { repaint: true }) +
          sInput('management.decision.rejectLabel', '「不採用」の表示名', { repaint: true }) +
          sInput('management.decision.hint', '説明（任意）') + '</div>' +
        '<div><div class="field"><label>スタンプのプレビュー</label><div class="stamp-preview verdict-preview">' + preview + '</div>' +
          '<div class="hint">採用は朱、不採用は藍。日付と劇場名が入ります。</div></div></div>' +
      '</div>' +
      sSelect('management.decision.stampField', '押印欄と連動', fields.filter(function (fl) { return fl && fl.id; }).map(function (fl) { return { value: fl.id, label: fl.label + '（' + fl.id + '）' }; }).concat([{ value: '', label: '連動しない' }]),
        '合否を押したとき、この押印欄にも同じ担当者の印を押せます。最終承認のパスワードがあるときは、最終確認の欄（final）とこの欄の押印にパスワードが要ります。また、この「押印欄と連動」・最終合否のスタンプの ON/OFF・押印欄の構成（追加・削除）・押印欄の表示名を変えて保存するには、現在のパスワードが要ります。') +
      sCheck('management.decision.autoStampFinal', '合否を押すと、連動する押印欄にも同じ担当者の印を押す（未押印のときだけ）') +
      sCheck('management.decision.filenameSuffix', '合否を付けて保存するとき、ファイル名の末尾に「_採用」「_不採用」を付ける');
  }

  function ioHtml() {
    return section('s-io', 'プロファイルの書き出し／読み込み', '他劇場へ展開するときは JSON を書き出して、相手側で読み込みます。',
      '<div class="actions">' +
        '<button type="button" class="btn" data-action="export">⬇ JSONを書き出す</button>' +
        '<button type="button" class="btn" data-action="import">⬆ JSONを読み込む</button>' +
        '<button type="button" class="btn danger" data-action="reset">初期設定（新宿既定）に戻す</button>' +
      '</div>' +
      '<div class="hint" style="margin-top:10px">設定はこのブラウザ（端末）内に保存されます。別の端末で使う場合は JSON を書き出して持ち運んでください。v1 形式の JSON は読み込むと既定の設定になります。削除した機能の設定は読み飛ばします。</div>');
  }

  // ---------- イベント ----------
  function coerce(t) {
    if (t.type === 'checkbox') return t.checked;
    if (t.type === 'number') return t.value === '' ? '' : Number(t.value);
    const dt = t.dataset.type;
    if (dt === 'lines') return t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (dt === 'managers') {
      return t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).map(function (line) {
        const parts = line.split(/[|｜]/).map(function (x) { return x.trim(); }); // 全角の「｜」も区切りとして受け付ける
        const name = parts[0] || '';
        const short = parts[1] || (global.RecruitStamp ? global.RecruitStamp.shortName(name) : name);
        const m = { name: name, short: short, title: parts[2] || '' };
        if (parts[3]) m.grade = parts[3];
        return m;
      }).filter(function (m) { return m.name; });
    }
    if (dt === 'options') {
      // 面接チェックリストの選択肢: 1 行に「値|表示名」（全角の「｜」も可。表示名を省略すると値）
      return t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).map(function (line) {
        const parts = line.split(/[|｜]/).map(function (x) { return x.trim(); });
        return { value: parts[0], label: parts[1] || parts[0] };
      }).filter(function (o) { return o.value; });
    }
    if (dt === 'persona') {
      // 人物像の項目: 1 行に「項目名|短い名前|説明」（全角の「｜」も可。説明は残りを | でつなぐ）。空行は捨てる。
      //   id は項目名が同じ既存の項目（下書き・保存済みの設定）のものを引き継ぐ（並べ替え・短い名前の変更では点が消えない。docs/SPEC-persona.md D20）。無ければ新しい id
      const cur = handlers && handlers.current ? U.getPath(handlers.current(), t.dataset.bind) : null;
      const old = [].concat(U.getPath(draft, t.dataset.bind) || [], cur || []).filter(function (o) { return U.isObj(o) && typeof o.id === 'string' && o.id; });
      const used = {};
      return t.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean).map(function (line) {
        const parts = line.split(/[|｜]/).map(function (x) { return x.trim(); });
        const label = parts[0] || '';
        const short = parts[1] || '';
        const hint = parts.slice(2).join('|').trim();
        const hit = old.find(function (o) { return o.label === label && !used[o.id]; });
        let id = hit ? hit.id : '';
        while (!id || used[id]) id = U.uid('ps');
        used[id] = true;
        const o = { id: id, label: label };
        if (short) o.short = short;
        if (hint) o.hint = hint;
        return o;
      });
    }
    if (dt === 'categories') {
      return t.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).map(function (line) {
        const parts = line.split('|');
        return { value: parts[0].trim(), group: (parts[1] || 'other').trim() || 'other' };
      });
    }
    return t.value;
  }

  function onEdit(e) {
    const t = e.target.closest('[data-bind]');
    if (!t) return;
    const v = coerce(t);
    U.setPath(draft, t.dataset.bind, v);
    clOnBindChange(t.dataset.bind, v);
    if (e.type === 'change' && t.hasAttribute('data-repaint')) requestRepaint();
  }

  function requestRepaint() {
    repaintPending = true;
    // 設定画面の中でマウスを押している最中（ボタン・チェックボックス等のクリック途中）だけ待つ
    if (pointerDown && downInRoot) {
      setTimeout(function () { flushRepaint(true); }, 1500); // mouseup が届かない場合の保険
      return;
    }
    setTimeout(flushRepaint, 0);
  }

  function flushRepaint(force) {
    if (!repaintPending || !root) return;
    if (pointerDown && downInRoot && !force) return;
    paint(window.scrollY);
  }

  function bindPointer() {
    if (pointerBound) return;
    pointerBound = true;
    document.addEventListener('mousedown', function (e) {
      pointerDown = true;
      downInRoot = !!(root && e.target && root.contains(e.target));
    }, true);
    // click は mouseup と同じタスクで発火するので、setTimeout で click の処理後に描き直す
    document.addEventListener('mouseup', function () {
      pointerDown = false; downInRoot = false;
      setTimeout(flushRepaint, 0);
    }, true);
  }

  function swap(arr, i, j) {
    if (i < 0 || j < 0 || i >= arr.length || j >= arr.length) return false;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    return true;
  }

  function doSave() {
    const S = global.RecruitStorage;
    const res = S && S.validateProfile ? S.validateProfile(draft) : { errors: [], warnings: [] };
    if (res.errors.length) {
      issues = res;
      paint(window.scrollY);
      const box = root.querySelector('#settingsIssues');
      if (box && box.scrollIntoView) box.scrollIntoView({ block: 'center' });
      handlers.onToast && handlers.onToast(res.errors[0] + (res.errors.length > 1 ? '（ほか' + (res.errors.length - 1) + '件）' : ''), 'error');
      return;
    }
    issues = null;
    // onSave は保存したかどうか（最終承認のパスワードを確かめるときは Promise）を返す。保存しなかったときは下書きを残し、注意の toast も出さない
    const warn = function (ok) { if (ok !== false && res.warnings.length && handlers.onToast) handlers.onToast('設定を保存しました。注意: ' + res.warnings.join(' / ')); };
    const r = handlers.onSave(U.deepClone(draft));
    if (r && typeof r.then === 'function') r.then(warn); else warn(r);
  }

  function onClick(e) {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const act = b.dataset.action;
    const y = window.scrollY;
    if (clOnClick(act, b, y)) return;

    switch (act) {
      case 'save':
        doSave();
        break;
      case 'discard':
        draft = U.deepClone(handlers.current());
        issues = null;
        lockForm = '';
        paint(y);
        handlers.onToast && handlers.onToast('変更を破棄しました');
        break;
      case 'export':
        handlers.onExport(U.deepClone(draft));
        break;
      case 'import':
        handlers.onImport();
        break;
      case 'reset':
        if (window.confirm('すべての設定を初期状態（新宿の既定値）に戻します。よろしいですか？')) { issues = null; handlers.onReset(); }
        break;
      case 'lock-change':
      case 'lock-remove':
        lockForm = act === 'lock-change' ? 'change' : 'remove';
        paint(y);
        lockFocus();
        break;
      case 'lock-cancel':
        lockForm = '';
        paint(y);
        break;
      case 'lock-apply':
        lockApply('change', y);
        break;
      case 'lock-remove-apply':
        lockApply('remove', y);
        break;
      default:
        break;
    }
  }

  function paint(scrollY) {
    repaintPending = false;
    // 面接チェックリストのセクション（<details>）の開閉を覚えておく
    if (root) Array.prototype.forEach.call(root.querySelectorAll('details.s-cl-sec[data-sec-id]'), function (d) { clOpen[d.getAttribute('data-sec-id')] = d.open; });
    root.innerHTML = template();
    root.oninput = onEdit;
    root.onchange = onEdit;
    root.onclick = onClick;
    root.onkeydown = onKey;
