<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リクルート判定システム</title>
  <meta name="description" content="アルバイト面接を面接台本（スタッフ面接チェックリスト）のとおりに入力し、A4 の面接チェックリスト報告（電子印・最終合否つき）を作るアプリ。準備 → 面接 → 評価 → 報告書の 4 ステップ。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- アイコン（インライン SVG。24×24・線 2・currentColor。docs/DESIGN.md 2 章）。<svg class="ico"><use href="#i-…"/></svg> で使う -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-say" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></symbol>
    <symbol id="i-ask" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.8"/><path d="M12 17.5h.01"/></symbol>
    <symbol id="i-check-list" viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="4" rx="1"/><path d="M16 4.5h2a2 2 0 0 1 2 2V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M18 13l-6 6-6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M14 2.5H6a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5z"/><path d="M14 2.5v6h6M8 13h8M8 17h8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V2.5h12V9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7.5H6z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-stamp" viewBox="0 0 24 24"><path d="M9 3h6v4.5l-1.5 2.5V13h4.5a2 2 0 0 1 2 2v2H4v-2a2 2 0 0 1 2-2h4.5v-3L9 7.5z"/><path d="M4 21h16"/></symbol>
  </svg>

  <div class="app">
    <!-- ===== サイドバー ===== -->
    <aside class="sidebar">
      <div class="brand" id="brand">
        <div class="brand-mark" id="brandMark" aria-hidden="true">R</div>
        <img class="brand-logo" id="brandLogo" alt="" hidden>
        <div class="brand-text">
          <div class="brand-title" id="brandTitle">リクルート判定システム</div>
          <div class="brand-sub" id="brandTheater">—</div>
        </div>
      </div>

      <nav class="nav" aria-label="メインメニュー">
        <button type="button" class="nav-item active" data-view="judge"><svg class="ico" aria-hidden="true"><use href="#i-report"/></svg><span id="navJudgeLabel">報告書の作成</span></button>
        <button type="button" class="nav-item" data-view="settings"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg><span>設定（劇場ルール）</span></button>
        <button type="button" class="nav-item" data-view="help"><svg class="ico" aria-hidden="true"><use href="#i-book"/></svg><span>使い方</span></button>
      </nav>

      <div id="stepSection">
        <div class="side-section-title" id="stepSectionTitle">手順</div>
        <ol class="steps" id="stepNav"></ol>
      </div>

      <div class="sidebar-foot">
        <button type="button" class="btn sm" id="btnTheme"><svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg><span class="theme-label">ダークモード</span></button>
        <div class="version" id="brandVersion"></div>
      </div>
    </aside>

    <!-- ===== メイン ===== -->
    <main class="main">
      <header class="topbar">
        <div class="top-title" id="topTitle">面接チェックリスト報告</div>
        <div class="chip-applicant" id="applicantChip"><span class="dot"></span><span>未入力</span></div>
        <div class="top-actions" id="topActions">
          <button type="button" class="btn sm" id="btnNew"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg><span>新規</span></button>
          <button type="button" class="btn sm" id="btnLoad"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg><span>読み込み</span></button>
          <button type="button" class="btn sm" id="btnSave"><svg class="ico" aria-hidden="true"><use href="#i-download"/></svg><span>保存<span class="lbl-x">（HTML）</span></span></button>
          <button type="button" class="btn sm" id="btnPrint" title="報告書（A4 の面接チェックリスト報告）を印刷します。紙に書いて面接するときは、準備の画面の「記入シート（手書き用）」を印刷してください"><svg class="ico" aria-hidden="true"><use href="#i-printer"/></svg><span class="sym" aria-hidden="true">🖨 </span><span><span class="lbl-x">報告書を</span>印刷</span></button>
        </div>
      </header>

      <!-- 本文の枠（.page。1120 を中央寄せ）: 本文（準備は右サマリーとの 2 列・面接・評価・報告書は 920 の 1 列）→ 著作権の行 → 操作行（#stepFoot の中。固定。4 画面で同じ座標）。docs/DESIGN.md 3-10・4-1 -->
      <section class="view" id="view-judge">
        <div class="page" id="judgePage">
          <div class="judge-layout">
            <div class="work" id="stepContent"></div>
            <aside class="summary" id="summaryPanel" aria-label="サマリー"></aside>
          </div>
          <div class="view-footer" id="footerText"></div>
          <div class="foot-host" id="stepFoot"></div>
        </div>
      </section>

      <section class="view hidden" id="view-settings"></section>
      <section class="view hidden" id="view-help"></section>
    </main>
  </div>
  <!-- 面接チェックリスト報告の印刷用ホスト。A4 の用紙（報告書の紙と同じ部品）を印刷の直前だけ描く（画面では非表示）。面接記入シート（手書き用）の印刷にも使う -->
  <div id="clSheet" class="cl-sheet-host" aria-hidden="true"></div>

  <input type="file" id="fileInput" accept=".html,.htm,.json" hidden>
  <input type="file" id="profileFileInput" accept=".json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="util.js"></script>
  <script src="brand.js"></script>
  <script src="stamp.js"></script>
  <script src="lock.js"></script>
  <script src="config.default.js"></script>
  <script src="rules.js"></script>
  <script src="storage.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
